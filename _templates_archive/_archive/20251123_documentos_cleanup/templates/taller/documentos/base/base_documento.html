{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
<link href="/static/css/estilo_futurista.css" rel="stylesheet">

<style>
  body {
    background: linear-gradient(120deg, #0f2027 0%, #2c5364 50%, #7f00ff 100%);
    min-height: 100vh;
    font-family: 'Orbitron', 'Montserrat', Arial, sans-serif;
  }

  .documento-container {
    background: rgba(20, 20, 40, 0.97);
    border-radius: 1.5rem;
    box-shadow: 0 0 32px 4px #7f00ff99, 0 0 0 1px #00f2fe;
    border: 1px solid #7f00ff;
    color: #fff;
    padding: 2.5rem;
    margin: 2rem auto;
    max-width: 1200px;
    position: relative;
    overflow: hidden;
  }

  .documento-title {
    color: #00f2fe;
    text-shadow: 0 0 8px #7f00ff;
    font-size: 2.2rem;
    font-weight: bold;
    margin-bottom: 2rem;
    text-align: center;
  }

  .seccion-card {
    background: rgba(30, 30, 60, 0.8);
    border-radius: 1rem;
    padding: 1.5rem;
    margin-bottom: 2rem;
    border: 1px solid rgba(0, 242, 254, 0.3);
  }

  .seccion-title {
    color: #00f2fe;
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 1rem;
    text-shadow: 0 0 4px #7f00ff;
  }

  .form-control {
    background: rgba(40, 40, 80, 0.9);
    border: 1px solid #00f2fe;
    border-radius: 0.5rem;
    color: #fff;
    padding: 0.75rem;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    background: rgba(50, 50, 100, 0.95);
    border-color: #7f00ff;
    box-shadow: 0 0 12px #7f00ff;
    outline: none;
  }

  .form-control::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .form-select {
    background: rgba(40, 40, 80, 0.9);
    border: 1px solid #00f2fe;
    border-radius: 0.5rem;
    color: #fff;
    padding: 0.75rem;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .form-select:focus {
    background: rgba(50, 50, 100, 0.95);
    border-color: #7f00ff;
    box-shadow: 0 0 12px #7f00ff;
    outline: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, #7f00ff, #00f2fe);
    border: none;
    border-radius: 0.75rem;
    color: #fff;
    font-weight: bold;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, #00f2fe, #7f00ff);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(127, 0, 255, 0.4);
  }

  .btn-secondary {
    background: rgba(40, 40, 80, 0.9);
    border: 1px solid #00f2fe;
    border-radius: 0.75rem;
    color: #00f2fe;
    font-weight: bold;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }

  .btn-secondary:hover {
    background: rgba(0, 242, 254, 0.1);
    border-color: #7f00ff;
    color: #7f00ff;
    transform: translateY(-1px);
  }

  /* Themes for document types */
  .theme-ot {
    border-color: #00f2fe;
    box-shadow: 0 0 32px 4px #00f2fe99, 0 0 0 1px #00f2fe;
  }

  .theme-fac {
    border-color: #ff6b6b;
    box-shadow: 0 0 32px 4px #ff6b6b99, 0 0 0 1px #ff6b6b;
  }

  .theme-fac .documento-title {
    color: #ff6b6b;
    text-shadow: 0 0 8px #ff6b6b;
  }

  .theme-fac .seccion-title {
    color: #ff6b6b;
    text-shadow: 0 0 4px #ff6b6b;
  }

  .theme-fac .btn-primary {
    background: linear-gradient(135deg, #ff6b6b, #ffa500);
  }

  .theme-fac .btn-primary:hover {
    background: linear-gradient(135deg, #ffa500, #ff6b6b);
    box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
  }

  .theme-fac .form-control:focus,
  .theme-fac .form-select:focus {
    border-color: #ff6b6b;
    box-shadow: 0 0 12px #ff6b6b;
  }

  .theme-pres {
    border-color: #4ecdc4;
    box-shadow: 0 0 32px 4px #4ecdc499, 0 0 0 1px #4ecdc4;
  }

  .theme-pres .documento-title {
    color: #4ecdc4;
    text-shadow: 0 0 8px #4ecdc4;
  }

  .theme-pres .seccion-title {
    color: #4ecdc4;
    text-shadow: 0 0 4px #4ecdc4;
  }

  .theme-pres .btn-primary {
    background: linear-gradient(135deg, #4ecdc4, #44a08d);
  }

  .theme-pres .btn-primary:hover {
    background: linear-gradient(135deg, #44a08d, #4ecdc4);
    box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
  }

  .theme-pres .form-control:focus,
  .theme-pres .form-select:focus {
    border-color: #4ecdc4;
    box-shadow: 0 0 12px #4ecdc4;
  }

  /* Totals section */
  .totales-section {
    background: rgba(20, 20, 40, 0.9);
    border-radius: 1rem;
    padding: 2rem;
    margin-top: 2rem;
    border: 2px solid #00f2fe;
  }

  .totales-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(0, 242, 254, 0.2);
  }

  .totales-total {
    border-bottom: none;
    border-top: 2px solid #00f2fe;
    margin-top: 1rem;
    padding-top: 1rem;
  }

  .subtotal-field {
    background: rgba(40, 40, 80, 0.5);
    padding: 0.5rem;
    border-radius: 0.25rem;
    border: 1px solid rgba(0, 242, 254, 0.3);
  }

  /* Dynamic elements */
  .dynamic-element {
    background: rgba(40, 40, 80, 0.7);
    border: 1px dashed #00f2fe;
    border-radius: 0.5rem;
    padding: 1rem;
    margin: 0.5rem 0;
    transition: all 0.3s ease;
  }

  .dynamic-element:hover {
    background: rgba(50, 50, 100, 0.8);
    border-style: solid;
  }

  /* Client search results */
  .cliente-item {
    transition: all 0.2s ease;
  }

  .cliente-item:hover {
    background: rgba(0, 242, 254, 0.1) !important;
  }

  /* Responsive design */
  @media (max-width: 768px) {
    .documento-container {
      margin: 1rem;
      padding: 1.5rem;
    }

    .documento-title {
      font-size: 1.8rem;
    }

    .btn-primary,
    .btn-secondary {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
    }
  }

  /* Animation effects */
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  .loading {
    animation: pulse 1.5s infinite;
  }

  /* BANNER DE IDENTIFICACIÓN */
  .template-banner {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: #00ff00;
    color: black;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 0 20px #00ff00;
    border: 3px solid #000;
  }
</style>
{% endblock %}

{% block content %}

<div class="documento-container">
  {% block documento_title %}{% endblock %}
  {% block documento_content %}{% endblock %}
</div>
{% endblock %}
