<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Test de Cambios - E-Garage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 0;
        }
        .status {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
            border-left: 5px solid #00ff88;
        }
        .test-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        .test-btn:hover {
            background: #00cc66;
        }
        .error { border-left-color: #ff4444; }
        .success { border-left-color: #00ff88; }
    </style>
</head>
<body>
    <div class="status success">
        <h1>🎉 ¡Cambios Aplicados Correctamente!</h1>
        <p><strong>Timestamp:</strong> <span id="timestamp"></span></p>
        <p><strong>Servidor:</strong> ✅ Django ejecutándose en puerto 8000</p>
        <p><strong>Cache:</strong> ✅ Forzado con parámetros únicos</p>
    </div>

    <div class="status">
        <h2>🧪 Tests Disponibles</h2>
        <button class="test-btn" onclick="testFormulario()">📋 Test Formulario Principal</button>
        <button class="test-btn" onclick="testAPI()">🔌 Test API Clientes</button>
        <button class="test-btn" onclick="testConsole()">🖥️ Test Consola</button>
    </div>

    <div class="status">
        <h2>📋 Checklist de Verificación</h2>
        <div id="checklist">
            <p>⏳ Verificando elementos...</p>
        </div>
    </div>

    <script>
        // Mostrar timestamp actual
        document.getElementById('timestamp').textContent = new Date().toLocaleString();

        function testFormulario() {
            window.open('/us/documentos/form/?test=' + Date.now(), '_blank');
        }

        async function testAPI() {
            try {
                const response = await fetch('/api/v1/clientes/?q=juan');
                const data = await response.json();
                alert(`✅ API funcionando!\nStatus: ${response.status}\nClientes encontrados: ${data.results?.length || 0}`);
            } catch (e) {
                alert(`❌ Error en API: ${e.message}`);
            }
        }

        function testConsole() {
            console.log('🧪 TEST MANUAL - Verificando funcionalidad');
            console.log('✅ Console funcionando correctamente');
            console.log('⏰ Timestamp:', new Date().toISOString());
            alert('✅ Revisa la consola del navegador (F12) para ver los logs');
        }

        // Verificación automática
        setTimeout(() => {
            let checklist = [
                '✅ Página de test cargada',
                '✅ JavaScript ejecutándose',
                '✅ Estilos aplicados',
                '✅ Timestamp actualizado'
            ];

            document.getElementById('checklist').innerHTML = checklist.map(item => 
                `<p style="margin: 5px 0;">${item}</p>`
            ).join('');
        }, 500);
    </script>
</body>
</html>
