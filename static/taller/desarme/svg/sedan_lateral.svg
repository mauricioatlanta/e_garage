<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" class="mapa-vehiculo-svg">
  <!-- Sedán vista lateral - zonas clickeables -->
  <defs>
    <style>
      .zona-map { fill: #9ca3af; stroke: #374151; stroke-width: 1; cursor: pointer; transition: fill 0.2s; }
      .zona-map:hover { fill: #6b7280; }
      .zona-map.estado-disponible { fill: #22c55e; }
      .zona-map.estado-dañado { fill: #ef4444; }
      .zona-map.estado-scrap { fill: #1f2937; }
      .zona-map.estado-vendido { fill: #3b82f6; }
      .zona-map.estado-reservada { fill: #eab308; }
    </style>
  </defs>
  <!-- Cuerpo base -->
  <rect x="20" y="70" width="360" height="70" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <!-- Capot/Hood -->
  <rect x="50" y="72" width="80" height="66" class="zona-map" data-zona="hood" data-nombre="Capot" data-vista="lateral_izq"/>
  <!-- Puerta delantera izquierda -->
  <rect x="135" y="72" width="70" height="66" class="zona-map" data-zona="left_front_door" data-nombre="Puerta delantera izquierda" data-vista="lateral_izq"/>
  <!-- Puerta trasera izquierda -->
  <rect x="210" y="72" width="70" height="66" class="zona-map" data-zona="left_rear_door" data-nombre="Puerta trasera izquierda" data-vista="lateral_izq"/>
  <!-- Maleta -->
  <rect x="285" y="72" width="85" height="66" class="zona-map" data-zona="trunk" data-nombre="Maleta" data-vista="lateral_izq"/>
  <!-- Parachoques delantero -->
  <rect x="25" y="78" width="25" height="58" class="zona-map" data-zona="front_bumper" data-nombre="Parachoques delantero" data-vista="lateral_izq"/>
  <!-- Parachoques trasero -->
  <rect x="350" y="78" width="25" height="58" class="zona-map" data-zona="rear_bumper" data-nombre="Parachoques trasero" data-vista="lateral_izq"/>
  <!-- Foco delantero -->
  <rect x="48" y="82" width="18" height="20" class="zona-map" data-zona="left_headlight" data-nombre="Foco delantero izquierdo" data-vista="lateral_izq"/>
  <!-- Foco trasero -->
  <rect x="334" y="82" width="18" height="20" class="zona-map" data-zona="left_taillight" data-nombre="Foco trasero izquierdo" data-vista="lateral_izq"/>
  <!-- Espejo -->
  <rect x="128" y="58" width="20" height="16" class="zona-map" data-zona="left_mirror" data-nombre="Espejo izquierdo" data-vista="lateral_izq"/>
  <!-- Rueda delantera (decorativa) -->
  <circle cx="90" cy="142" r="14" fill="#6b7280"/>
  <!-- Rueda trasera -->
  <circle cx="310" cy="142" r="14" fill="#6b7280"/>
</svg>
