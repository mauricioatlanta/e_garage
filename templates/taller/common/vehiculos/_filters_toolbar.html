<!-- Futuristic Search Interface -->
{% load i18n %}
{% load country_url %}
<div class="futuristic-search mb-8">
  <div class="flex items-center space-x-4">
    <div class="flex-1 relative">
      <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input type="search" id="search-input" name="q" value="{{ request.GET.q }}"
             placeholder="{% trans 'Search vehicles by plate, owner, brand...' %}"
             class="search-input w-full pl-12 pr-4">
      <div id="search-loading" class="absolute right-4 top-1/2 transform -translate-y-1/2 hidden">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-cyan-400"></div>
      </div>
    </div>
    <button type="button" id="search-btn" class="interactive-btn flex items-center space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <span>{% trans "Search" %}</span>
    </button>
  </div>
  <p id="search-status" class="mt-2 text-sm text-red-300" role="status" aria-live="polite" hidden></p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchLoading = document.getElementById('search-loading');
    const searchStatus = document.getElementById('search-status');
    let searchTimeout;
    let activeSearch;

    if (!searchInput) return;

    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(this.value.trim()), 250);
    });

    searchInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            clearTimeout(searchTimeout);
            performSearch(this.value.trim());
        }
    });

    if (searchBtn) {
        searchBtn.addEventListener('click', function() {
            clearTimeout(searchTimeout);
            performSearch(searchInput.value.trim());
        });
    }

    async function performSearch(query) {
        if (activeSearch) activeSearch.abort();
        activeSearch = new AbortController();
        const controller = activeSearch;
        if (searchLoading) searchLoading.classList.remove('hidden');
        if (searchStatus) {
            searchStatus.hidden = true;
            searchStatus.textContent = '';
        }

        const url = new URL(window.location.href);
        if (query) {
            url.searchParams.set('q', query);
        } else {
            url.searchParams.delete('q');
        }
        url.searchParams.delete('page');

        try {
            const response = await fetch(url, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                credentials: 'same-origin',
                signal: controller.signal
            });
            if (!response.ok) throw new Error(`Search failed (${response.status})`);

            const html = await response.text();
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            const results = parsed.getElementById('vehicle-results');
            const currentResults = document.getElementById('vehicle-results');
            if (!results || !currentResults) throw new Error('Vehicle results were not found');
            if (controller.signal.aborted) return;

            currentResults.innerHTML = results.innerHTML;
            window.history.replaceState({}, '', url);
        } catch (error) {
            if (error.name !== 'AbortError') {
                console.error('Vehicle search error:', error);
                if (searchStatus) {
                    searchStatus.textContent = 'No se pudo completar la búsqueda. Inténtalo nuevamente.';
                    searchStatus.hidden = false;
                }
            }
        } finally {
            if (activeSearch === controller && searchLoading) {
                searchLoading.classList.add('hidden');
            }
        }
    }
});
</script>
