{% load i18n %}
{% load country_url %}
<div
  class="inventario-sale-dock fixed inset-x-0 bottom-0 z-50 border-t border-cyan-400/25 bg-[#050816]/95 pb-[env(safe-area-inset-bottom,0)] shadow-[0_-12px_40px_rgba(0,0,0,0.5)] backdrop-blur-xl"
>
  <div class="mx-auto max-w-[1700px] px-2 py-2 sm:px-4 sm:py-3">
    <div class="flex flex-col gap-2 lg:flex-row lg:items-center lg:justify-between lg:gap-4">
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2">
          <span class="rounded-lg border border-emerald-400/25 bg-emerald-400/10 px-2.5 py-1 text-[11px] font-semibold text-emerald-200 sm:text-sm">
            <span x-text="selectedItems.length"></span> {% trans "seleccionados" %}
          </span>
          <span class="rounded-lg border border-fuchsia-400/25 bg-fuchsia-400/10 px-2.5 py-1 text-[11px] font-semibold text-fuchsia-200 sm:text-sm" x-text="formatCLP(totalPrice)"></span>
        </div>
        <div class="mt-1.5 flex max-h-14 flex-wrap gap-1 overflow-y-auto inventario-scroll" x-show="selectedItems.length > 0">
          <template x-for="item in selectedItems.slice(0, 8)" :key="item.id">
            <span class="max-w-[140px] truncate rounded-full border border-cyan-400/20 bg-cyan-400/10 px-2 py-0.5 text-[10px] text-cyan-100 sm:max-w-[180px]">
              <span x-text="item.sku || item.nombre"></span>
            </span>
          </template>
          <template x-if="selectedItems.length > 8">
            <span class="rounded-full border border-white/10 bg-white/5 px-2 py-0.5 text-[10px] text-slate-400">
              +<span x-text="selectedItems.length - 8"></span>
            </span>
          </template>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 sm:flex sm:flex-wrap sm:justify-end">
        <button
          type="button"
          @click="mobilePanel = !mobilePanel"
          class="h-11 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold text-slate-200 transition hover:border-cyan-400/30 sm:hidden"
        >
          {% trans "Detalle" %}
        </button>

        <button
          type="button"
          @click="clearSelection()"
          class="h-11 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold text-slate-200 transition hover:border-rose-400/30 hover:text-rose-200"
        >
          {% trans "Limpiar" %}
        </button>

        <button
          type="button"
          @click="openSalePanel()"
          :class="selectedItems.length === 0 ? 'opacity-45' : 'hover:shadow-[0_0_24px_rgba(34,211,238,0.18)]'"
          :disabled="selectedItems.length === 0"
          class="col-span-2 h-11 rounded-2xl border border-cyan-400/40 bg-gradient-to-r from-cyan-400/20 to-fuchsia-500/15 text-xs font-black uppercase tracking-[0.14em] text-cyan-100 transition enabled:hover:from-cyan-400/30 enabled:hover:to-fuchsia-500/25 sm:col-span-1 sm:min-w-[200px] sm:px-6"
        >
          {% trans "Ajustar y vender" %}
        </button>
      </div>
    </div>

    <div
      x-show="mobilePanel"
      x-transition
      class="mt-2 max-h-[min(70vh,22rem)] overflow-auto rounded-2xl border border-cyan-400/20 bg-slate-900/90 p-3 inventario-scroll sm:hidden"
    >
      <template x-if="selectedItems.length === 0">
        <div class="text-sm text-slate-400">{% trans "No hay fichas seleccionadas." %}</div>
      </template>

      <div class="space-y-3">
        <template x-for="item in selectedItems" :key="item.id">
          <div class="rounded-2xl border border-white/10 bg-[#07101c] p-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="truncate text-sm font-bold text-white" x-text="item.nombre"></div>
                <div class="text-[11px] text-slate-400" x-text="item.sku"></div>
              </div>
              <button
                type="button"
                @click="toggleSelect(item.id)"
                class="rounded-lg border border-rose-400/20 bg-rose-400/10 px-2 py-1 text-[10px] font-bold uppercase tracking-[0.16em] text-rose-200"
              >
                {% trans "Quitar" %}
              </button>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-2">
              <div class="rounded-xl border border-white/10 bg-black/20 px-3 py-2">
                <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Cantidad" %}</div>
                <input
                  type="number"
                  min="1"
                  x-model.number="quantities[item.id]"
                  @input="sanitizeQuantity(item.id)"
                  class="mt-1 w-full bg-transparent text-sm font-bold text-white outline-none"
                >
              </div>

              <div class="rounded-xl border border-white/10 bg-black/20 px-3 py-2">
                <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Precio venta" %}</div>
                <input
                  type="number"
                  min="0"
                  step="1"
                  x-model.number="salePrices[item.id]"
                  @input="sanitizePrice(item.id, item.precio)"
                  class="mt-1 w-full bg-transparent text-sm font-bold text-cyan-300 outline-none"
                >
              </div>
            </div>

            <div class="mt-3 flex items-center justify-between">
              <span class="text-xs text-slate-400">{% trans "Línea" %}</span>
              <div class="text-sm font-black text-emerald-300" x-text="formatCLP(lineTotal(item.id, item.precio))"></div>
            </div>
          </div>
        </template>
      </div>

      <form method="post" action="{% country_url 'desarme:crear_venta_desde_inventario' vehiculo.pk %}" class="mt-4">
        {% csrf_token %}
        <input type="hidden" name="selected_data" :value="serializedSelection">
        <button
          type="submit"
          :disabled="selectedItems.length === 0"
          :class="selectedItems.length === 0 ? 'opacity-40 cursor-not-allowed' : ''"
          class="w-full rounded-2xl bg-cyan-300 px-4 py-3 text-sm font-black uppercase tracking-[0.16em] text-slate-950"
        >
          {% trans "Crear venta" %}
        </button>
      </form>
    </div>
  </div>
</div>
