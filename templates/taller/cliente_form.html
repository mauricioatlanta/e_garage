{% extends "base.html" %}
{% block content %}
<div class="flex items-center gap-3 mb-2">
    <h1 class="text-2xl font-bold">Crear Cliente</h1>
    {% if empresa and empresa.pais == 'US' %}
        <img src="https://flagcdn.com/us.svg" alt="USA" style="width:32px;vertical-align:middle;">
    {% elif empresa and empresa.pais == 'CL' %}
        <img src="https://flagcdn.com/cl.svg" alt="Chile" style="width:32px;vertical-align:middle;">
    {% endif %}
</div>
<form method="post" class="max-w-lg mx-auto bg-black/40 p-6 rounded-xl shadow-2xl border border-cyan-400/60">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg shadow bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-white font-semibold hover:from-fuchsia-500 hover:to-cyan-500 transition-all duration-200 border border-cyan-400/60 mt-4" style="box-shadow:0 2px 12px 0 #00ffe7a0,0 1.5px 0 0 #fff2;">💾 Guardar Cliente</button>
</form>
{% endblock %}
