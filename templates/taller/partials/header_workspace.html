<header class="workspace-header">
  <div class="workspace-header-copy">
    <p class="workspace-meta">
      {{ workspace_company_name|default:company_name|default:'eGarage' }}
    </p>
    <h1 class="workspace-title">Workspace</h1>
  </div>
  <div class="workspace-header-actions">
    <span class="workspace-keyhint-mini">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <span class="workspace-keyhint-label">/</span>
    </span>
    <span class="workspace-keyhint-mini">
      <i class="fa-regular fa-keyboard" aria-hidden="true"></i>
      <span class="workspace-keyhint-label">Ctrl+K</span>
    </span>
  </div>
</header>
