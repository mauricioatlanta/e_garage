{% load humanize %}
<!DOCTYPE html>
<html lang="es">
<head>

    body { background: #020617; margin: 0; padding: 24px; }
    .wrap { max-width: 1100px; margin: 0 auto; }

<body>

    {{ document_label }} {{ documento.numero_documento|default:documento.id }}
  </div>
  <div class="wrap">
    {% include "taller/documentos/pdf/documento_profesional_inner.html" %}
