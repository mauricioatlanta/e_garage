# Configuración global
default_language_version:
  python: python3.13   # usa la versión disponible en el sistema

# ignora basura/respaldos en TODOS los hooks
exclude: |
  (?x)
  (
    ^templates_backup_.* |
    ^_disabled_templates/ |
    ^templates/_quarantine/ |
    \.zip$ |
    ^.*\.html\.py$
  )

repos:
  # Ruff - Linter y formatter rápido
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Black - Formatter de código
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  # isort - Organizador de imports
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black]

  # Django - Verificaciones específicas de Django
  - repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
        always_run: true

      - id: django-migrations
        name: Django migrations check
        entry: python manage.py makemigrations --check
        language: system
        pass_filenames: false
        always_run: true

  # Security - Verificaciones de seguridad
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, ., -f, json, -o, bandit-report.json]
        exclude: ^tests/

  # Safety - Verificación de dependencias vulnerables
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.*\.txt$

  # General - Hooks generales
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent, "2", --no-sort-keys]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
      - id: check-docstring-first
      - id: requirements-txt-fixer

  # Django específico
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.15.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.0"]

  # Tests - Ejecutar tests antes del commit
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: python
        pass_filenames: false
        types: [python]
        # evita autoload de plugins globales y asegura deps
        env:
          - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
        additional_dependencies:
          - pytest==8.3.2
          - coverage==7.6.1
          - pytest-cov==5.0.0

# Configuración global
default_stages: [commit, push]
fail_fast: false
