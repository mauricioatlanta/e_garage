# Añadir dentro del bloque http { } en /etc/nginx/nginx.conf
# Zonas de rate limit para eGarage (protección contra bots y escaneo).
# Incluir en nginx.conf: include /ruta/al/proyecto/scripts/nginx/egarage_ratelimit_http.snippet.conf;

# Login: 5 peticiones por minuto por IP (burst 10 para picos normales)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# Tráfico general: 15 peticiones por segundo por IP (burst 40)
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=15r/s;
