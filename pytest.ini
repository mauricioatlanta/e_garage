[pytest]
DJANGO_SETTINGS_MODULE = gestion_taller.settings.dev
testpaths =
    tests
    tests/unit
python_files = test_*.py tests/**/*.py *_test.py
addopts = -q --strict-markers --disable-warnings --maxfail=1 --cov=taller --cov=gestion_taller --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90
# Configuración optimizada para CI/CD
# -q: salida silenciosa
# --disable-warnings: sin warnings
# --maxfail=1: falla rápido
# --cov-fail-under=90: cobertura mínima del 90%

markers =
    slow: slow tests
    django_db: db access
    kpi: kpi tests
