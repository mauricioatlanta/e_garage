{% load i18n %}
<template x-if="filteredItems.length === 0">
  <div class="rounded-2xl border border-dashed border-cyan-400/20 bg-slate-900/50 p-10 text-center text-slate-400">
    {% trans "No hay repuestos con esos criterios." %}
  </div>
</template>

<div
  class="grid grid-cols-2 gap-2 sm:grid-cols-3 sm:gap-2.5 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6"
  x-show="filteredItems.length > 0"
>
  <template x-for="item in filteredItems" :key="item.id">
    <article
      @click="item.vendible !== false && toggleSelect(item)"
      :class="Number(item.stock) <= 0 || item.vendible === false
        ? 'inventario-tile inventario-tile--muted border-rose-400/25 bg-slate-900/50 cursor-default opacity-90'
        : (isSelected(item.id)
          ? 'inventario-tile inventario-tile--selected border-cyan-300/70 bg-cyan-400/10 shadow-[0_0_20px_rgba(34,211,238,0.2)] scale-[1.03] cursor-pointer'
          : 'inventario-tile border-white/10 bg-white/[0.04] hover:border-cyan-400/35 hover:bg-cyan-400/[0.06] cursor-pointer')"
      class="group relative overflow-hidden rounded-2xl border p-2.5 backdrop-blur-sm transition-all duration-200 sm:p-3"
    >
      <div class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-cyan-400/35 to-transparent"></div>

      <div class="mb-1.5 flex items-start justify-between gap-1.5">
        <span
          class="min-w-0 truncate rounded-md border border-cyan-400/15 bg-cyan-400/5 px-1.5 py-0.5 font-mono text-[9px] font-bold uppercase tracking-wider text-cyan-200/90 sm:text-[10px]"
          x-text="item.sku || '—'"
        ></span>
        <span
          :class="item.estado_pieza === 'FALTANTE' ? 'border-purple-400/40 bg-purple-500/15 text-purple-300'
                : item.estado_pieza === 'DANADA'   ? 'border-orange-400/40 bg-orange-500/15 text-orange-300'
                : Number(item.stock) > 0            ? 'border-emerald-400/25 bg-emerald-400/10 text-emerald-300'
                :                                     'border-rose-400/25 bg-rose-400/10 text-rose-300'"
          class="shrink-0 rounded-full border px-1.5 py-0.5 text-[8px] font-bold uppercase tracking-wider sm:text-[9px]"
          x-text="item.estado_pieza === 'FALTANTE' ? '{% trans "Faltante" %}'
                : item.estado_pieza === 'DANADA'   ? '{% trans "Dañada" %}'
                : Number(item.stock) > 0            ? '{% trans "stock" %}'
                :                                     '{% trans "agotado" %}'"
        ></span>
      </div>

      <!-- Banner inspección: pieza excluida por daño registrado -->
      <template x-if="item.estado_pieza === 'FALTANTE' || item.estado_pieza === 'DANADA'">
        <div class="mb-1.5 flex items-center gap-1 rounded-md border border-orange-400/25 bg-orange-500/10 px-1.5 py-1 text-[8px] font-semibold text-orange-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <span x-text="item.estado_pieza === 'FALTANTE' ? '{% trans "No disponible — faltante en inspección" %}' : '{% trans "No disponible — daño en inspección" %}'"></span>
        </div>
      </template>

      <h3
        class="mb-1 min-h-[2.25rem] line-clamp-2 text-[11px] font-bold leading-tight text-white sm:min-h-[2.5rem] sm:text-xs"
        x-html="highlightNombre(item.nombre)"
      ></h3>

      <div class="mb-2 flex items-center justify-between gap-1">
        <span
          class="max-w-[55%] truncate rounded-full border border-white/10 bg-black/25 px-2 py-0.5 text-[8px] font-semibold uppercase tracking-wider text-slate-400 sm:text-[9px]"
          x-text="item.categoria"
        ></span>
        <span class="truncate text-right text-sm font-black text-cyan-300 sm:text-base" x-text="formatCLP(item.precio)"></span>
      </div>

      <div class="flex items-center justify-between gap-1.5">
        <span class="text-[9px] font-medium tabular-nums text-slate-500 sm:text-[10px]">
          ×<span x-text="item.stock"></span>
        </span>
        <span
          :class="isSelected(item.id)
            ? 'border-cyan-300/50 bg-cyan-400/15 text-cyan-100'
            : 'border-white/10 bg-white/5 text-slate-400'"
          class="rounded-lg border px-2 py-1 text-[8px] font-bold uppercase tracking-wider transition sm:text-[9px]"
        >
          <span x-show="!isSelected(item.id)">{% trans "Elegir" %}</span>
          <span x-show="isSelected(item.id)">{% trans "Activo" %}</span>
        </span>
      </div>

      <template x-if="isStaff">
        <a
          :href="editUrl(item.id)"
          @click.stop
          class="mt-2 block w-full rounded-lg border border-fuchsia-400/20 bg-fuchsia-500/10 py-1.5 text-center text-[8px] font-bold uppercase tracking-wider text-fuchsia-200 transition hover:bg-fuchsia-500/15 sm:text-[9px]"
        >
          {% trans "Editar" %}
        </a>
      </template>
    </article>
  </template>
</div>
