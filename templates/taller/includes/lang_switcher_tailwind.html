{% if request.empresa and request.empresa.pais == "US" %}
<div class="flex items-center space-x-2">
  <form action="{% url 'set_language_us' %}" method="post" class="flex items-center space-x-2">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="lang" class="text-sm text-gray-600 dark:text-gray-400">Language</label>
    <select
      id="lang"
      name="language"
      class="px-2 py-1 text-sm border border-gray-300 rounded-md bg-white dark:bg-gray-800 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      onchange="this.form.submit()"
    >
      <option value="en" {% if request.LANGUAGE_CODE == 'en' %}selected{% endif %}>English</option>
      <option value="es" {% if request.LANGUAGE_CODE == 'es' %}selected{% endif %}>Español</option>
    </select>
  </form>
</div>
{% endif %}
