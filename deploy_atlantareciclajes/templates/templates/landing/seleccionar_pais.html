{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "eGarage" %} - {% trans "Plataforma de Gestión para Talleres" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #000000;
        }

        /* Sparkles Container */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00CED1;
            border-radius: 50%;
            box-shadow: 0 0 6px #00CED1, 0 0 12px #00CED1;
            animation: sparkleFloat 8s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
                transform: translateY(50vh) translateX(20px) scale(1);
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) translateX(40px) scale(0);
                opacity: 0;
            }
        }

        /* Header with floating logo */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 2rem 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { 
                transform: translateY(0) translateX(0);
            }
            50% { 
                transform: translateY(-8px) translateX(2px);
            }
        }

        .logo {
            height: 140px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(0, 206, 209, 0.4)) drop-shadow(0 0 40px rgba(0, 206, 209, 0.2));
            transition: filter 0.3s ease;
        }

        .logo:hover {
            filter: drop-shadow(0 0 30px rgba(0, 206, 209, 0.6)) drop-shadow(0 0 60px rgba(0, 206, 209, 0.3));
        }

        /* Main Content */
        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
            max-width: 1100px;
            width: 100%;
            padding: 2rem;
        }

        .country-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 2rem;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            color: #ffffff;
            border: 2px solid rgba(0, 206, 209, 0.3);
            background: linear-gradient(135deg, rgba(0, 206, 209, 0.08) 0%, rgba(0, 206, 209, 0.03) 100%);
            backdrop-filter: blur(15px);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(0, 206, 209, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Animated gradient overlay - base cyan, overridden by country styles */
        .country-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 206, 209, 0.15) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: transform 0.6s ease;
            animation: shimmer 3s infinite;
        }

        /* Country-specific shimmer colors */
        .country-chile::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(213, 43, 30, 0.2) 40%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(0, 57, 166, 0.2) 60%,
                transparent 70%
            );
        }
        .country-usa::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(178, 34, 52, 0.2) 40%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(60, 59, 110, 0.2) 60%,
                transparent 70%
            );
        }
        .country-mexico::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 104, 71, 0.2) 40%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(206, 17, 38, 0.2) 60%,
                transparent 70%
            );
        }
        .country-peru::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(217, 16, 35, 0.2) 40%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(217, 16, 35, 0.2) 60%,
                transparent 70%
            );
        }
        .country-colombia::before,
        .country-ecuador::before,
        .country-venezuela::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(252, 209, 22, 0.2) 40%,
                rgba(0, 56, 147, 0.15) 50%,
                rgba(206, 17, 38, 0.2) 60%,
                transparent 70%
            );
        }
        .country-ecuador::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 209, 0, 0.2) 40%,
                rgba(0, 51, 160, 0.15) 50%,
                rgba(237, 28, 36, 0.2) 60%,
                transparent 70%
            );
        }
        .country-venezuela::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 204, 2, 0.2) 40%,
                rgba(0, 36, 125, 0.15) 50%,
                rgba(207, 20, 43, 0.2) 60%,
                transparent 70%
            );
        }
        .country-brasil::before {
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 151, 57, 0.2) 40%,
                rgba(254, 221, 0, 0.2) 50%,
                rgba(1, 33, 105, 0.2) 60%,
                transparent 70%
            );
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        /* Ripple effect - base cyan */
        .country-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 206, 209, 0.4) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
            opacity: 0;
        }

        .country-btn:hover::before {
            animation: shimmer 1.5s infinite;
        }

        .country-btn:hover::after {
            width: 400px;
            height: 400px;
            opacity: 1;
        }

        /* Country-specific ripple colors */
        .country-chile:hover::after {
            background: radial-gradient(circle, rgba(213, 43, 30, 0.3) 0%, rgba(0, 57, 166, 0.2) 50%, transparent 70%);
        }
        .country-usa:hover::after {
            background: radial-gradient(circle, rgba(178, 34, 52, 0.3) 0%, rgba(60, 59, 110, 0.2) 50%, transparent 70%);
        }
        .country-mexico:hover::after {
            background: radial-gradient(circle, rgba(0, 104, 71, 0.3) 0%, rgba(206, 17, 38, 0.2) 50%, transparent 70%);
        }
        .country-peru:hover::after {
            background: radial-gradient(circle, rgba(217, 16, 35, 0.3) 0%, rgba(255, 255, 255, 0.15) 50%, transparent 70%);
        }
        .country-colombia:hover::after {
            background: radial-gradient(circle, rgba(252, 209, 22, 0.3) 0%, rgba(0, 56, 147, 0.2) 50%, rgba(206, 17, 38, 0.2) 70%, transparent 90%);
        }
        .country-ecuador:hover::after {
            background: radial-gradient(circle, rgba(255, 209, 0, 0.3) 0%, rgba(0, 51, 160, 0.2) 50%, rgba(237, 28, 36, 0.2) 70%, transparent 90%);
        }
        .country-venezuela:hover::after {
            background: radial-gradient(circle, rgba(255, 204, 2, 0.3) 0%, rgba(0, 36, 125, 0.2) 50%, rgba(207, 20, 43, 0.2) 70%, transparent 90%);
        }
        .country-brasil:hover::after {
            background: radial-gradient(circle, rgba(0, 151, 57, 0.3) 0%, rgba(254, 221, 0, 0.2) 50%, rgba(1, 33, 105, 0.2) 70%, transparent 90%);
        }

        /* Glowing border effect - base, overridden by country-specific hovers */
        .country-btn:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .country-btn span {
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: text-shadow 0.3s ease;
        }

        /* Text shadow on hover - base, overridden by country-specific styles */

        /* Base animated corner accents - will be overridden by country-specific styles */
        .country-btn {
            background-size: 200% 200%;
            background-position: 0% 0%, 100% 100%;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 0%, 100% 100%;
            }
            50% {
                background-position: 100% 100%, 0% 0%;
            }
        }

        /* Chile - Rojo, Blanco, Azul (franjas horizontales) */
        .country-chile {
            border-color: rgba(213, 43, 30, 0.4);
            background: 
                linear-gradient(to bottom, 
                    rgba(213, 43, 30, 0.25) 0%, 
                    rgba(213, 43, 30, 0.25) 33%,
                    rgba(255, 255, 255, 0.15) 33%,
                    rgba(255, 255, 255, 0.15) 66%,
                    rgba(0, 57, 166, 0.25) 66%,
                    rgba(0, 57, 166, 0.25) 100%
                ),
                linear-gradient(135deg, rgba(213, 43, 30, 0.1) 0%, rgba(0, 57, 166, 0.1) 100%);
            background-size: 100% 100%, 200% 200%;
        }
        .country-chile:hover {
            border-color: rgba(213, 43, 30, 0.8);
            box-shadow: 
                0 12px 40px rgba(213, 43, 30, 0.5),
                0 0 30px rgba(0, 57, 166, 0.4),
                0 0 0 2px rgba(213, 43, 30, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to bottom, 
                    rgba(213, 43, 30, 0.4) 0%, 
                    rgba(213, 43, 30, 0.4) 33%,
                    rgba(255, 255, 255, 0.25) 33%,
                    rgba(255, 255, 255, 0.25) 66%,
                    rgba(0, 57, 166, 0.4) 66%,
                    rgba(0, 57, 166, 0.4) 100%
                ),
                linear-gradient(135deg, rgba(213, 43, 30, 0.15) 0%, rgba(0, 57, 166, 0.15) 100%);
            background-size: 100% 100%, 200% 200%;
        }
        .country-chile:hover span {
            text-shadow: 0 2px 20px rgba(213, 43, 30, 0.9), 0 0 15px rgba(0, 57, 166, 0.7);
        }

        /* USA - Rojo, Blanco, Azul (franjas horizontales + azul con estrellas) */
        .country-usa {
            border-color: rgba(60, 59, 110, 0.4);
            background: 
                repeating-linear-gradient(
                    to bottom,
                    rgba(178, 34, 52, 0.25) 0%,
                    rgba(178, 34, 52, 0.25) 14.28%,
                    rgba(255, 255, 255, 0.2) 14.28%,
                    rgba(255, 255, 255, 0.2) 28.56%
                ),
                linear-gradient(to bottom,
                    rgba(60, 59, 110, 0.3) 0%,
                    rgba(60, 59, 110, 0.3) 40%,
                    rgba(178, 34, 52, 0.15) 40%,
                    rgba(178, 34, 52, 0.15) 100%
                );
            background-size: 100% 100%, 100% 100%;
        }
        .country-usa:hover {
            border-color: rgba(60, 59, 110, 0.8);
            box-shadow: 
                0 12px 40px rgba(60, 59, 110, 0.5),
                0 0 30px rgba(178, 34, 52, 0.4),
                0 0 0 2px rgba(60, 59, 110, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                repeating-linear-gradient(
                    to bottom,
                    rgba(178, 34, 52, 0.4) 0%,
                    rgba(178, 34, 52, 0.4) 14.28%,
                    rgba(255, 255, 255, 0.3) 14.28%,
                    rgba(255, 255, 255, 0.3) 28.56%
                ),
                linear-gradient(to bottom,
                    rgba(60, 59, 110, 0.45) 0%,
                    rgba(60, 59, 110, 0.45) 40%,
                    rgba(178, 34, 52, 0.25) 40%,
                    rgba(178, 34, 52, 0.25) 100%
                );
            background-size: 100% 100%, 100% 100%;
        }
        .country-usa:hover span {
            text-shadow: 0 2px 20px rgba(60, 59, 110, 0.9), 0 0 15px rgba(178, 34, 52, 0.7);
        }

        /* México - Verde, Blanco, Rojo (franjas verticales) */
        .country-mexico {
            border-color: rgba(0, 104, 71, 0.4);
            background: 
                linear-gradient(to right,
                    rgba(0, 104, 71, 0.3) 0%,
                    rgba(0, 104, 71, 0.3) 33%,
                    rgba(255, 255, 255, 0.2) 33%,
                    rgba(255, 255, 255, 0.2) 66%,
                    rgba(206, 17, 38, 0.3) 66%,
                    rgba(206, 17, 38, 0.3) 100%
                );
        }
        .country-mexico:hover {
            border-color: rgba(0, 104, 71, 0.8);
            box-shadow: 
                0 12px 40px rgba(0, 104, 71, 0.5),
                0 0 30px rgba(206, 17, 38, 0.4),
                0 0 0 2px rgba(0, 104, 71, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to right,
                    rgba(0, 104, 71, 0.45) 0%,
                    rgba(0, 104, 71, 0.45) 33%,
                    rgba(255, 255, 255, 0.3) 33%,
                    rgba(255, 255, 255, 0.3) 66%,
                    rgba(206, 17, 38, 0.45) 66%,
                    rgba(206, 17, 38, 0.45) 100%
                );
        }
        .country-mexico:hover span {
            text-shadow: 0 2px 20px rgba(0, 104, 71, 0.9), 0 0 15px rgba(206, 17, 38, 0.7);
        }

        /* Perú - Rojo, Blanco, Rojo (franjas horizontales) */
        .country-peru {
            border-color: rgba(217, 16, 35, 0.4);
            background: 
                linear-gradient(to bottom,
                    rgba(217, 16, 35, 0.3) 0%,
                    rgba(217, 16, 35, 0.3) 33%,
                    rgba(255, 255, 255, 0.25) 33%,
                    rgba(255, 255, 255, 0.25) 66%,
                    rgba(217, 16, 35, 0.3) 66%,
                    rgba(217, 16, 35, 0.3) 100%
                );
        }
        .country-peru:hover {
            border-color: rgba(217, 16, 35, 0.8);
            box-shadow: 
                0 12px 40px rgba(217, 16, 35, 0.5),
                0 0 30px rgba(217, 16, 35, 0.4),
                0 0 0 2px rgba(217, 16, 35, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to bottom,
                    rgba(217, 16, 35, 0.45) 0%,
                    rgba(217, 16, 35, 0.45) 33%,
                    rgba(255, 255, 255, 0.35) 33%,
                    rgba(255, 255, 255, 0.35) 66%,
                    rgba(217, 16, 35, 0.45) 66%,
                    rgba(217, 16, 35, 0.45) 100%
                );
        }
        .country-peru:hover span {
            text-shadow: 0 2px 20px rgba(217, 16, 35, 0.9), 0 0 15px rgba(217, 16, 35, 0.7);
        }

        /* Colombia - Amarillo, Azul, Rojo (franjas horizontales) */
        .country-colombia {
            border-color: rgba(252, 209, 22, 0.4);
            background: 
                linear-gradient(to bottom,
                    rgba(252, 209, 22, 0.35) 0%,
                    rgba(252, 209, 22, 0.35) 33%,
                    rgba(0, 56, 147, 0.3) 33%,
                    rgba(0, 56, 147, 0.3) 66%,
                    rgba(206, 17, 38, 0.35) 66%,
                    rgba(206, 17, 38, 0.35) 100%
                );
        }
        .country-colombia:hover {
            border-color: rgba(252, 209, 22, 0.8);
            box-shadow: 
                0 12px 40px rgba(252, 209, 22, 0.5),
                0 0 30px rgba(0, 56, 147, 0.4),
                0 0 0 2px rgba(252, 209, 22, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to bottom,
                    rgba(252, 209, 22, 0.5) 0%,
                    rgba(252, 209, 22, 0.5) 33%,
                    rgba(0, 56, 147, 0.45) 33%,
                    rgba(0, 56, 147, 0.45) 66%,
                    rgba(206, 17, 38, 0.5) 66%,
                    rgba(206, 17, 38, 0.5) 100%
                );
        }
        .country-colombia:hover span {
            text-shadow: 0 2px 20px rgba(252, 209, 22, 0.9), 0 0 15px rgba(206, 17, 38, 0.7);
        }

        /* Ecuador - Amarillo, Azul, Rojo (franjas horizontales) */
        .country-ecuador {
            border-color: rgba(255, 209, 0, 0.4);
            background: 
                linear-gradient(to bottom,
                    rgba(255, 209, 0, 0.35) 0%,
                    rgba(255, 209, 0, 0.35) 33%,
                    rgba(0, 51, 160, 0.3) 33%,
                    rgba(0, 51, 160, 0.3) 66%,
                    rgba(237, 28, 36, 0.35) 66%,
                    rgba(237, 28, 36, 0.35) 100%
                );
        }
        .country-ecuador:hover {
            border-color: rgba(255, 209, 0, 0.8);
            box-shadow: 
                0 12px 40px rgba(255, 209, 0, 0.5),
                0 0 30px rgba(0, 51, 160, 0.4),
                0 0 0 2px rgba(255, 209, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to bottom,
                    rgba(255, 209, 0, 0.5) 0%,
                    rgba(255, 209, 0, 0.5) 33%,
                    rgba(0, 51, 160, 0.45) 33%,
                    rgba(0, 51, 160, 0.45) 66%,
                    rgba(237, 28, 36, 0.5) 66%,
                    rgba(237, 28, 36, 0.5) 100%
                );
        }
        .country-ecuador:hover span {
            text-shadow: 0 2px 20px rgba(255, 209, 0, 0.9), 0 0 15px rgba(237, 28, 36, 0.7);
        }

        /* Venezuela - Amarillo, Azul, Rojo (franjas horizontales) */
        .country-venezuela {
            border-color: rgba(255, 204, 2, 0.4);
            background: 
                linear-gradient(to bottom,
                    rgba(255, 204, 2, 0.35) 0%,
                    rgba(255, 204, 2, 0.35) 33%,
                    rgba(0, 36, 125, 0.3) 33%,
                    rgba(0, 36, 125, 0.3) 66%,
                    rgba(207, 20, 43, 0.35) 66%,
                    rgba(207, 20, 43, 0.35) 100%
                );
        }
        .country-venezuela:hover {
            border-color: rgba(255, 204, 2, 0.8);
            box-shadow: 
                0 12px 40px rgba(255, 204, 2, 0.5),
                0 0 30px rgba(0, 36, 125, 0.4),
                0 0 0 2px rgba(255, 204, 2, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(to bottom,
                    rgba(255, 204, 2, 0.5) 0%,
                    rgba(255, 204, 2, 0.5) 33%,
                    rgba(0, 36, 125, 0.45) 33%,
                    rgba(0, 36, 125, 0.45) 66%,
                    rgba(207, 20, 43, 0.5) 66%,
                    rgba(207, 20, 43, 0.5) 100%
                );
        }
        .country-venezuela:hover span {
            text-shadow: 0 2px 20px rgba(255, 204, 2, 0.9), 0 0 15px rgba(207, 20, 43, 0.7);
        }

        /* Brasil - Verde, Amarillo (rombo), Azul (círculo) - diseño único */
        .country-brasil {
            border-color: rgba(0, 151, 57, 0.4);
            background: 
                linear-gradient(135deg, 
                    rgba(0, 151, 57, 0.35) 0%,
                    rgba(0, 151, 57, 0.35) 30%,
                    rgba(254, 221, 0, 0.3) 30%,
                    rgba(254, 221, 0, 0.3) 70%,
                    rgba(0, 151, 57, 0.35) 70%,
                    rgba(0, 151, 57, 0.35) 100%
                ),
                radial-gradient(circle at center,
                    rgba(1, 33, 105, 0.25) 0%,
                    rgba(1, 33, 105, 0.15) 30%,
                    transparent 50%
                ),
                linear-gradient(135deg, rgba(0, 151, 57, 0.1) 0%, rgba(1, 33, 105, 0.1) 100%);
            background-size: 100% 100%, 60% 60%, 200% 200%;
            background-position: center, center, 0% 0%;
        }
        .country-brasil:hover {
            border-color: rgba(0, 151, 57, 0.8);
            box-shadow: 
                0 12px 40px rgba(0, 151, 57, 0.5),
                0 0 30px rgba(254, 221, 0, 0.4),
                0 0 0 2px rgba(0, 151, 57, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: 
                linear-gradient(135deg, 
                    rgba(0, 151, 57, 0.5) 0%,
                    rgba(0, 151, 57, 0.5) 30%,
                    rgba(254, 221, 0, 0.45) 30%,
                    rgba(254, 221, 0, 0.45) 70%,
                    rgba(0, 151, 57, 0.5) 70%,
                    rgba(0, 151, 57, 0.5) 100%
                ),
                radial-gradient(circle at center,
                    rgba(1, 33, 105, 0.35) 0%,
                    rgba(1, 33, 105, 0.25) 30%,
                    transparent 50%
                ),
                linear-gradient(135deg, rgba(0, 151, 57, 0.15) 0%, rgba(1, 33, 105, 0.15) 100%);
            background-size: 100% 100%, 60% 60%, 200% 200%;
            background-position: center, center, 0% 0%;
        }
        .country-brasil:hover span {
            text-shadow: 0 2px 20px rgba(0, 151, 57, 0.9), 0 0 15px rgba(254, 221, 0, 0.7);
        }

        @media (max-width: 768px) {
            .header {
                padding: 1.5rem 1.5rem;
            }

            .logo {
                height: 90px;
            }

            .content-wrapper {
                padding: 6rem 1rem 3rem;
            }

            .countries-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
                padding: 1rem;
            }

            .country-btn {
                padding: 1rem 1.25rem;
                font-size: 0.875rem;
            }
        }

        @media (max-width: 480px) {
            .countries-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sparkles Background -->
    <div class="sparkles-container" id="sparkles"></div>

    <!-- Header with Floating Logo -->
    <header class="header">
        <div class="logo-container">
            <img src="{% static 'img/egarage_logo.png' %}" alt="eGarage Logo" class="logo" onerror="this.src='{% static 'img/TallerPro_logo.png' %}'">
        </div>
    </header>

    <!-- Main Content -->
    <div class="content-wrapper">
        <!-- Countries Grid -->
        <div class="countries-grid">
            <a href="/cl/es/bienvenida/" class="country-btn country-chile">
                <span>Chile</span>
            </a>
            <a href="/us/es/bienvenida/" class="country-btn country-usa">
                <span>USA</span>
            </a>
            <a href="/mx/es/bienvenida/" class="country-btn country-mexico">
                <span>México</span>
            </a>
            <a href="/pe/es/bienvenida/" class="country-btn country-peru">
                <span>Perú</span>
            </a>
            <a href="/co/es/bienvenida/" class="country-btn country-colombia">
                <span>Colombia</span>
            </a>
            <a href="/ec/es/bienvenida/" class="country-btn country-ecuador">
                <span>Ecuador</span>
            </a>
            <a href="/ve/es/bienvenida/" class="country-btn country-venezuela">
                <span>Venezuela</span>
            </a>
            <a href="/br/es/bienvenida/" class="country-btn country-brasil">
                <span>Brasil</span>
            </a>
        </div>
    </div>

    <script>
        // Create cyan sparkles
        document.addEventListener('DOMContentLoaded', function() {
            const sparklesContainer = document.getElementById('sparkles');
            const sparkleCount = 30; // Reduced for a more subtle effect

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 8 + 's';
                sparkle.style.animationDuration = (6 + Math.random() * 4) + 's';
                sparklesContainer.appendChild(sparkle);
            }
        });
    </script>
</body>
</html>
