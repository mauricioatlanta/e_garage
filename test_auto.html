<!DOCTYPE html>
<html>
<head>
    <title>Test de Login Automático</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>🧪 Test de Sistema - eGarage</h1>
    
    <div id="status">Iniciando test...</div>
    
    <script>
    async function testCompleto() {
        const statusDiv = document.getElementById('status');
        
        try {
            statusDiv.innerHTML += '<br>📡 Probando endpoint de modelos...';
            
            // Probar endpoint directo
            const response = await fetch('http://localhost:8001/vehiculos-core/api/modelos/?marca_id=1');
            statusDiv.innerHTML += `<br>📊 Status: ${response.status}`;
            
            if (response.ok) {
                const data = await response.json();
                statusDiv.innerHTML += `<br>✅ Endpoint funciona! Modelos recibidos: ${data.length}`;
                statusDiv.innerHTML += `<br>📦 Datos: ${JSON.stringify(data, null, 2)}`;
            } else {
                statusDiv.innerHTML += `<br>❌ Error HTTP: ${response.status}`;
            }
            
        } catch (error) {
            statusDiv.innerHTML += `<br>❌ Error: ${error.message}`;
        }
        
        // Probar login automático
        statusDiv.innerHTML += '<br><br>🔐 Probando login con test_usa...';
        
        try {
            // Obtener CSRF token
            const loginPageResponse = await fetch('http://localhost:8001/accounts/login/');
            const loginPageText = await loginPageResponse.text();
            const csrfMatch = loginPageText.match(/name='csrfmiddlewaretoken' value='([^']+)'/);
            
            if (csrfMatch) {
                const csrfToken = csrfMatch[1];
                statusDiv.innerHTML += '<br>✅ CSRF token obtenido';
                
                // Intentar login
                const formData = new FormData();
                formData.append('username', 'test_usa');
                formData.append('password', 'test1234');
                formData.append('csrfmiddlewaretoken', csrfToken);
                
                const loginResponse = await fetch('http://localhost:8001/accounts/login/', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                statusDiv.innerHTML += `<br>📊 Login status: ${loginResponse.status}`;
                
                if (loginResponse.ok) {
                    statusDiv.innerHTML += '<br>✅ Login exitoso! Redirigiendo a crear vehículo...';
                    
                    // Intentar acceder a página protegida
                    const vehiculoResponse = await fetch('http://localhost:8001/taller/clientes/crear/', {
                        credentials: 'include'
                    });
                    
                    if (vehiculoResponse.ok) {
                        statusDiv.innerHTML += '<br>✅ Acceso a página de vehículos exitoso';
                        statusDiv.innerHTML += '<br>🎯 <a href="http://localhost:8001/taller/clientes/crear/" target="_blank">Abrir página de crear vehículo</a>';
                    } else {
                        statusDiv.innerHTML += `<br>❌ Error accediendo a página protegida: ${vehiculoResponse.status}`;
                    }
                } else {
                    statusDiv.innerHTML += '<br>❌ Login falló';
                }
            } else {
                statusDiv.innerHTML += '<br>❌ No se pudo obtener CSRF token';
            }
            
        } catch (error) {
            statusDiv.innerHTML += `<br>❌ Error en login: ${error.message}`;
        }
    }
    
    // Ejecutar test después de 1 segundo
    setTimeout(testCompleto, 1000);
    </script>
</body>
</html>
