name: E2E Tests with Playwright

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Playwright dependencies
      run: |
        npm install
        npx playwright install --with-deps
        
    - name: Run Django migrations
      run: |
        python manage.py migrate
        
    - name: Create test data
      run: |
        python manage.py shell -c "
        from django.contrib.auth.models import User
        from taller.models.empresa import Empresa
        from taller.servicios.models import CategoriaServicio, Servicio
        
        # Crear usuario de prueba
        user, created = User.objects.get_or_create(
            username='testuser',
            defaults={'email': 'test@example.com'}
        )
        if created:
            user.set_password('testpass123')
            user.save()
            
        # Crear empresa
        empresa, created = Empresa.objects.get_or_create(
            user=user,
            defaults={
                'nombre_taller': 'Test Garage',
                'pais': 'US',
                'moneda': 'USD'
            }
        )
        
        # Crear categoría de servicios
        categoria, created = CategoriaServicio.objects.get_or_create(
            country='US',
            code='MAINT',
            defaults={}
        )
        
        # Crear servicios de prueba
        Servicio.objects.get_or_create(
            nombre='Oil Change Service',
            empresa=empresa,
            categoria=categoria
        )
        Servicio.objects.get_or_create(
            nombre='Brake Service',
            empresa=empresa,
            categoria=categoria
        )
        print('Test data created successfully')
        "
        
    - name: Start Django server
      run: |
        python manage.py runserver 127.0.0.1:8000 &
        sleep 10
        
    - name: Run Playwright tests
      run: npx playwright test
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
