<!-- ALTERNATIVA SELECT2/DAL para servicios -->
<!-- Reemplaza las funciones addServicioRow y setupServicioRow con estas: -->

<script>
function addServicioRow(){
  const container = document.querySelector('#servicios-container');
  const tpl = document.createElement('div');
  tpl.innerHTML = `
    <div class="dynamic-element">
      <div class="flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-60">
          <label class="block text-cyan-200 text-sm mb-1">Service</label>
          <select class="servicio-select form-select w-full"></select>
          <input type="hidden" class="srv-id">
        </div>

        <div class="w-40">
          <label class="block text-cyan-200 text-sm mb-1">Client Price</label>
          <input type="text" class="serv-precio form-control w-full" placeholder="$0">
        </div>

        <div class="w-40">
          <label class="block text-cyan-200 text-sm mb-1">Subtotal</label>
          <input type="hidden" class="serv-subtotal" value="0">
          <div class="serv-subtotal-view subtotal-field w-full text-right font-bold">$0</div>
        </div>

        <div class="w-16">
          <button type="button" class="btn-secondary w-full" onclick="this.closest('.dynamic-element').remove(); window.recalcTotales();">✕</button>
        </div>
      </div>
    </div>`;
  const row = tpl.firstElementChild;
  container.appendChild(row);

  const selectEl = row.querySelector('.servicio-select');
  initServicioSelect2(selectEl);

  // recalcular al cambiar precio manualmente
  const pEl  = row.querySelector('.serv-precio');
  const sub  = row.querySelector('.serv-subtotal');
  const view = row.querySelector('.serv-subtotal-view');
  pEl.addEventListener('input', ()=>{
    const val = Number((pEl.value || '0').replace(/[^0-9.-]/g,'')) || 0;
    sub.value = val;
    view.textContent = money(val);
    window.recalcTotales();
  });
}

function initServicioSelect2(selectEl){
  // Requiere Select2 cargado (y jQuery)
  const base = location.pathname.startsWith('/us/') ? '/us' : (location.pathname.startsWith('/cl/') ? '/cl' : '');
  const url  = `${base}/documentos/ajax/servicios/buscar/`;

  $(selectEl).select2({
    placeholder: 'Search services…',
    minimumInputLength: 2,
    ajax: {
      url,
      delay: 250,
      dataType: 'json',
      data: params => ({ q: params.term }),
      processResults: data => ({
        results: (data.results || []).map(s => ({ id: s.id, text: s.text, precio: s.precio }))
      })
    },
    width: '100%',
  });

  $(selectEl).on('select2:select', (e) => {
    const row = selectEl.closest('.dynamic-element');
    const selected = e.params.data;
    // guarda id oculto
    row.querySelector('.srv-id').value = selected.id;
    // sugiere precio si está vacío
    const pEl = row.querySelector('.serv-precio');
    if ((pEl.value || '').trim() === '' && typeof selected.precio === 'number'){
      pEl.value = selected.precio;
      // recalcula subtotal sin cantidad
      const sub  = row.querySelector('.serv-subtotal');
      const view = row.querySelector('.serv-subtotal-view');
      const val  = Number(selected.precio) || 0;
      sub.value = val;
      view.textContent = money(val);
      window.recalcTotales();
    }
  });
}
</script>
