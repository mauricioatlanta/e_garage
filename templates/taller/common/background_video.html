{% load static %}

<!-- Video de fondo optimizado para eGarage -->
<video class="bg-video" data-bgvid autoplay muted loop playsinline preload="metadata"
       poster="{% static 'taller/img/bg/poster.jpg' %}" style="display: none;">
  <source src="{% static 'taller/media/bg/bg_particles.webm' %}" type="video/webm">
  <source src="{% static 'taller/media/bg/bg_intro_6s.mp4' %}" type="video/mp4">
  <!-- Fallback para navegadores que no soportan video -->
  <div class="bg-fallback" style="position: fixed; inset: 0; background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #1f2937 100%); z-index: -1;"></div>
</video>

<style>
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    opacity: 0.8;
  }
  
  /* Optimización para dispositivos móviles */
  @media (max-width: 768px) {
    .bg-video {
      display: none;
    }
  }
  
  /* Optimización para conexiones lentas */
  @media (prefers-reduced-motion: reduce) {
    .bg-video {
      display: none;
    }
  }
</style>

<script src="{% static 'taller/js/ui/eg.bg.init.min.js' %}" defer></script>
