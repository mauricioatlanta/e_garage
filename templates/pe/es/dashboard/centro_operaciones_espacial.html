<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Operaciones - eGarage Perú</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                  linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .panel {
      max-width: 640px;
      margin: 24px;
      padding: 40px 32px;
      text-align: center;
      background: rgba(5, 15, 25, 0.95);
      border: 2px solid #00d4ff;
      border-radius: 20px;
      box-shadow: 0 0 20px #00d4ff, inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    h1 { color: #00d4ff; margin: 0 0 16px; }
    p { color: #cbd5e1; line-height: 1.6; }
    a { color: #22d3ee; font-weight: 600; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Centro de Operaciones — eGarage Perú 🇵🇪</h1>
    <p>Tu panel está en preparación. Configura tu taller o regresa a la bienvenida.</p>
    <p><a href="/pe/es/bienvenida/">← Volver a la bienvenida</a></p>
  </div>
</body>
</html>
