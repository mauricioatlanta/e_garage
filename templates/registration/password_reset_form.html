{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto p-6 bg-white rounded shadow text-black" style="max-width: 400px; margin-top: 80px;">
  <h2 class="text-2xl font-bold mb-4">{% trans "Reset password" %}</h2>
  <p class="mb-4">{% trans "Enter your email and we will send you a link to reset your password." %}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full mt-2">{% trans "Send email" %}</button>
  </form>
</div>
{% endblock %}
