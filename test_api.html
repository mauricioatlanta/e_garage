<!DOCTYPE html>
<html>
<head>
    <title>Test APIs</title>
</head>
<body>
    <h1>Test APIs</h1>
    <button onclick="testRepuestos()">Test Repuestos</button>
    <button onclick="testServicios()">Test Servicios</button>
    <div id="results"></div>

    <script>
        // Función para obtener CSRF token
        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') {
                    return value;
                }
            }
            return null;
        }

        function testRepuestos() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing repuestos...';
            
            fetch('/us/documentos/api/buscar-repuestos/?q=oil', {
                headers: {
                    'X-CSRFToken': getCSRFToken() || '',
                }
            })
            .then(response => {
                results.innerHTML += `<br>Status: ${response.status}`;
                return response.json();
            })
            .then(data => {
                results.innerHTML += `<br>Data: ${JSON.stringify(data)}`;
            })
            .catch(error => {
                results.innerHTML += `<br>Error: ${error}`;
            });
        }

        function testServicios() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing servicios...';
            
            fetch('/us/documentos/api/buscar-servicios-internos/?q=al', {
                headers: {
                    'X-CSRFToken': getCSRFToken() || '',
                }
            })
            .then(response => {
                results.innerHTML += `<br>Status: ${response.status}`;
                return response.json();
            })
            .then(data => {
                results.innerHTML += `<br>Data: ${JSON.stringify(data)}`;
            })
            .catch(error => {
                results.innerHTML += `<br>Error: ${error}`;
            });
        }
    </script>
</body>
</html>
