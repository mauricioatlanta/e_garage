[pytest]
DJANGO_SETTINGS_MODULE = gestion_taller.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    api: marks tests for API endpoints
    engine: marks tests for tax engine
    conventions: marks tests that verify project conventions

# Django
django_find_project = true

# Coverage (si se usa pytest-cov)
# addopts = --cov=taller --cov-report=html --cov-report=term-missing

# Test discovery
testpaths = taller/tests

# Ignore
norecursedirs = .git .tox dist build *.egg node_modules venv
