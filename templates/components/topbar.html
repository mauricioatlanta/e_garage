<header class="eg-topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    {% if workspace.brand.icon %}<i class="{{ workspace.brand.icon }}" style="font-size:1.1rem;color:var(--eg-primary,#38bdf8);"></i>{% endif %}
    <div>
      <h1 class="eg-page-title">{{ workspace.brand.product_name|default:"eGarage" }}</h1>
      <p class="eg-page-subtitle">{{ workspace.brand.tagline|default:"Control operativo para negocios automotrices" }}</p>
    </div>
  </div>

  <div>
    {% if request.user.is_authenticated %}
      <form action="{% url 'account_logout' %}" method="post" style="margin:0;display:inline">
        {% csrf_token %}
        <button type="submit" class="eg-btn eg-btn-secondary">Salir</button>
      </form>
    {% else %}
      <a class="eg-btn" href="{% url 'account_login' %}">Ingresar</a>
    {% endif %}
  </div>
</header>
