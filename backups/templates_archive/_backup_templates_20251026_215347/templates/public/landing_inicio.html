{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Garage - Automatiza tu taller</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.output.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
</head>
<body class="bg-black text-white overflow-hidden m-0 p-0">

  <!-- 🎬 VIDEO DE INTRO -->
  <video id="intro-video" autoplay muted playsinline class="fixed top-0 left-0 w-full h-full object-cover z-50">
    <source src="{% static 'egarage_intro/egarage_intro_6s.mp4' %}" type="video/mp4" />
  </video>

  <!-- 🌌 FONDO DE PARTÍCULAS -->
  <video id="bg-particles" loop muted autoplay playsinline class="hidden fixed top-0 left-0 w-full h-full object-cover z-0">
    <source src="{% static 'egarage_intro/particles_background.webm' %}" type="video/webm" />
  </video>

  <!-- 🚗 LOGO + TEXTO -->
  <div id="bienvenida" class="fixed inset-0 z-10 flex flex-col justify-center items-center text-center">
    <div style="display:flex; justify-content:center; align-items:center;">
      <img src="{% static 'img/TallerPro_logo.png' %}" alt="E-Garage Logo"
        class="mb-8 w-40 h-40 md:w-56 md:h-56 object-contain mx-auto neon-border"
        style="border-radius: 50%; background:rgba(0,0,0,0.15);" />
      <style>
        .neon-border {
          border: 2px solid #00e6ff;
          box-shadow:
            0 0 24px 1px #00e6ff,
            0 0 60px 6px #00e6ff44,
            0 0 0 1px #00e6ff;
          animation: neon-glow 2s infinite alternate;
        }
        @keyframes neon-glow {
          0% {
            box-shadow:
              0 0 24px 1px #00e6ff,
              0 0 60px 6px #00e6ff44,
              0 0 0 1px #00e6ff;
          }
          100% {
            box-shadow:
              0 0 48px 4px #00e6ff,
              0 0 120px 10px #00e6ff88,
              0 0 0 2px #00e6ff;
          }
        }
      </style>
    </div>
    <p class="text-2xl md:text-3xl font-bold tracking-wide mb-6 font-[Orbitron] text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-300">
      {% trans "Bienvenido a eGarage" %}
    </p>
    <a href="/selector-pais-egarage/" class="bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-300 text-gray-900 font-bold py-3 px-10 rounded-xl shadow-xl text-xl tracking-wide border-2 border-fuchsia-400 hover:scale-105 transition-all duration-300 animate-bounce">
      {% trans "Entrar" %}
    </a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoIntro = document.getElementById("intro-video");
      const bgParticles = document.getElementById("bg-particles");
      const bienvenida = document.getElementById("bienvenida");

      // Hide video and show content immediately for testing
      videoIntro.classList.add("hidden");
      bgParticles.classList.remove("hidden");
      // bienvenida is already visible (no 'hidden' class)
    });
  </script>
</body>
</html>
