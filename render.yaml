# Configuración de despliegue para Render.com
# Sistema robusto con pre-build defensivo y fallbacks

services:
  - type: web
    name: egarage
    env: python
    plan: starter
    buildCommand: |
      # Instalar dependencias
      pip install -r requirements.txt

      # Pre-checks livianos (no deben fallar el build)
      echo "🔍 Verificando configuración mínima..."
      python - <<'PY'
      import os, sys
      os.environ.setdefault("DJANGO_SETTINGS_MODULE", "gestion_taller.settings.min")
      try:
          import django
          django.setup()
          print("✅ Django minimal OK")
      except Exception as e:
          print(f"⚠️  Django minimal warning: {e}")
          # No fallar el build por esto
      PY

      # Verificar estructura básica
      echo "🔍 Verificando estructura de directorios..."
      mkdir -p staticfiles media logs

      # Compilar archivos estáticos
      echo "📦 Compilando archivos estáticos..."
      DJANGO_SETTINGS_MODULE=gestion_taller.settings.prod python manage.py collectstatic --noinput

      # Compilar mensajes i18n
      echo "🌍 Compilando mensajes i18n..."
      DJANGO_SETTINGS_MODULE=gestion_taller.settings.prod python manage.py compilemessages

      echo "✅ Build completado exitosamente"

    startCommand: |
      # Migraciones y arranque
      echo "🚀 Iniciando eGarage..."
      DJANGO_SETTINGS_MODULE=gestion_taller.settings.prod python manage.py migrate --noinput
      gunicorn gestion_taller.wsgi:application --workers 3 --timeout 90 --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_taller.settings.prod
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "egarage.onrender.com,localhost,127.0.0.1"
      # Variables de base de datos (Render las proporciona automáticamente)
      - key: DATABASE_URL
        fromDatabase:
          name: egarage-db
          property: connectionString
      # Variables de email (configurar en Render dashboard)
      - key: EMAIL_PASSWORD
        sync: false
      # Modo seguro como fallback
      - key: EGARAGE_SAFE_MODE
        value: "0"

    healthCheckPath: /ping/

    # Configuración de auto-deploy
    autoDeploy: true
    branch: main

    # Configuración de logs
    logRetentionPolicy:
      type: limited
      days: 7

# Base de datos PostgreSQL
databases:
  - name: egarage-db
    plan: starter
    databaseName: egarage
    user: egarage_user

# Variables de entorno globales
envVars:
  - key: NODE_ENV
    value: production
  - key: PYTHONUNBUFFERED
    value: "1"
