{% extends "base.html" %}

{% block content %}
<div class="flex min-h-screen">

  <aside class="w-64 bg-[#020617] border-r border-[#1e293b] p-4">

    <div class="mb-8">
      <h1 class="text-cyan-400 text-xl font-bold">
        {{ empresa.nombre|default:"eGarage" }}
      </h1>
    </div>

    <nav class="space-y-2">

      <a href="/cl/es/dashboard/" class="nav-item">Dashboard</a>
      <a href="/cl/es/documentos/" class="nav-item">Documentos</a>
      <a href="/cl/es/clientes/" class="nav-item">Clientes</a>
      <a href="/cl/es/vehiculos/" class="nav-item">Vehículos</a>
      <a href="/cl/es/repuestos/" class="nav-item">Repuestos</a>
      <a href="/cl/es/reportes/" class="nav-item">Reportes</a>

    </nav>

  </aside>

  <div class="flex-1">

    <header class="border-b border-[#1e293b] px-6 py-4 flex justify-between">

      <div>
        <h2 class="text-lg font-semibold">
          {% block page_title %}Dashboard{% endblock %}
        </h2>
      </div>

      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-400">
          {{ request.user.username }}
        </span>
      </div>

    </header>

    <main class="p-6">
      {% block app_content %}{% endblock %}
    </main>

  </div>

</div>
{% endblock %}
