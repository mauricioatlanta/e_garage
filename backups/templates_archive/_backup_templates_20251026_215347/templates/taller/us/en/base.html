{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block extra_css %}
<style>
/* 🚀 Space Station Style for USA Templates */
:root {
  --space-primary: #00ffff;
  --space-secondary: #ff00ff;
  --space-accent: #ffff00;
  --space-bg: #000000;
  --space-surface: rgba(0, 0, 0, 0.4);
  --space-border: rgba(0, 255, 255, 0.3);
  --space-glow: rgba(0, 255, 255, 0.2);
}

/* Space Background Animations */
@keyframes move-stars {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-1000px); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

@keyframes move-clouds {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100vw); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

@keyframes explode {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

@keyframes pulse-glow {
  0%, 100% { 
    box-shadow: 0 0 20px var(--space-glow), 0 0 40px var(--space-glow), 0 0 60px var(--space-glow);
  }
  50% { 
    box-shadow: 0 0 30px var(--space-glow), 0 0 60px var(--space-glow), 0 0 90px var(--space-glow);
  }
}

/* Space Background Elements */
.space-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: var(--space-bg);
}

.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
  background-repeat: repeat;
  background-size: 200px 100px;
  animation: move-stars 50s linear infinite;
}

.twinkling {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(1px 1px at 25px 5px, white, transparent),
    radial-gradient(1px 1px at 50px 25px, white, transparent),
    radial-gradient(1px 1px at 125px 20px, white, transparent),
    radial-gradient(1px 1px at 150px 75px, white, transparent);
  background-repeat: repeat;
  background-size: 200px 100px;
  animation: twinkle 3s ease-in-out infinite;
}

.clouds {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(20px 20px at 50px 50px, rgba(255,255,255,0.1), transparent),
    radial-gradient(15px 15px at 150px 30px, rgba(255,255,255,0.1), transparent),
    radial-gradient(25px 25px at 250px 70px, rgba(255,255,255,0.1), transparent);
  background-repeat: repeat;
  background-size: 300px 100px;
  animation: move-clouds 30s linear infinite;
}

/* Floating Particles */
.space-particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--space-primary);
  border-radius: 50%;
  animation: float 3s ease-in-out infinite;
}

.explosion {
  position: absolute;
  width: 4px;
  height: 4px;
  background: radial-gradient(circle, var(--space-secondary), var(--space-primary), var(--space-accent));
  border-radius: 50%;
  animation: explode 0.5s ease-out forwards;
}

/* Space-themed Components */
.space-container {
  min-height: 100vh;
  background: transparent;
  position: relative;
  z-index: 10;
  padding: 1rem;
}

.space-card {
  position: relative;
  border-radius: 0.75rem;
  border: 1px solid var(--space-border);
  background: var(--space-surface);
  backdrop-filter: blur(8px);
  transition: all 0.3s ease;
}

.space-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 0.75rem;
  background: linear-gradient(45deg, var(--space-primary), var(--space-secondary), var(--space-accent));
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: -1;
}

.space-card:hover::before {
  opacity: 0.2;
}

.space-glow {
  position: relative;
}

.space-glow::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: linear-gradient(45deg, var(--space-primary), var(--space-secondary), var(--space-accent));
  opacity: 0.3;
  filter: blur(8px);
  z-index: -1;
}

.space-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid var(--space-border);
  background: linear-gradient(45deg, var(--space-primary), var(--space-secondary));
  color: white;
  font-weight: bold;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 255, 255, 0.2);
}

.space-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
  color: white;
  text-decoration: none;
}

.space-input {
  background: var(--space-surface);
  border: 1px solid var(--space-border);
  border-radius: 0.5rem;
  color: var(--space-primary);
  padding: 0.75rem;
  backdrop-filter: blur(8px);
}

.space-input:focus {
  outline: none;
  border-color: var(--space-primary);
  box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.2);
}

.space-title {
  background: linear-gradient(45deg, var(--space-primary), var(--space-secondary), var(--space-accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
}

.space-text {
  color: #e5e7eb;
}

.space-text-muted {
  color: #9ca3af;
}

/* Responsive Design */
@media (max-width: 768px) {
  .space-container {
    padding: 0.5rem;
  }
  
  .space-button {
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
  }
}
</style>
{% endblock %}

{% block content %}
<!-- Space Background -->
<div class="space-background">
  <div class="stars"></div>
  <div class="twinkling"></div>
  <div class="clouds"></div>
</div>

<!-- Floating Particles -->
<div class="space-particles" id="space-particles"></div>

<!-- Main Content -->
<div class="space-container">
  {% block space_content %}{% endblock %}
</div>

<!-- Space Theme JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Create floating particles
  function createParticles() {
    const particles = document.getElementById('space-particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 3 + 's';
      particles.appendChild(particle);
    }
  }

  // Create explosion effect
  function createExplosion(x, y) {
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.style.left = x + 'px';
    explosion.style.top = y + 'px';
    document.body.appendChild(explosion);

    setTimeout(() => {
      explosion.remove();
    }, 500);
  }

  // Add click effects to space buttons
  document.querySelectorAll('.space-button').forEach(button => {
    button.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      createExplosion(x, y);
    });
  });

  // Initialize particles
  createParticles();
});
</script>
{% endblock %}
