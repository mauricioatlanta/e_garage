{% extends "taller/documentos/base/base_documento.html" %}
{% load i18n %}
<style>
  /* Opcional: sombras suaves y bordes elegantes sin saturar */
  .doc-shell { @apply rounded-2xl border bg-white/5 backdrop-blur p-5 shadow-md; }

  /* Paletas sobrias (tono base + borde + halo muy sutil) */
  .theme-ot    { @apply border-slate-500/50; }
  .theme-pres  { @apply border-amber-500/50; }
  .theme-rec   { @apply border-emerald-600/50; }

  /* Encabezado/chip */
  .doc-chip { @apply inline-flex items-center gap-2 text-sm font-medium rounded-full px-3 py-1; }
  .chip-ot   { @apply bg-slate-800/70 text-slate-100; }
  .chip-pres { @apply bg-amber-900/60 text-amber-100; }
  .chip-rec  { @apply bg-emerald-900/60 text-emerald-100; }
</style>
