{% extends "base.html" %}
{% block extra_css %}
{{ block.super }}
<style>
.eg-towing{
  max-width:1280px;margin:28px auto;padding:28px;
  color:#e2e8f0;background:#101c2e;border:1px solid #29415d;
  border-radius:20px;box-shadow:0 16px 48px #0005;
  font:400 16px/1.6 system-ui,sans-serif;
}
.eg-towing *{box-sizing:border-box}
.eg-towing h1{font-size:30px;font-weight:750;color:#f8fafc;margin:0 0 20px}
.eg-towing h2{font-size:22px;color:#f1f5f9;margin:22px 0 12px}
.eg-towing h3{font-size:18px;color:#f1f5f9;margin:12px 0}
.eg-towing p{margin:12px 0;color:#cbd5e1}
.eg-towing a{color:#67e8f9;text-decoration:none}
.eg-towing a:hover{text-decoration:underline}
.eg-towing label{display:block;color:#dbeafe;font-weight:600;margin-bottom:6px}
.eg-towing input:not([type=hidden]):not([type=checkbox]),
.eg-towing select,.eg-towing textarea{
  display:block;width:100%;padding:12px;border:1px solid #49617f;
  border-radius:9px;background:#0b1423;color:#f8fafc;font:inherit;
}
.eg-towing select option{background:#0b1423;color:#f8fafc}
.eg-towing input:focus,.eg-towing select:focus,.eg-towing textarea:focus{
  outline:2px solid #22d3ee;outline-offset:2px;
}
.eg-towing button,.eg-towing .btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:10px 18px;border:1px solid #22d3ee;
  border-radius:10px;background:#164e63;color:#ecfeff!important;
  font:600 15px/1.4 system-ui;cursor:pointer;text-decoration:none;
}
.eg-towing button:hover,.eg-towing .btn:hover{background:#155e75}
.eg-towing .table-responsive{overflow-x:auto;margin-top:24px}
.eg-towing table{width:100%;border-collapse:collapse;color:#e2e8f0}
.eg-towing th{background:#172b43;color:#a5f3fc;text-align:left;font-size:13px}
.eg-towing th,.eg-towing td{padding:16px;border-bottom:1px solid #30425a}
.eg-towing tbody tr:hover{background:#18283d}
.eg-towing .badge{
  display:inline-block;padding:5px 11px;border-radius:20px;
  background:#164e63;color:#a5f3fc;font-size:12px;white-space:nowrap;
}
.eg-towing .card{
  padding:22px;margin:18px 0;background:#14243a;
  border:1px solid #334b68;border-radius:14px;
}
.eg-towing form{margin:18px 0}
.eg-towing form p{margin-bottom:18px}
.eg-towing .d-flex{display:flex;gap:16px;flex-wrap:wrap}
.eg-towing .justify-content-between{justify-content:space-between}
.eg-towing .align-items-center{align-items:center}
.eg-towing .input-group{display:flex;gap:10px;align-items:center}
.eg-towing .input-group select{flex:1}
.eg-towing .text-info{color:#67e8f9}
.eg-towing .small{font-size:13px;letter-spacing:.06em}
.eg-towing .errorlist{color:#fda4af;padding:12px}
.eg-towing nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
@media(max-width:700px){
  .eg-towing{margin:16px 10px;padding:18px;border-radius:14px}
  .eg-towing h1{font-size:25px}
  .eg-towing .input-group{flex-direction:column;align-items:stretch}
  .eg-towing th,.eg-towing td{padding:12px}
}
</style>
{% endblock %}
{% block content %}
<section class="eg-towing">
  {% load country_url %}
  <nav aria-label="Navegación de Grúas">
    <a href="{% country_url 'gruas:dispatch_board' %}">Despacho</a>
    <a href="{% country_url 'gruas:order_create' %}">Nueva orden</a>
    <a href="{% country_url 'gruas:units' %}">Grúas y conductores</a>
    <a href="{% country_url 'gruas:driver_home' %}">Vista del conductor</a>
  </nav>
  {% block gruas_content %}{% endblock %}
</section>
{% endblock %}
