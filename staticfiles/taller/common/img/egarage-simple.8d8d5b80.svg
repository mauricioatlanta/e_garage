<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#0099ff"/>
      <stop offset="100%" style="stop-color:#6600ff"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo blanco -->
  <rect x="0" y="0" width="200" height="60" rx="10" fill="white" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Icono -->
  <g transform="translate(15,15)">
    <rect x="5" y="5" width="20" height="15" rx="2" fill="url(#grad)"/>
    <rect x="8" y="8" width="14" height="9" rx="1" fill="white"/>
    <circle cx="15" cy="12" r="2" fill="url(#grad)"/>
  </g>
  
  <!-- Texto -->
  <text x="45" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#grad)">e</text>
  <text x="57" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#333">Garage</text>
  <text x="45" y="42" font-family="Arial, sans-serif" font-size="10" fill="#666">DIGITAL WORKSHOP</text>
</svg>

