{% extends "taller/gruas/base_gruas.html" %}
{% block gruas_content %}
<main class="container py-4"><h1>Nueva orden de traslado</h1>
<form method="post" class="row g-3">{% csrf_token %}{{ form.as_p }}
  <div><button class="btn btn-primary">Crear orden</button></div>
</form>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const payer = document.getElementById("id_pagador_nombre");
  const receiver = document.getElementById("id_receptor_nombre");
  const same = document.getElementById("id_same_as_payer");
  if (!payer || !receiver || !same) return;
  const syncReceiver = function () {
    receiver.readOnly = same.checked;
    if (same.checked) receiver.value = payer.value;
  };
  payer.addEventListener("input", syncReceiver);
  same.addEventListener("change", syncReceiver);
  syncReceiver();
});
</script>
{% endblock %}
