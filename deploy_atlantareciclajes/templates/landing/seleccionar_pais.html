{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "eGarage" %} - {% trans "Plataforma de Gestión para Talleres" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.globe.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #vanta-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .logo-container {
            margin-bottom: 4rem;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .logo {
            height: 120px;
            width: auto;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.8)) drop-shadow(0 0 60px rgba(0, 245, 255, 0.4));
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.8)) drop-shadow(0 0 60px rgba(0, 245, 255, 0.4)); }
            100% { filter: drop-shadow(0 0 50px rgba(0, 245, 255, 1)) drop-shadow(0 0 100px rgba(0, 245, 255, 0.6)); }
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
        }

        .country-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 2rem;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            text-decoration: none;
            color: #ffffff;
            border: 2px solid transparent;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .country-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .country-btn:hover::before {
            left: 100%;
        }

        .country-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        /* Chile - Rojo, Blanco, Azul */
        .country-chile {
            background: linear-gradient(135deg, #D52B1E 0%, #0039A6 100%);
            border-color: rgba(213, 43, 30, 0.5);
        }

        .country-chile:hover {
            background: linear-gradient(135deg, #FF3D2E 0%, #0052CC 100%);
            box-shadow: 0 15px 50px rgba(213, 43, 30, 0.6);
        }

        /* USA - Rojo, Blanco, Azul */
        .country-usa {
            background: linear-gradient(135deg, #B22234 0%, #3C3B6E 100%);
            border-color: rgba(178, 34, 52, 0.5);
        }

        .country-usa:hover {
            background: linear-gradient(135deg, #DC143C 0%, #4A4A8E 100%);
            box-shadow: 0 15px 50px rgba(178, 34, 52, 0.6);
        }

        /* México - Verde, Blanco, Rojo */
        .country-mexico {
            background: linear-gradient(135deg, #006847 0%, #CE1126 100%);
            border-color: rgba(0, 104, 71, 0.5);
        }

        .country-mexico:hover {
            background: linear-gradient(135deg, #00A86B 0%, #FF1A3D 100%);
            box-shadow: 0 15px 50px rgba(0, 104, 71, 0.6);
        }

        /* Perú - Rojo, Blanco */
        .country-peru {
            background: linear-gradient(135deg, #D91023 0%, #FFFFFF 50%, #D91023 100%);
            border-color: rgba(217, 16, 35, 0.5);
            color: #000;
        }

        .country-peru:hover {
            background: linear-gradient(135deg, #FF1A3D 0%, #FFFFFF 50%, #FF1A3D 100%);
            box-shadow: 0 15px 50px rgba(217, 16, 35, 0.6);
        }

        /* Colombia - Amarillo, Azul, Rojo */
        .country-colombia {
            background: linear-gradient(135deg, #FCD116 0%, #003893 50%, #CE1126 100%);
            border-color: rgba(252, 209, 22, 0.5);
            color: #000;
        }

        .country-colombia:hover {
            background: linear-gradient(135deg, #FFE135 0%, #0048B3 50%, #FF1A3D 100%);
            box-shadow: 0 15px 50px rgba(252, 209, 22, 0.6);
        }

        /* Ecuador - Amarillo, Azul, Rojo */
        .country-ecuador {
            background: linear-gradient(135deg, #FFD100 0%, #0033A0 50%, #ED1C24 100%);
            border-color: rgba(255, 209, 0, 0.5);
            color: #000;
        }

        .country-ecuador:hover {
            background: linear-gradient(135deg, #FFE135 0%, #0048B3 50%, #FF3D2E 100%);
            box-shadow: 0 15px 50px rgba(255, 209, 0, 0.6);
        }

        /* Venezuela - Amarillo, Azul, Rojo */
        .country-venezuela {
            background: linear-gradient(135deg, #FFCC02 0%, #00247D 50%, #CF142B 100%);
            border-color: rgba(255, 204, 2, 0.5);
            color: #000;
        }

        .country-venezuela:hover {
            background: linear-gradient(135deg, #FFE135 0%, #0033A0 50%, #FF1A3D 100%);
            box-shadow: 0 15px 50px rgba(255, 204, 2, 0.6);
        }

        /* Brasil - Verde, Amarillo, Azul */
        .country-brasil {
            background: linear-gradient(135deg, #009739 0%, #FEDD00 50%, #012169 100%);
            border-color: rgba(0, 151, 57, 0.5);
            color: #000;
        }

        .country-brasil:hover {
            background: linear-gradient(135deg, #00B84A 0%, #FFE135 50%, #0033A0 100%);
            box-shadow: 0 15px 50px rgba(0, 151, 57, 0.6);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 245, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .logo {
                height: 80px;
            }

            .countries-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
                padding: 1rem;
            }

            .country-btn {
                padding: 1.2rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Vanta.js Background -->
    <div id="vanta-background"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Content -->
    <div class="content-wrapper">
        <!-- Logo -->
        <div class="logo-container">
            <img src="{% static 'img/egarage_logo.png' %}" alt="eGarage Logo" class="logo" onerror="this.src='{% static 'img/TallerPro_logo.png' %}'">
        </div>

        <!-- Countries Grid -->
        <div class="countries-grid">
            <a href="/cl/es/bienvenida/" class="country-btn country-chile">
                Chile
            </a>
            <a href="/us/en/bienvenida/" class="country-btn country-usa">
                USA
            </a>
            <a href="/mx/es/bienvenida/" class="country-btn country-mexico">
                México
            </a>
            <a href="/pe/es/bienvenida/" class="country-btn country-peru">
                Perú
            </a>
            <a href="/co/es/bienvenida/" class="country-btn country-colombia">
                Colombia
            </a>
            <a href="/ec/es/bienvenida/" class="country-btn country-ecuador">
                Ecuador
            </a>
            <a href="/ve/es/bienvenida/" class="country-btn country-venezuela">
                Venezuela
            </a>
            <a href="/br/es/bienvenida/" class="country-btn country-brasil">
                Brasil
            </a>
        </div>
    </div>

    <script>
        // Initialize Vanta.js with NET effect
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof VANTA !== 'undefined' && VANTA.NET) {
                VANTA.NET({
                    el: "#vanta-background",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color: 0x00f5ff,
                    color2: 0x0099cc,
                    backgroundColor: 0x0a0a0a,
                    points: 15.00,
                    maxDistance: 25.00,
                    spacing: 20.00
                });
            }

            // Create floating particles
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
