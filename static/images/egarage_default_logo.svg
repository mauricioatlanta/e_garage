<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes futuristas -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0091ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c00ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Filtros de brillo -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Patrón de circuitos -->
    <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#00d4ff" opacity="0.3"/>
      <circle cx="50" cy="30" r="2" fill="#0091ff" opacity="0.3"/>
      <circle cx="80" cy="70" r="2" fill="#6c00ff" opacity="0.3"/>
      <line x1="10" y1="10" x2="50" y2="30" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
      <line x1="50" y1="30" x2="80" y2="70" stroke="#0091ff" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="110"/>
  
  <!-- Patrón de circuitos de fondo -->
  <rect width="512" height="512" fill="url(#circuitPattern)" opacity="0.4"/>
  
  <!-- Círculos decorativos de fondo -->
  <circle cx="100" cy="100" r="150" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.1"/>
  <circle cx="412" cy="412" r="120" fill="none" stroke="#6c00ff" stroke-width="1" opacity="0.1"/>
  
  <!-- Hexágono central futurista -->
  <g transform="translate(256, 200)">
    <path d="M 0,-80 L 69.28,-40 L 69.28,40 L 0,80 L -69.28,40 L -69.28,-40 Z" 
          fill="none" stroke="url(#mainGradient)" stroke-width="3" filter="url(#glow)" opacity="0.6"/>
    <path d="M 0,-70 L 60.62,-35 L 60.62,35 L 0,70 L -60.62,35 L -60.62,-35 Z" 
          fill="none" stroke="url(#glowGradient)" stroke-width="2" filter="url(#glow)" opacity="0.4"/>
  </g>
  
  <!-- Engranaje tecnológico -->
  <g transform="translate(256, 200)">
    <!-- Dientes del engranaje -->
    <g filter="url(#glow)">
      <!-- 8 dientes distribuidos uniformemente -->
      <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      <g transform="rotate(45)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
      <g transform="rotate(90)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
      <g transform="rotate(135)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
    </g>
    
    <!-- Círculo exterior del engranaje -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#mainGradient)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Ícono de coche futurista en el centro -->
    <g transform="scale(1.8)">
      <!-- Carrocería principal -->
      <path d="M -25,-8 L -20,-15 L -8,-18 L 8,-18 L 20,-15 L 25,-8 L 25,8 L 20,12 L -20,12 L -25,8 Z" 
            fill="url(#glowGradient)" stroke="url(#mainGradient)" stroke-width="2" filter="url(#strongGlow)"/>
      
      <!-- Parabrisas -->
      <path d="M -15,-10 L -8,-15 L 8,-15 L 15,-10 L 10,-8 L -10,-8 Z" 
            fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
      
      <!-- Faros delanteros -->
      <circle cx="-18" cy="-5" r="3" fill="#00f0ff" filter="url(#strongGlow)"/>
      <circle cx="18" cy="-5" r="3" fill="#00f0ff" filter="url(#strongGlow)"/>
      
      <!-- Líneas de velocidad -->
      <line x1="-30" y1="-3" x2="-25" y2="-3" stroke="#00d4ff" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
      <line x1="-30" y1="3" x2="-25" y2="3" stroke="#00d4ff" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
    </g>
    
    <!-- Centro del engranaje -->
    <circle cx="0" cy="0" r="15" fill="url(#bgGradient)" stroke="url(#mainGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="url(#mainGradient)" filter="url(#strongGlow)"/>
  </g>
  
  <!-- Texto "eGARAGE" estilizado -->
  <g filter="url(#glow)">
    <text x="256" y="340" font-family="'Orbitron', 'Rajdhani', 'Arial Black', sans-serif" 
          font-size="56" font-weight="900" fill="url(#mainGradient)" 
          text-anchor="middle" letter-spacing="4">eGARAGE</text>
  </g>
  
  <!-- Subtítulo tecnológico -->
  <g opacity="0.8">
    <text x="256" y="380" font-family="'Rajdhani', 'Roboto', sans-serif" 
          font-size="18" font-weight="300" fill="#00d4ff" 
          text-anchor="middle" letter-spacing="6">SMART WORKSHOP</text>
  </g>
  
  <!-- Líneas decorativas -->
  <line x1="100" y1="390" x2="200" y2="390" stroke="url(#mainGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="312" y1="390" x2="412" y2="390" stroke="url(#mainGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Elementos de UI futuristas en las esquinas -->
  <g opacity="0.4">
    <!-- Esquina superior izquierda -->
    <line x1="40" y1="40" x2="80" y2="40" stroke="#00d4ff" stroke-width="2"/>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="40" cy="40" r="3" fill="#00d4ff"/>
    
    <!-- Esquina superior derecha -->
    <line x1="472" y1="40" x2="432" y2="40" stroke="#6c00ff" stroke-width="2"/>
    <line x1="472" y1="40" x2="472" y2="80" stroke="#6c00ff" stroke-width="2"/>
    <circle cx="472" cy="40" r="3" fill="#6c00ff"/>
    
    <!-- Esquina inferior izquierda -->
    <line x1="40" y1="472" x2="80" y2="472" stroke="#00d4ff" stroke-width="2"/>
    <line x1="40" y1="472" x2="40" y2="432" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="40" cy="472" r="3" fill="#00d4ff"/>
    
    <!-- Esquina inferior derecha -->
    <line x1="472" y1="472" x2="432" y2="472" stroke="#6c00ff" stroke-width="2"/>
    <line x1="472" y1="472" x2="472" y2="432" stroke="#6c00ff" stroke-width="2"/>
    <circle cx="472" cy="472" r="3" fill="#6c00ff"/>
  </g>
  
  <!-- Puntos de conexión decorativos -->
  <circle cx="256" cy="420" r="3" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="240" cy="430" r="2" fill="#0091ff" opacity="0.5"/>
  <circle cx="272" cy="430" r="2" fill="#0091ff" opacity="0.5"/>
</svg>