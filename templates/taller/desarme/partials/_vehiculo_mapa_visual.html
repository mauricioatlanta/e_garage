<!-- Cabecera de Botones Futuristas -->
<div class="hologram-controls" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; background: rgba(0, 5, 20, 0.85); padding: 10px; border-radius: 8px; border: 1px solid #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); font-family: monospace;">
    <button onclick="filtrarCategoria3D('TODOS')" style="background: transparent; color: #00f0ff; border: 1px solid #00f0ff; padding: 8px 16px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Ver Todo</button>
    <button onclick="filtrarCategoria3D('motor')" style="background: transparent; color: #00f0ff; border: 1px solid #00f0ff; padding: 8px 16px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Motor</button>
    <button onclick="filtrarCategoria3D('refrigeracion')" style="background: transparent; color: #00f0ff; border: 1px solid #00f0ff; padding: 8px 16px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Refrigeración</button>
    <button onclick="filtrarCategoria3D('carroceria')" style="background: transparent; color: #00f0ff; border: 1px solid #00f0ff; padding: 8px 16px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Carrocería</button>

<!-- Contenedor del Visor 3D -->
<div id="canvas-container" style="width: 100%; height: 600px; background: #000000; position: relative; border: 1px solid #002244;"></div>

<!-- IMPORTACIÓN DE LIBRERÍAS CLÁSICAS FIJAS COMPROBADAS -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>

<script>
let escena, camara, renderizador, controles, autoModelo;
let piezasDict = {};
let datosPiezas = {}; 

function cargarDatosDesdeAPI() {
    const jsonMOCK = {
        "piezas": [
            {"visual_slot": "engine", "categoria": "motor", "ubicacion_tipo": "VEHICULO", "nombre": "Motor Toyota 2.4", "sku": "MOT-24"},
            {"visual_slot": "radiator", "categoria": "refrigeracion", "ubicacion_tipo": "BODEGA", "nombre": "Radiador de Agua", "sku": "RAD-01"}
        ]
    };

    console.log("Poblando mapa visual...");
    jsonMOCK.piezas.forEach(pieza => {
        if (pieza.visual_slot) {
            datosPiezas[pieza.visual_slot] = {
                categoria: pieza.categoria,
                estado: pieza.ubicacion_tipo === "VEHICULO" ? "disponible_patio" : "disponible_bodega",
                nombre: pieza.nombre,
                sku: pieza.sku
            };
        }
    });
    actualizarColoresHologram();
}

function init3D() {
    const contenedor = document.getElementById('canvas-container');
    if(!contenedor) return;

    escena = new THREE.Scene();
    escena.background = new THREE.Color(0x000105);
    
    camara = new THREE.PerspectiveCamera(40, contenedor.clientWidth / contenedor.clientHeight, 0.1, 100); 
    camara.position.set(5, 3, 6);

    renderizador = new THREE.WebGLRenderer({ antialias: true });
    renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
    renderizador.setPixelRatio(window.devicePixelRatio);
    contenedor.appendChild(renderizador.domElement);

    controles = new THREE.OrbitControls(camara, renderizador.domElement);
    controles.enableDamping = true;
    controles.maxPolarAngle = 85 * (Math.PI / 180); 

    const rejilla = new THREE.GridHelper(20, 50, 0x004488, 0x001122);
    rejilla.position.y = -0.6;
    escena.add(rejilla);

    const luzAmbiente = new THREE.AmbientLight(0x0a2244, 0.8);
    escena.add(luzAmbiente);
    
    const luzDireccional = new THREE.DirectionalLight(0x00f0ff, 1.2);
    luzDireccional.position.set(5, 10, 7);
    escena.add(luzDireccional);

    const loader = new THREE.GLTFLoader();
    loader.load('/static/artifacts/meshy_sedan_diagnostic/working_copy.glb', function(gltf) {
        autoModelo = gltf.scene;
        
        autoModelo.traverse((child) => {
            if (child.isMesh) {
                piezasDict[child.name] = child;
                child.material = new THREE.MeshStandardMaterial({
                    color: 0x002b4c,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.25,
                    emissive: 0x00aacc,
                    emissiveIntensity: 0.4
                });
            }
        });

        escena.add(autoModelo);
        
        const box = new THREE.Box3().setFromObject(autoModelo);
        const center = box.getCenter(new THREE.Vector3());
        autoModelo.position.x += (autoModelo.position.x - center.x);
        autoModelo.position.z += (autoModelo.position.z - center.z);
        autoModelo.position.y = -0.5;

        cargarDatosDesdeAPI();
    });

    animate();
}

function obtenerMaterialEstado(estado) {
    let colorHex;
    switch(estado) {
        case 'disponible_patio':
            colorHex = 0x00f0ff; 
            break;
        case 'disponible_bodega':
            colorHex = 0xf59e0b; 
            break;
        case 'vendido':
            colorHex = 0xef4444; 
            break;
        default:
            colorHex = 0x0088aa;
    }

    return new THREE.MeshStandardMaterial({
        color: colorHex,
        wireframe: false, 
        transparent: true,
        opacity: 0.7,
        emissive: colorHex,
        emissiveIntensity: 0.8
    });
}

function actualizarColoresHologram() {
    for (let nombreMalla in piezasDict) {
        const piezaInfo = datosPiezas[nombreMalla];
        if (piezaInfo) {
            piezasDict[nombreMalla].material = obtenerMaterialEstado(piezaInfo.estado);
        }
    }
}

window.filtrarCategoria3D = function(cat) {
    for (let nombreMalla in piezasDict) {
        const malla = piezasDict[nombreMalla];
        const piezaInfo = datosPiezas[nombreMalla];

        if (cat === 'TODOS') {
            malleable = true;
            malla.visible = true;
            actualizarColoresHologram();
        } else if (piezaInfo && piezaInfo.categoria === cat) {
            malla.visible = true;
            malla.material.opacity = 0.95;
            malla.material.emissiveIntensity = 2.0;
        } else {
            malla.material.opacity = 0.04;
            malla.material.emissiveIntensity = 0.05;
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(controles) controles.update();
    renderizador.render(escena, camara);
}

window.addEventListener('load', init3D);
</script>
