{% extends 'base.html' %}
{% block content %}
    {% if request.user.is_authenticated %}
        {{ block.super }}
    {% else %}
        <div class="container py-5 text-center">
            <h2>Debes iniciar sesión para acceder a esta sección.</h2>
            <a href="{% url 'account_login' %}" class="btn btn-primary mt-3">Iniciar sesión</a>
        </div>
    {% endif %}
{% endblock %}
