{% load humanize %}
{% load country_url %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ document_label }} {{ documento.numero_documento|default:documento.id }}</title>
  <link rel="stylesheet" href="/static/css/documentos/pdf_documento_profesional.css">
  <style>
    body { background: #020617; margin: 0; padding: 24px; }
    .topbar {
      max-width: 1100px; margin: 0 auto 16px auto; display: flex; gap: 10px; flex-wrap: wrap;
    }
    .btn {
      text-decoration: none; color: #67e8f9; border: 1px solid rgba(34,211,238,.2);
      background: rgba(34,211,238,.08); border-radius: 14px; padding: 10px 14px; font-weight: 700;
    }
    .frame { max-width: 1100px; margin: 0 auto; }
    @media print {
      .topbar { display: none !important; }
      body { padding: 0; background: white; }
      .page-shell { border: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn" href="{% country_url 'documentos:descargar_documento_pdf' documento.id %}">Descargar PDF</a>
    <a class="btn" href="{% country_url 'documentos:compartir_documento_whatsapp' documento.id %}">WhatsApp</a>
    <a class="btn" href="{% country_url 'documentos:enviar_documento_email' documento.id %}">Enviar email</a>
    <a class="btn" href="{{ public_url }}" target="_blank">Ver enlace público</a>
    <button class="btn" onclick="window.print()">Imprimir</button>
  </div>

  <div class="frame">
    {% include "taller/documentos/pdf/documento_profesional_inner.html" %}
  </div>
</body>
</html>
