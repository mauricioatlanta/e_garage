<!-- Empty State -->
{% load i18n %}
{% load country_url %}
{% if not vehiculos %}
<div class="futuristic-card p-12 text-center col-span-full">
  <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center">
    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
    </svg>
  </div>
  <h3 class="text-xl font-bold text-white mb-2">{% trans "No vehicles found" %}</h3>
  <p class="text-cyan-300 mb-4">{% trans "Add your first vehicle to get started" %}</p>
  <a href="{% country_url 'vehiculos:crear_vehiculo' %}" class="interactive-btn inline-block">
    <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
    </svg>
    {% trans "Add Vehicle" %}
  </a>
</div>
{% endif %}
