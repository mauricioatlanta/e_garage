<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" class="egarage-logo">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6600ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo del logo -->
  <rect x="0" y="0" width="200" height="60" rx="15" fill="rgba(0,0,0,0.8)" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Icono de garage/herramienta -->
  <g transform="translate(15,15)">
    <!-- Herramienta principal -->
    <path d="M5 15 L25 5 L25 15 L20 20 L10 20 Z" fill="url(#logoGradient)" filter="url(#glow)"/>
    <!-- Detalles tecnológicos -->
    <circle cx="15" cy="12" r="3" fill="#00ffff" opacity="0.8"/>
    <rect x="8" y="18" width="14" height="2" fill="#00ffff" opacity="0.6"/>
    <!-- Líneas de energía -->
    <path d="M2 8 L8 8 M2 12 L6 12 M2 16 L4 16" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Texto eGarage -->
  <text x="50" y="25" font-family="Orbitron, monospace" font-size="16" font-weight="bold" fill="url(#logoGradient)" filter="url(#glow)">e</text>
  <text x="62" y="25" font-family="Orbitron, monospace" font-size="20" font-weight="900" fill="#ffffff">Garage</text>
  
  <!-- Subtítulo -->
  <text x="50" y="42" font-family="Inter, sans-serif" font-size="8" fill="#00ffff" opacity="0.8">DIGITAL WORKSHOP</text>
  
  <!-- Elementos decorativos -->
  <circle cx="180" cy="15" r="2" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="25" r="1.5" fill="#6600ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="35" r="1" fill="#0099ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
