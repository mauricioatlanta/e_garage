<!-- Futuristic Search Interface -->
<div class="futuristic-search mb-8">
  <div class="flex items-center space-x-4">
    <div class="flex-1 relative">
      <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input type="search" id="search-input" name="q" value="{{ request.GET.q }}" 
             placeholder="Search vehicles by plate, owner, brand..." 
             class="search-input w-full pl-12 pr-4">
      <div id="search-loading" class="absolute right-4 top-1/2 transform -translate-y-1/2 hidden">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-cyan-400"></div>
      </div>
    </div>
    <button type="button" id="search-btn" class="interactive-btn flex items-center space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <span>Search</span>
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchLoading = document.getElementById('search-loading');
    let searchTimeout;

    // Real-time search functionality
    searchInput.addEventListener('input', function() {
        const query = this.value.trim();
        
        // Clear previous timeout
        if (searchTimeout) {
            clearTimeout(searchTimeout);
        }

        // Show loading indicator
        searchLoading.classList.remove('hidden');

        // Debounce search - wait 300ms after user stops typing
        searchTimeout = setTimeout(() => {
            performSearch(query);
        }, 300);
    });

    // Search button click
    searchBtn.addEventListener('click', function() {
        const query = searchInput.value.trim();
        performSearch(query);
    });

    // Enter key search
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const query = this.value.trim();
            performSearch(query);
        }
    });

    function performSearch(query) {
        // Hide loading indicator
        searchLoading.classList.add('hidden');

        // Get current URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // Update search parameter
        if (query) {
            urlParams.set('q', query);
        } else {
            urlParams.delete('q');
        }

        // Build new URL
        const newUrl = window.location.pathname + '?' + urlParams.toString();
        
        // Perform AJAX request
        fetch(newUrl, {
            method: 'GET',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json',
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            // Update the table content
            const currentTable = document.querySelector('.futuristic-table');
            if (currentTable && data.table_html) {
                currentTable.innerHTML = data.table_html;
            }

            // Update pagination if exists
            const currentPagination = document.querySelector('.pagination-container');
            if (currentPagination && data.pagination_html) {
                currentPagination.innerHTML = data.pagination_html;
            }

            // Update empty state if exists
            const currentEmptyState = document.querySelector('.empty-state');
            if (currentEmptyState && data.empty_state_html) {
                currentEmptyState.innerHTML = data.empty_state_html;
            }

            // Update search results info
            const searchInfo = document.querySelector('.search-info');
            if (searchInfo && data.total_count !== undefined) {
                if (data.search_query) {
                    searchInfo.textContent = `🔍 Búsqueda: "${data.search_query}" - ${data.total_count} vehículos encontrados`;
                    searchInfo.style.display = 'block';
                } else {
                    searchInfo.style.display = 'none';
                }
            }

            // Update URL without page reload
            window.history.pushState({}, '', newUrl);
        })
        .catch(error => {
            console.error('Search error:', error);
            // Fallback to page reload
            window.location.href = newUrl;
        });
    }
});
</script>
