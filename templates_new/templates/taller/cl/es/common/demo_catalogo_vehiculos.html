<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Catálogo de Vehículos - eGarage</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
    
    <style>
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
        }
        .vehicle-form {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .demo-result {
            background: #e8f5e8;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">🚗 Demo Catálogo de Vehículos - eGarage</h1>
                <p class="text-center text-muted">Sistema de autocompletado con 5,008 modelos de vehículos</p>
            </div>
        </div>
        
        <!-- Estadísticas del Catálogo -->
        <div class="row mb-5">
            <div class="col-md-4">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <h2 id="total-modelos">...</h2>
                        <p class="mb-0">📊 Modelos Disponibles</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <h2 id="total-marcas">...</h2>
                        <p class="mb-0">🏷️ Marcas Únicas</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <h2>1970-2025</h2>
                        <p class="mb-0">📅 Años Cubiertos</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Formulario Demo -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="vehicle-form">
                    <h3 class="mb-4">🔍 Seleccionar Vehículo</h3>
                    
                    <form id="vehicle-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="marca" class="form-label">Marca del Vehículo</label>
                                <select id="marca" name="marca" class="form-select" style="width: 100%;">
                                    <option value="">Seleccionar marca...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modelo" class="form-label">Modelo del Vehículo</label>
                                <select id="modelo" name="modelo" class="form-select" style="width: 100%;" disabled>
                                    <option value="">Primero selecciona una marca</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-12">
                                <button type="button" id="demo-submit" class="btn btn-primary btn-lg w-100" disabled>
                                    ✨ Simular Selección
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <!-- Resultado Demo -->
                    <div id="demo-result" class="demo-result">
                        <h5>✅ Vehículo Seleccionado:</h5>
                        <p class="mb-0">
                            <strong>Marca:</strong> <span id="selected-marca"></span><br>
                            <strong>Modelo:</strong> <span id="selected-modelo"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Top Marcas -->
        <div class="row mt-5">
            <div class="col-12">
                <h3 class="text-center mb-4">🏆 Top 10 Marcas con Más Modelos</h3>
                <div id="top-marcas" class="row">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Cargar estadísticas
            loadStats();
            
            // Inicializar Select2 para marcas
            $('#marca').select2({
                theme: 'bootstrap-5',
                placeholder: 'Buscar marca...',
                allowClear: true,
                ajax: {
                    url: '/api/catalogo/marcas/',
                    dataType: 'json',
                    delay: 250,
                    data: function (params) {
                        return {
                            q: params.term
                        };
                    },
                    processResults: function (data) {
                        return {
                            results: data.results
                        };
                    },
                    cache: true
                }
            });
            
            // Inicializar Select2 para modelos
            $('#modelo').select2({
                theme: 'bootstrap-5',
                placeholder: 'Buscar modelo...',
                allowClear: true,
                ajax: {
                    url: '/api/catalogo/modelos/',
                    dataType: 'json',
                    delay: 250,
                    data: function (params) {
                        return {
                            q: params.term,
                            marca: $('#marca').val()
                        };
                    },
                    processResults: function (data) {
                        return {
                            results: data.results
                        };
                    },
                    cache: true
                }
            });
            
            // Cuando se selecciona una marca
            $('#marca').on('select2:select', function (e) {
                $('#modelo').prop('disabled', false);
                $('#modelo').val(null).trigger('change');
                $('#demo-submit').prop('disabled', true);
                $('#demo-result').hide();
            });
            
            // Cuando se limpia la marca
            $('#marca').on('select2:clear', function (e) {
                $('#modelo').prop('disabled', true).val(null).trigger('change');
                $('#demo-submit').prop('disabled', true);
                $('#demo-result').hide();
            });
            
            // Cuando se selecciona un modelo
            $('#modelo').on('select2:select', function (e) {
                $('#demo-submit').prop('disabled', false);
            });
            
            // Cuando se limpia el modelo
            $('#modelo').on('select2:clear', function (e) {
                $('#demo-submit').prop('disabled', true);
                $('#demo-result').hide();
            });
            
            // Botón demo
            $('#demo-submit').click(function() {
                const marca = $('#marca option:selected').text();
                const modelo = $('#modelo option:selected').text();
                
                $('#selected-marca').text(marca);
                $('#selected-modelo').text(modelo);
                $('#demo-result').slideDown();
                
                // Simular envío
                $(this).text('✅ Vehículo Registrado').addClass('btn-success').removeClass('btn-primary');
                
                setTimeout(() => {
                    $(this).text('✨ Simular Selección').removeClass('btn-success').addClass('btn-primary');
                }, 2000);
            });
        });
        
        function loadStats() {
            $.get('/api/catalogo/stats/', function(data) {
                $('#total-modelos').text(data.total_modelos.toLocaleString());
                $('#total-marcas').text(data.total_marcas.toLocaleString());
                
                // Mostrar top marcas
                let topMarcasHtml = '';
                data.top_marcas.forEach((marca, index) => {
                    const badgeClass = index < 3 ? 'bg-warning' : 'bg-primary';
                    topMarcasHtml += `
                        <div class="col-md-6 col-lg-4 mb-3">
                            <div class="card h-100">
                                <div class="card-body text-center">
                                    <h5>${marca.marca}</h5>
                                    <span class="badge ${badgeClass} fs-6">${marca.total} modelos</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                $('#top-marcas').html(topMarcasHtml);
            });
        }
    </script>
</body>
</html>
