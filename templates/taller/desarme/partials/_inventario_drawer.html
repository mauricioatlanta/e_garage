{% load i18n %}
{% load country_url %}
<div
  x-show="drawerOpen"
  x-transition.opacity
  class="fixed inset-0 z-50 bg-black/60 backdrop-blur-[2px]"
  @click.self="drawerOpen = false"
></div>

<aside
  x-show="drawerOpen"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="translate-x-full opacity-0"
  x-transition:enter-end="translate-x-0 opacity-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="translate-x-0 opacity-100"
  x-transition:leave-end="translate-x-full opacity-0"
  class="fixed right-0 top-0 z-[60] flex h-screen w-full max-w-[430px] flex-col border-l border-cyan-400/20 bg-slate-950/95 backdrop-blur-xl inventario-drawer-shadow"
>
  <div class="flex items-center justify-between border-b border-white/10 p-5">
    <div>
      <div class="text-[11px] uppercase tracking-[0.22em] text-cyan-300">{% trans "Panel de venta" %}</div>
      <h2 class="mt-1 text-xl font-black text-white">{% trans "Venta activa" %}</h2>
    </div>

    <button
      type="button"
      @click="drawerOpen = false"
      class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-bold text-slate-300 transition hover:border-cyan-400/30 hover:text-cyan-200"
    >
      {% trans "Cerrar" %}
    </button>
  </div>

  <div class="flex-1 overflow-auto p-4 inventario-scroll">
    <template x-if="selectedItems.length === 0">
      <div class="rounded-2xl border border-dashed border-white/10 bg-black/20 p-5 text-sm text-slate-400">
        {% trans "Haz clic en las fichas para construir la venta." %}
      </div>
    </template>

    <div class="space-y-3">
      <template x-for="item in selectedItems" :key="item.id">
        <div class="rounded-2xl border border-white/10 bg-[#07101c] p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="truncate text-sm font-bold text-white" x-text="item.nombre"></div>
              <div class="mt-1 text-[11px] text-slate-400" x-text="item.sku"></div>
            </div>

            <button
              type="button"
              @click="toggleSelect(item.id)"
              class="rounded-lg border border-rose-400/20 bg-rose-400/10 px-2 py-1 text-[10px] font-bold uppercase tracking-[0.16em] text-rose-200"
            >
              {% trans "Quitar" %}
            </button>
          </div>

          <div class="mt-3 grid grid-cols-2 gap-2">
            <div class="rounded-xl border border-white/10 bg-black/20 px-3 py-2">
              <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Cantidad" %}</div>
              <input
                type="number"
                min="1"
                x-model.number="quantities[item.id]"
                @input="sanitizeQuantity(item.id)"
                class="mt-1 w-full bg-transparent text-sm font-bold text-white outline-none"
              >
            </div>

            <div class="rounded-xl border border-white/10 bg-black/20 px-3 py-2">
              <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Precio venta" %}</div>
              <input
                type="number"
                min="0"
                step="1"
                x-model.number="salePrices[item.id]"
                @input="sanitizePrice(item.id, item.precio)"
                class="mt-1 w-full bg-transparent text-sm font-bold text-cyan-300 outline-none"
              >
            </div>
          </div>

          <div class="mt-3 grid grid-cols-3 gap-2 text-center">
            <div class="rounded-xl border border-white/10 bg-black/20 px-2 py-2">
              <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Base" %}</div>
              <div class="text-xs font-bold text-white" x-text="formatCLP(item.precio)"></div>
            </div>
            <div class="rounded-xl border border-white/10 bg-black/20 px-2 py-2">
              <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Venta" %}</div>
              <div class="text-xs font-bold text-cyan-300" x-text="formatCLP(salePrices[item.id] || item.precio)"></div>
            </div>
            <div class="rounded-xl border border-white/10 bg-black/20 px-2 py-2">
              <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500">{% trans "Línea" %}</div>
              <div class="text-xs font-black text-emerald-300" x-text="formatCLP(lineTotal(item.id, item.precio))"></div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div class="border-t border-white/10 p-4">
    <div class="space-y-2 rounded-2xl border border-white/10 bg-black/20 p-4">
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">{% trans "Items" %}</span>
        <span class="font-bold text-white" x-text="selectedItems.length"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">{% trans "Cantidad total" %}</span>
        <span class="font-bold text-white" x-text="totalQuantity"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">{% trans "Total final" %}</span>
        <span class="font-black text-cyan-300" x-text="formatCLP(totalPrice)"></span>
      </div>
    </div>

    <form method="post" action="{% country_url 'desarme:crear_venta_desde_inventario' vehiculo.pk %}" class="mt-4">
      {% csrf_token %}
      <input type="hidden" name="selected_data" :value="serializedSelection">

      <button
        type="submit"
        :disabled="selectedItems.length === 0"
        :class="selectedItems.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:scale-[1.01] hover:shadow-[0_0_24px_rgba(34,211,238,0.22)]'"
        class="w-full rounded-2xl bg-cyan-300 px-4 py-3.5 text-sm font-black uppercase tracking-[0.16em] text-slate-950 transition"
      >
        {% trans "Crear venta" %}
      </button>
    </form>
  </div>
</aside>
