{% load i18n %}
{% load country_url %}
<div class="inventario-toolbar-sticky sticky top-0 z-20 -mx-1 mb-4 rounded-2xl border border-cyan-400/20 bg-[#050816]/90 px-1 py-1 shadow-[0_8px_32px_rgba(0,0,0,0.35)] backdrop-blur-xl sm:-mx-0 sm:px-0">
  <div class="rounded-2xl border border-cyan-400/15 bg-slate-900/50 p-3 sm:p-4">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div class="min-w-0">
        <div class="mb-1 inline-flex items-center rounded-full border border-cyan-400/20 bg-cyan-400/10 px-2.5 py-0.5 text-[9px] uppercase tracking-[0.22em] text-cyan-200 sm:text-[10px]">
          {% trans "Terminal de venta" %}
        </div>
        <h2 class="text-lg font-black tracking-tight text-white sm:text-xl">
          {% trans "Inventario inteligente" %}
        </h2>
        <p class="mt-0.5 truncate text-xs text-slate-500">
          {{ vehiculo }}
        </p>
      </div>

      <div class="grid grid-cols-3 gap-2 sm:max-w-md sm:gap-2.5">
        <div class="rounded-xl border border-cyan-400/20 bg-cyan-400/5 px-2 py-1.5 text-center sm:px-3 sm:py-2">
          <div class="text-[9px] uppercase tracking-[0.18em] text-slate-500">{% trans "Visibles" %}</div>
          <div class="text-sm font-bold text-cyan-200 sm:text-base" x-text="filteredItems.length"></div>
        </div>
        <div class="rounded-xl border border-emerald-400/20 bg-emerald-400/5 px-2 py-1.5 text-center sm:px-3 sm:py-2">
          <div class="text-[9px] uppercase tracking-[0.18em] text-slate-500">{% trans "Seleccionados" %}</div>
          <div class="text-sm font-bold text-emerald-200 sm:text-base" x-text="selectedItems.length"></div>
        </div>
        <div class="rounded-xl border border-fuchsia-400/20 bg-fuchsia-400/5 px-2 py-1.5 text-center sm:px-3 sm:py-2">
          <div class="text-[9px] uppercase tracking-[0.18em] text-slate-500">{% trans "Total" %}</div>
          <div class="truncate text-xs font-bold text-fuchsia-200 sm:text-sm" x-text="formatCLP(totalPrice)"></div>
        </div>
      </div>
    </div>

    <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-12 sm:gap-3">
      <div class="sm:col-span-6 lg:col-span-5">
        <label class="mb-1 block text-[10px] uppercase tracking-[0.2em] text-slate-500">
          {% trans "Búsqueda" %}
        </label>
        <div class="relative">
          <input
            x-model.debounce.150ms="search"
            @focus="searchFocused = true"
            @click.away="searchFocused = false"
            type="text"
            placeholder="{% trans 'Nombre, código, categoría, ubicación…' %}"
            class="inv-spotlight-input w-full rounded-2xl border border-cyan-400/20 bg-[#07101c]/95 py-2.5 pl-10 pr-3 text-sm text-white placeholder:text-slate-500 outline-none transition focus:border-cyan-300 focus:ring-2 focus:ring-cyan-400/15"
          >
          <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-cyan-300/80" aria-hidden="true">⌕</span>

          <div
            x-show="searchFocused && search.trim().length > 0 && suggestions.length > 0"
            x-transition
            class="absolute left-0 right-0 top-[calc(100%+6px)] z-40 max-h-64 overflow-auto rounded-2xl border border-cyan-400/20 bg-slate-950/96 shadow-[0_12px_40px_rgba(0,0,0,0.45)] backdrop-blur-xl inventario-scroll"
          >
            <template x-for="suggestion in suggestions" :key="suggestion.label + suggestion.type">
              <button
                type="button"
                @click="applySuggestion(suggestion)"
                class="flex w-full items-center justify-between border-b border-white/5 px-3 py-2.5 text-left transition hover:bg-cyan-400/10 sm:px-4 sm:py-3"
              >
                <div class="min-w-0">
                  <div class="truncate text-sm font-medium text-white" x-text="suggestion.label"></div>
                  <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500" x-text="suggestion.type"></div>
                </div>
                <span class="shrink-0 text-xs text-cyan-300">{% trans "usar" %}</span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <div class="sm:col-span-3 lg:col-span-3">
        <label class="mb-1 block text-[10px] uppercase tracking-[0.2em] text-slate-500">
          {% trans "Orden" %}
        </label>
        <select
          x-model="sortBy"
          class="h-[42px] w-full rounded-2xl border border-cyan-400/20 bg-[#07101c]/95 px-3 text-sm text-white outline-none transition focus:border-cyan-300"
        >
          <option value="name">{% trans "Nombre" %}</option>
          <option value="stock_desc">{% trans "Mayor stock" %}</option>
          <option value="price_desc">{% trans "Mayor precio" %}</option>
          <option value="price_asc">{% trans "Menor precio" %}</option>
        </select>
      </div>

      <div class="sm:col-span-3 lg:col-span-4">
        <label class="mb-1 block text-[10px] uppercase tracking-[0.2em] text-slate-500 opacity-0 sm:mb-0 sm:h-[14px]">
          {% trans "Acciones" %}
        </label>
        <div class="grid h-[42px] grid-cols-3 gap-1.5 sm:gap-2">
          <button
            type="button"
            @click="clearFilters()"
            class="rounded-xl border border-white/10 bg-white/5 text-[10px] font-semibold text-slate-300 transition hover:border-cyan-400/30 hover:text-cyan-200 sm:text-xs"
          >
            {% trans "Limpiar" %}
          </button>
          <button
            type="button"
            @click="clearSelection()"
            class="rounded-xl border border-white/10 bg-white/5 text-[10px] font-semibold text-slate-300 transition hover:border-rose-400/30 hover:text-rose-200 sm:text-xs"
          >
            {% trans "Vaciar" %}
          </button>
          <button
            type="button"
            @click="selectVisible()"
            class="rounded-xl border border-emerald-400/25 bg-emerald-400/10 text-[10px] font-semibold text-emerald-200 transition hover:bg-emerald-400/15 sm:text-xs"
          >
            {% trans "Visibles" %}
          </button>
        </div>
      </div>
    </div>

    <div class="mt-3 flex gap-1.5 overflow-x-auto pb-0.5 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      <button
        type="button"
        @click="category=''"
        :class="category === '' ? activeChipClass : chipClass"
        class="shrink-0 rounded-full px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.14em] transition sm:px-4 sm:py-2 sm:text-[11px]"
      >
        {% trans "Todas" %}
      </button>
      <template x-for="cat in categories" :key="cat">
        <button
          type="button"
          @click="category = cat"
          :class="category === cat ? activeChipClass : chipClass"
          class="shrink-0 rounded-full px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.14em] transition sm:px-4 sm:py-2 sm:text-[11px]"
          x-text="cat"
        ></button>
      </template>
      <button
        type="button"
        @click="stockFilter = stockFilter === 'in_stock' ? '' : 'in_stock'"
        :class="stockFilter === 'in_stock' ? 'border-emerald-400/35 bg-emerald-400/15 text-emerald-200 shadow-[0_0_12px_rgba(52,211,153,0.12)]' : chipClass"
        class="shrink-0 rounded-full px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.14em] transition sm:px-4 sm:py-2 sm:text-[11px]"
      >
        {% trans "Con stock" %}
      </button>
      <button
        type="button"
        @click="stockFilter = stockFilter === 'out_stock' ? '' : 'out_stock'"
        :class="stockFilter === 'out_stock' ? 'border-rose-400/35 bg-rose-400/15 text-rose-200' : chipClass"
        class="shrink-0 rounded-full px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.14em] transition sm:px-4 sm:py-2 sm:text-[11px]"
      >
        {% trans "Sin stock" %}
      </button>
    </div>
  </div>
</div>
