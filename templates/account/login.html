{% extends "layouts/base_saas.html" %}
{% load i18n %}

{% block title %}Ingresar | eGarage{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl border border-cyan-500/30 bg-slate-900/80 p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-cyan-300 mb-2">Ingresar a eGarage</h1>
    <p class="text-slate-400 mb-6">Accede a tu panel de gestion automotriz.</p>

    <form method="post" action="{% url 'account_login' %}" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="w-full rounded-xl bg-cyan-500 px-4 py-3 font-bold text-slate-950 hover:bg-cyan-400">
        Ingresar
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-400">
      No tienes cuenta?
      <a class="text-cyan-300 hover:text-cyan-200" href="{% url 'account_signup' %}">Crear cuenta</a>
    </p>
  </div>
</section>
{% endblock %}
