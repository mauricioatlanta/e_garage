{% extends 'base.html' %}
{% load humanize %}

{% block title %}Historial - {{ vehiculo.patente }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/portal.css' %}">
<style>
    .portal-container {
        max-width: 1400px;
        margin: 2rem auto;
        padding: 0 1rem;
    }

    .portal-header {
        background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 2rem;
        color: white;
    }

    .portal-header h1 {
        margin: 0 0 0.5rem 0;
        font-size: 2rem;
    }

    .btn-back {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.5rem 1rem;
        background: #6b7280;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }

    .btn-export {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #ef4444;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin-top: 1rem;
    }

    .btn-export:hover {
        background: #dc2626;
    }
</style>
{% endblock %}

{% block content %}
<div class="portal-container">
    <a href="{% url 'portal:historial' %}" class="btn-back">← Volver a Mis Vehículos</a>

    <!-- Reutilizar el template de historial pero adaptado para portal -->
    {% include 'taller/reportes/historial_vehiculo.html' %}

    <!-- Botón de exportación -->
    <div style="text-align: center; margin-top: 2rem;">
        <a href="{% url 'portal:exportar_pdf' vehiculo.id %}" class="btn-export">
            📄 Descargar PDF
        </a>
    </div>
</div>
{% endblock %}
