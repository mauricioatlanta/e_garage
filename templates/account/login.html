{% extends "base_login.html" %}
{% load i18n static account socialaccount %}

{% block content %}

<a href="/cl/es/bienvenida/" class="top-back">
← Volver
</a>

<div class="login-card">

  <div class="logo-wrap">
    <img
      src="{% static 'taller/common/img/egarage-logo-simple.1884a8f7.svg' %}"
      alt="eGarage"
      class="logo"
    >

    <div class="logo-title">
      eGarage
    </div>

    <div class="logo-copy">
      Plataforma SaaS automotriz
    </div>
  </div>

  {% if form.errors %}
  <div class="alert">
    Usuario o contraseña inválidos.
  </div>
  {% endif %}

  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="id_login">
        {% trans "Email" %}
      </label>

      <input
        type="email"
        name="login"
        id="id_login"
        class="form-input"
        autocomplete="email"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password">
        {% trans "Password" %}
      </label>

      <input
        type="password"
        name="password"
        id="id_password"
        class="form-input"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" class="login-button">
      {% trans "Ingresar" %}
    </button>

  </form>

  <div class="login-footer">
    <a href="{% url 'account_reset_password' %}">
      Recuperar contraseña
    </a>
  </div>

</div>

{% endblock %}
