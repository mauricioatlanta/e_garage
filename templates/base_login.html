{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}eGarage{% endblock %}</title>

<style>
:root{
  --bg:#08111f;
  --card:#0f172a;
  --border:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#38bdf8;
  --primary-hover:#0ea5e9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-shell{
  width:100%;
  max-width:460px;
}

.login-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:36px;
}

.logo-wrap{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:180px;
  height:auto;
  margin-bottom:10px;
}

.logo-title{
  font-size:1.5rem;
  font-weight:700;
  margin-bottom:8px;
}

.logo-copy{
  color:var(--muted);
  font-size:.95rem;
}

.form-group{
  margin-bottom:18px;
}

.form-label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
  font-size:.92rem;
  font-weight:600;
}

.form-input{
  width:100%;
  height:52px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
  padding:0 16px;
  font-size:1rem;
}

.form-input:focus{
  outline:none;
  border-color:var(--primary);
}

.login-button{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:var(--primary);
  color:#04111d;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
}

.login-button:hover{
  background:var(--primary-hover);
}

.login-footer{
  margin-top:22px;
  text-align:center;
  color:var(--muted);
  font-size:.92rem;
}

.login-footer a{
  color:var(--primary);
  text-decoration:none;
}

.alert{
  margin-bottom:18px;
  padding:14px;
  border-radius:14px;
  border:1px solid #7f1d1d;
  background:#450a0a;
  color:#fecaca;
  font-size:.92rem;
}

.top-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  color:#cbd5e1;
  text-decoration:none;
  font-size:.92rem;
}
</style>

{% block extra_css %}{% endblock %}
</head>

<body>

<div class="login-shell">
{% block content %}{% endblock %}
</div>

{% block extra_js %}{% endblock %}
<script src="{% static 'js/password-toggle.js' %}"></script>
</body>
</html>
