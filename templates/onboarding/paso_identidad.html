{% extends "onboarding/base.html" %}

{% block step_content %}
<h3 class="h4 mb-4">Paso 1: Identidad de tu Empresa</h3>
<p class="text-muted mb-4">Configura la información básica de tu taller mecánico</p>

<form id="paso1Form">
    {% csrf_token %}

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_nombre_taller" class="form-label onb-label">Nombre del Taller</label>
                <input type="text" class="form-control onb-control" id="id_nombre_taller" name="nombre_taller"
                       value="{{ empresa.nombre_taller }}">
            </div>

        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_lema" class="form-label onb-label">Lema</label>
                <input type="text" class="form-control onb-control" id="id_lema" name="lema"
                       value="{{ form.lema.value|default:'' }}">
            </div>

        </div>
    </div>

    <div class="mb-3">
        <label for="id_direccion" class="form-label onb-label">Dirección</label>
        <input type="text" class="form-control onb-control" id="id_direccion" name="direccion"
               value="{{ empresa.direccion }}">
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_logo" class="form-label onb-label">Logo</label>
                <input type="file" class="form-control onb-control" id="id_logo" name="logo" accept="image/*">
                {% if empresa.logo %}
                <div class="mt-2">
                    <img src="{{ empresa.logo.url }}" alt="Logo actual" style="max-height: 50px;">
                </div>
                {% endif %}
            </div>

        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_email" class="form-label onb-label">Email de Contacto</label>
                <input type="email" class="form-control onb-control" id="id_email" name="email"
                       value="{{ empresa.email }}">
            </div>

        </div>
    </div>
</form>
{% endblock %}
