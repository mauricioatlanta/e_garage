{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}eGarage{% endblock %}</title>

  <link rel="icon" type="image/png" href="{% static 'images/egarage_icon_192x192.png' %}">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=3.0.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  {% block extra_head %}{% endblock %}
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="eg-shell">
    {% include "components/sidebar.html" %}
    <main class="eg-main">
      {% include "components/topbar.html" %}
      <section class="eg-content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  {% block extra_js %}<script src="/static/js/region_ciudad_handler.js"></script>{% endblock %}
</body>
</html>
