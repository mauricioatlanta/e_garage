{% if request.empresa and request.empresa.pais == "US" %}
<div class="language-switcher">
  <form action="{% url 'set_language_us' %}" method="post" class="inline-flex items-center gap-2">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="lang" class="text-sm opacity-80">Language</label>
    <select id="lang" name="language" class="form-select form-select-sm" onchange="this.form.submit()">
      <option value="en" {% if request.LANGUAGE_CODE == 'en' %}selected{% endif %}>English</option>
      <option value="es" {% if request.LANGUAGE_CODE == 'es' %}selected{% endif %}>Español</option>
    </select>
  </form>
</div>
{% endif %}
