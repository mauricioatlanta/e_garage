<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ empresa.nombre }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="stylesheet" href="/static/css/output.css">
  <style>
    /* Ocultar scrollbar en nav de categorías manteniendo el scroll funcional */
    .nav-cats::-webkit-scrollbar { display: none; }
    .nav-cats { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-white text-gray-900 flex flex-col">

  <!-- Barra superior -->
  <header class="border-b border-gray-200 bg-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Logo / nombre — max-width para no empujar el buscador en nombres largos -->
        <a href="{% url 'commerce:home' %}"
           class="flex-shrink-0 font-bold text-lg sm:text-xl tracking-tight text-gray-900
                  max-w-[140px] sm:max-w-xs lg:max-w-sm truncate"
           title="{{ empresa.nombre }}">
          {{ empresa.nombre }}
        </a>

        <!-- Buscador -->
        <form action="{% url 'commerce:search' %}" method="get" class="flex-1 max-w-lg">
          <div class="relative">
            <input
              type="search"
              name="q"
              value="{{ request.GET.q }}"
              placeholder="Buscar repuesto, SKU, número de parte..."
              class="w-full rounded-lg border border-gray-300 bg-gray-50 py-2 pl-4 pr-10 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            >
            <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </button>
          </div>
        </form>

      </div>

      <!-- Navegación de categorías
           Desktop: horizontal sin desborde.
           Móvil: scroll horizontal, sin scrollbar visible, con fade-out lateral. -->
      {% if categories %}
      <div class="relative">
        <!-- Gradiente derecho para indicar que hay más contenido en móvil -->
        <div class="pointer-events-none absolute inset-y-0 right-0 w-8 bg-gradient-to-l from-white to-transparent sm:hidden"></div>
        <nav class="nav-cats flex gap-6 pb-2 overflow-x-auto text-sm">
          {% for cat in categories %}
          <a href="{% url 'commerce:category' cat.slug %}"
             class="whitespace-nowrap text-gray-600 hover:text-blue-600 font-medium py-1
                    border-b-2 border-transparent hover:border-blue-600 transition-colors flex-shrink-0">
            {{ cat.name }}
          </a>
          {% endfor %}
        </nav>
      </div>
      {% endif %}
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-gray-50 mt-12">
    <div class="max-w-7xl mx-auto px-4 py-8 text-sm text-gray-500 text-center">
      © {% now "Y" %} {{ empresa.nombre }}. Todos los derechos reservados.
    </div>
  </footer>

</body>
</html>
