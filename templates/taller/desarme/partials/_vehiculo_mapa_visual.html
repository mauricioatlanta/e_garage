{% load country_url static %}

<!-- ================================================================= -->
<!-- CONTENEDOR GEMELO DIGITAL 3D // eGarage Cinemático                -->
<!-- ================================================================= -->
<div class="relative w-full rounded-2xl overflow-hidden border border-cyan-500/30 bg-slate-950 shadow-2xl mt-4">
  
  <!-- Header de Telemetría -->
  <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-3 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md">
    <div class="flex items-center gap-2.5">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#22d3ee]"></span>
      <h3 class="text-xs font-mono font-bold uppercase tracking-widest text-cyan-400">
        GEMELO DIGITAL 3D // {{ vehiculo.tipo_carroceria|default:"SEDAN"|upper }}
      </h3>
    </div>
    <!-- Semáforo de Estado -->
    <div class="flex flex-wrap items-center gap-2 text-[11px] font-mono">
      <span class="px-2 py-0.5 rounded bg-cyan-950/70 border border-cyan-500/40 text-cyan-300">● Chasis (Patio)</span>
      <span class="px-2 py-0.5 rounded bg-amber-950/70 border border-amber-500/40 text-amber-300">● En Bodega</span>
      <span class="px-2 py-0.5 rounded bg-rose-950/70 border border-rose-500/40 text-rose-300">● Vendida</span>
      <span class="px-2 py-0.5 rounded bg-purple-950/70 border border-purple-500/40 text-purple-300">● Externo</span>
    </div>
  </div>

  <!-- Viewport 3D WebGL -->
  <div id="viewport-3d-box" class="w-full relative cursor-grab active:cursor-grabbing" style="height: 520px; min-height: 520px; background: radial-gradient(circle at 50% 40%, #06162a 0%, #020617 85%);">
    <div id="loading-3d" class="absolute inset-0 flex items-center justify-center text-cyan-400 font-mono text-xs tracking-widest bg-slate-950/80 z-10">
      <span class="animate-pulse">SINTETIZANDO MODELO 3D & TELEMETRÍA...</span>
    </div>
    <canvas id="three-car-canvas" class="w-full h-full block"></canvas>
  </div>

  <!-- Drawer Lateral Deslizante -->
  <div id="part-drawer" class="hidden absolute top-16 right-4 z-20 w-80 rounded-xl bg-slate-900/95 border border-cyan-500/40 p-4 shadow-2xl backdrop-blur-xl transition-all duration-200">
    <div class="flex justify-between items-start mb-2.5 pb-2 border-b border-slate-800">
      <div>
        <span id="drawer-slot" class="text-[10px] font-mono uppercase text-slate-400 block mb-0.5">SLOT</span>
        <span id="drawer-code" class="text-xs font-mono font-bold text-cyan-400 bg-cyan-950/80 px-2 py-0.5 rounded border border-cyan-800/50"></span>
      </div>
      <button onclick="document.getElementById('part-drawer').classList.add('hidden')" class="text-slate-400 hover:text-white text-base leading-none p-1">✕</button>
    </div>
    
    <h4 id="drawer-name" class="text-sm font-semibold text-white mb-2 leading-snug"></h4>
    
    <div class="space-y-1.5 text-xs text-slate-300 mb-4 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80 font-mono">
      <div class="flex justify-between">
        <span class="text-slate-400">Ubicación:</span>
        <span id="drawer-loc" class="font-medium text-white"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Procedencia:</span>
        <span id="drawer-origin" class="font-medium text-white"></span>
      </div>
      <div class="flex justify-between pt-1 border-t border-slate-800">
        <span class="text-slate-400">Precio Sugerido:</span>
        <span id="drawer-price" class="text-emerald-400 font-bold text-sm"></span>
      </div>
    </div>
    
    <div class="flex gap-2">
      <a id="drawer-edit-btn" href="#" class="w-full py-2 text-center text-xs font-semibold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-[0_0_12px_rgba(6,182,212,0.3)]">
        Abrir Ficha de Repuesto
      </a>
    </div>
  </div>
</div>

<!-- LIBRERÍAS: Three.js + Postprocessing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(function() {
  const container = document.getElementById("viewport-3d-box");
  const canvas = document.getElementById("three-car-canvas");
  const loading = document.getElementById("loading-3d");
  if (!container || !canvas || typeof THREE === "undefined") return;

  const width = container.clientWidth;
  const height = container.clientHeight || 520;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020617, 0.035);

  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
  camera.position.set(5.2, 2.6, 5.2);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(width, height), 1.2, 0.4, 0.28);
  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 + 0.02;
  controls.minDistance = 2.5;
  controls.maxDistance = 10;

  scene.add(new THREE.AmbientLight(0x00f0ff, 0.7));
  const topLight = new THREE.DirectionalLight(0xffffff, 1.4);
  topLight.position.set(4, 8, 6);
  scene.add(topLight);

  const rimLight = new THREE.DirectionalLight(0xa855f7, 2.0);
  rimLight.position.set(-5, 3, -5);
  scene.add(rimLight);

  const grid = new THREE.GridHelper(12, 24, 0x00f0ff, 0x1e293b);
  grid.position.y = -0.55;
  scene.add(grid);

  const carGroup = new THREE.Group();
  scene.add(carGroup);

  const bodyType = "{{ vehiculo.tipo_carroceria|default:'sedan'|lower }}";
  
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x05203c,
    roughness: 0.15,
    metalness: 0.2,
    transmission: 0.82,
    transparent: true,
    opacity: 0.42,
    depthWrite: false
  });
  
  const edgeLineMat = new THREE.LineBasicMaterial({
    color: 0x00f0ff,
    transparent: true,
    opacity: 0.55
  });

  function createCarChassis(type) {
    const group = new THREE.Group();
    const shape = new THREE.Shape();

    if (type === "pickup") {
      shape.moveTo(-2.3, -0.05);
      shape.lineTo(2.3, -0.05);
      shape.lineTo(2.3, 0.45);
      shape.lineTo(0.9, 0.55);
      shape.lineTo(0.4, 1.25);
      shape.lineTo(-0.8, 1.25);
      shape.lineTo(-0.85, 0.55);
      shape.lineTo(-2.3, 0.55);
      shape.closePath();
    } else if (type === "van") {
      shape.moveTo(-2.2, -0.05);
      shape.lineTo(2.2, -0.05);
      shape.lineTo(2.2, 0.35);
      shape.lineTo(1.4, 0.85);
      shape.lineTo(0.7, 1.35);
      shape.lineTo(-2.0, 1.35);
      shape.lineTo(-2.2, 0.65);
      shape.closePath();
    } else {
      shape.moveTo(-2.2, -0.05);
      shape.lineTo(2.2, -0.05);
      shape.lineTo(2.2, 0.32);
      shape.lineTo(1.15, 0.44);
      shape.lineTo(0.45, 1.02);
      shape.lineTo(-0.75, 1.02);
      shape.lineTo(-1.3, 0.44);
      shape.lineTo(-2.2, 0.44);
      shape.closePath();
    }

    const extrudeSettings = {
      steps: 1,
      depth: (type === "pickup" || type === "van") ? 1.65 : 1.5,
      bevelEnabled: true,
      bevelThickness: 0.08,
      bevelSize: 0.08,
      bevelSegments: 4
    };

    const bodyGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    bodyGeo.center();

    const bodyMesh = new THREE.Mesh(bodyGeo, glassMat);
    const edges = new THREE.EdgesGeometry(bodyGeo, 24);
    const line = new THREE.LineSegments(edges, edgeLineMat);
    bodyMesh.add(line);
    bodyMesh.position.y = 0.25;
    group.add(bodyMesh);

    return group;
  }

  carGroup.add(createCarChassis(bodyType));

  const interactiveSlots = {};

  function registerSlot(slotName, geo, pos, defaultColor, meta) {
    const mat = new THREE.MeshStandardMaterial({
      color: defaultColor,
      emissive: defaultColor,
      emissiveIntensity: 0.45,
      metalness: 0.8,
      roughness: 0.2
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...pos);
    mesh.name = slotName;
    mesh.userData = { slotName, defaultColor, parts: meta ? [meta] : [] };
    mesh.visible = false; 

    carGroup.add(mesh);
    interactiveSlots[slotName] = mesh;
    return mesh;
  }

  registerSlot("engine.core", new THREE.BoxGeometry(0.8, 0.6, 0.75), [1.1, 0.25, 0], 0x00f0ff);
  registerSlot("engine.alternator", new THREE.CylinderGeometry(0.14, 0.14, 0.22, 16), [1.3, 0.35, 0.3], 0x00f0ff);
  registerSlot("engine.starter", new THREE.CylinderGeometry(0.12, 0.12, 0.22, 16), [0.8, 0.0, -0.3], 0xf59e0b);
  registerSlot("cooling.radiator", new THREE.BoxGeometry(0.1, 0.5, 1.2), [2.05, 0.2, 0], 0x00f0ff);

  const doorGeo = new THREE.BoxGeometry(0.85, 0.65, 0.12);
  registerSlot("door.front.left", doorGeo, [0.15, 0.35, 0.85], 0x00f0ff);
  registerSlot("door.front.right", doorGeo, [0.15, 0.35, -0.85], 0x00f0ff);
  registerSlot("door.rear.left", doorGeo, [-0.75, 0.35, 0.85], 0x00f0ff);
  registerSlot("door.rear.right", doorGeo, [-0.75, 0.35, -0.85], 0x00f0ff);

  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24);
  wheelGeo.rotateX(Math.PI / 2);
  registerSlot("wheel.fl", wheelGeo, [1.35, -0.22, 0.9], 0x00f0ff);
  registerSlot("wheel.fr", wheelGeo, [1.35, -0.22, -0.9], 0x00f0ff);
  registerSlot("wheel.rl", wheelGeo, [-1.45, -0.22, 0.9], 0x00f0ff);
  registerSlot("wheel.rr", wheelGeo, [-1.45, -0.22, -0.9], 0x00f0ff);

  if (loading) loading.classList.add("hidden");

  const vehiculoId = "{{ vehiculo.id }}";
  if (vehiculoId) {
    fetch(window.location.pathname.replace(/\/+$/, "") + "/api/mapa-piezas/")
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        (data.parts || []).forEach(p => {
          const slot = interactiveSlots[p.visual_slot] || Object.values(interactiveSlots).find(m => m.name.includes(p.visual_slot));
          if (slot) {
            slot.userData.parts.push(p);
            let color = 0x00f0ff;
            if (p.location_type === "BODEGA") color = 0xf59e0b;
            if (p.status === "VENDIDA") color = 0xef4444;
            if (p.origin === "COMPRA_EXTERNA") color = 0xa855f7;
            
            slot.material.color.setHex(color);
            slot.material.emissive.setHex(color);
            slot.material.emissiveIntensity = 0.9;
          }
        });
      })
      .catch(() => {});
  }

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function onPointerDown(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(Object.values(interactiveSlots));

    if (intersects.length > 0) {
      const target = intersects[0].object;
      const parts = target.userData.parts || [];
      const info = parts[0];
      const drawer = document.getElementById("part-drawer");

      if (drawer) {
        document.getElementById("drawer-slot").textContent = target.userData.slotName;
        document.getElementById("drawer-code").textContent = (info && info.code) ? info.code : "S/C";
        document.getElementById("drawer-name").textContent = (info && info.name) ? info.name : "Componente no registrado";
        
        const loc = info ? (info.location_type === "BODEGA" ? "En Bodega" : "Chasis (Patio)") : "Sin ubicación";
        const locDet = (info && info.location_detail) ? ` (${info.location_detail})` : "";
        document.getElementById("drawer-loc").textContent = loc + locDet;
        
        document.getElementById("drawer-origin").textContent = (info && info.origin) ? info.origin : "DESARME_PROPIO";
        document.getElementById("drawer-price").textContent = (info && info.price) ? `$${info.price.toLocaleString()} CLP` : "A consultar";
        
        const btn = document.getElementById("drawer-edit-btn");
        if (info && info.id) {
          btn.href = `/cl/es/desarme/piezas/${info.id}/editar/`;
          btn.classList.remove("pointer-events-none", "opacity-50");
        } else {
          btn.href = "#";
          btn.classList.add("pointer-events-none", "opacity-50");
        }

        drawer.classList.remove("hidden");
      }
    }
  }

  renderer.domElement.addEventListener("click", onPointerDown);

  window.addEventListener("resize", function() {
    const newWidth = container.clientWidth;
    const newHeight = container.clientHeight || 520;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
    composer.setSize(newWidth, newHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    composer.render();
  }
  animate();
})();
</script>
