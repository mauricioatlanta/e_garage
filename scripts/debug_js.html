<!DOCTYPE html>
<html>
<head>
    <title>Debug JavaScript</title>
</head>
<body>
    <h1>Debug JavaScript</h1>
    <div id="test-buttons">
        <button class="tipo-btn" data-tipo="PRES" data-color="#4CAF50">Estimate</button>
        <button class="tipo-btn" data-tipo="OT" data-color="#FF9800">Work Order</button>
        <button class="tipo-btn" data-tipo="FAC" data-color="#F44336">Invoice</button>
    </div>

    <input type="hidden" id="tipoDocumento">

    <select id="clienteSelect">
        <option value="">Seleccionar cliente...</option>
        <option value="1" data-search="john doe">John Doe</option>
        <option value="2" data-search="jane smith">Jane Smith</option>
    </select>

    <input type="text" id="clienteSearch" placeholder="Buscar cliente...">
    <div id="clienteDropdown"></div>

    <script>
        console.log('Script iniciado');

        const tipoButtons = document.querySelectorAll('.tipo-btn');
        const tipoInput = document.getElementById('tipoDocumento');
        const clienteSelect = document.getElementById('clienteSelect');

        console.log('tipoButtons encontrados:', tipoButtons.length);
        console.log('tipoInput:', tipoInput);
        console.log('clienteSelect:', clienteSelect);

        tipoButtons.forEach(btn => {
            console.log('Configurando botón:', btn.dataset.tipo);
            btn.addEventListener('click', function() {
                console.log('Botón clickeado:', this.dataset.tipo);
                tipoButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                tipoInput.value = this.dataset.tipo;
                console.log('Valor asignado:', tipoInput.value);
            });
        });
    </script>
</body>
</html>
