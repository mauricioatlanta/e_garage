services:
  - type: web
    name: egarage-web
    env: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn gestion_taller.wsgi:application --bind 0.0.0.0:$PORT
    postDeployCommand: |
      python manage.py migrate --noinput
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_taller.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "eggarage-web.onrender.com,.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: egarage-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "3"
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 2

databases:
  - name: egarage-db
    plan: free
    region: oregon
