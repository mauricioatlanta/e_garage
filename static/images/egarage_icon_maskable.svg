<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes futuristas -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0091ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c00ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Filtros de brillo -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Patrón de circuitos sutil -->
    <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#00d4ff" opacity="0.2"/>
      <circle cx="50" cy="30" r="1.5" fill="#0091ff" opacity="0.2"/>
      <circle cx="80" cy="70" r="1.5" fill="#6c00ff" opacity="0.2"/>
      <line x1="10" y1="10" x2="50" y2="30" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
      <line x1="50" y1="30" x2="80" y2="70" stroke="#0091ff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="110"/>
  
  <!-- Patrón de circuitos de fondo (sutil) -->
  <rect width="512" height="512" fill="url(#circuitPattern)" opacity="0.3"/>
  
  <!-- Círculos decorativos de fondo -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="256" cy="256" r="300" fill="none" stroke="#6c00ff" stroke-width="1" opacity="0.05"/>
  
  <!-- Engranaje tecnológico CENTRADO (75% del tamaño para área segura) -->
  <g transform="translate(256, 256)">
    <!-- Círculo exterior del engranaje -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#mainGradient)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Dientes del engranaje (8 dientes distribuidos uniformemente) -->
    <g filter="url(#glow)">
      <!-- Dientes principales -->
      <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      <g transform="rotate(45)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
      <g transform="rotate(90)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
      <g transform="rotate(135)">
        <rect x="-8" y="-95" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
        <rect x="-8" y="75" width="16" height="20" fill="url(#mainGradient)" rx="2"/>
      </g>
    </g>
    
    <!-- Ícono de coche futurista en el centro -->
    <g transform="scale(1.8)">
      <!-- Carrocería principal -->
      <path d="M -25,-8 L -20,-15 L -8,-18 L 8,-18 L 20,-15 L 25,-8 L 25,8 L 20,12 L -20,12 L -25,8 Z" 
            fill="url(#glowGradient)" stroke="url(#mainGradient)" stroke-width="2" filter="url(#strongGlow)"/>
      
      <!-- Parabrisas -->
      <path d="M -15,-10 L -8,-15 L 8,-15 L 15,-10 L 10,-8 L -10,-8 Z" 
            fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
      
      <!-- Faros delanteros -->
      <circle cx="-18" cy="-5" r="3" fill="#00f0ff" filter="url(#strongGlow)"/>
      <circle cx="18" cy="-5" r="3" fill="#00f0ff" filter="url(#strongGlow)"/>
      
      <!-- Líneas de velocidad -->
      <line x1="-30" y1="-3" x2="-25" y2="-3" stroke="#00d4ff" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
      <line x1="-30" y1="3" x2="-25" y2="3" stroke="#00d4ff" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
    </g>
    
    <!-- Centro del engranaje -->
    <circle cx="0" cy="0" r="15" fill="url(#bgGradient)" stroke="url(#mainGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="url(#mainGradient)" filter="url(#strongGlow)"/>
  </g>
  
  <!-- NOTA: Este SVG NO incluye texto para ser usado como icono maskable -->
  <!-- El símbolo central (engranaje + auto) está en el 75% del área central -->
  <!-- Esto asegura que no será cortado por las máscaras circulares en Android -->
</svg>



