  <defs>
    <filter id="glow-zone-left">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .zone { fill: #9ca3af; stroke: #64748b; stroke-width: 1; cursor: pointer; transition: all 0.2s ease; }

      .zone.selected { stroke: #22d3ee; stroke-width: 2; }
      .zone.status-unreviewed { fill: #94a3b8; }
      .zone.status-available { fill: #22c55e; }
      .zone.status-damaged { fill: #ef4444; }
      .zone.status-scrap { fill: #1e293b; }
      .zone.status-reserved { fill: #eab308; }
      .zone.status-sold { fill: #3b82f6; }
    </style>
  </defs>
