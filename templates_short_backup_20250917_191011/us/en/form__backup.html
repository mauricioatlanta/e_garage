{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Document · eGarage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- cache-bust v3 -->
  <link rel="stylesheet" href="{% static 'documentos/documentos_form_v3.css' %}?v=3">
</head>
<body class="doc doc-wrap cyber-grid scan-line"
      data-country="{{ empresa.pais|default_if_none:'CL' }}"
      data-tax-rate="{{ empresa.configuracion.sales_tax|default_if_none:'0.19' }}"
      data-endpoint-otros="/api/otros-servicios/">

  <div class="header">
    <div class="left">
      <span class="badge"><span class="dot"></span><span>Create Document</span></span>
      <strong class="h1">eGarage</strong>
    </div>
    <div class="right">
      <select id="id_tipo" class="select">
        <option value="INVOICE">Invoice</option>
        <option value="WORK_ORDER">Work Order</option>
        <option value="QUOTE">Quote</option>
      </select>
      <button class="btn" id="btn-save">Create Document</button>
    </div>
  </div>

  <div class="theme-bar"></div>

  <!-- Cliente y Vehículo -->
  <section class="card">
    <div class="row">
      <div class="col">
        <label class="label">Search client</label>
        <input id="busca-cliente" class="input" placeholder="Name / phone">
        <div id="res-cliente" class="dropdown" style="display:none"></div>
      </div>
      <div class="col">
        <label class="label">Phone</label>
        <input id="cliente-telefono" class="input" readonly>
      </div>
      <div class="col">
        <label class="label">Vehicle</label>
        <select id="sel-vehiculo" class="select">
          <option value="">Select...</option>
        </select>
      </div>
      <div class="col">
        <label class="label">Mileage / Kilometraje</label>
        <input id="millas_km" class="input" type="number" min="0" step="1">
      </div>
    </div>
  </section>

  <!-- Repuestos -->
  <section class="card">
    <h3>Parts / Repuestos</h3>
    <div class="flex gap-2 items-end">
      <button type="button" id="btn-add-part" class="btn">+ Add Part</button>
      <button type="button" id="btn-quick-add-part" class="btn">⚡ Quick add</button>
    </div>
    <div class="mt-3">
      <label class="label">Quick parts search</label>
      <input id="search-part" class="input" placeholder="Code, name or description of the part...">
      <div id="res-part" class="dropdown"></div>
    </div>
    <table class="table mt-3" id="tabla-repuestos">
      <thead><tr>
        <th>CODE</th><th>DESCRIPTION</th><th>QUANTITY</th><th>UNIT PRICE</th><th>SUBTOTAL</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Servicios -->
  <section class="card">
    <h3>Services / Servicios</h3>
    <div class="flex gap-2 items-end">
      <button type="button" id="btn-add-service" class="btn">+ Add service</button>
      <button type="button" id="btn-quick-add-service" class="btn">⚡ Quick add</button>
    </div>
    <div class="mt-3">
      <label class="label">Quick services search</label>
      <input id="search-service" class="input" placeholder="Name or description of the service...">
      <div id="res-service" class="dropdown"></div>
    </div>
    <table class="table mt-3" id="tabla-servicios">
      <thead><tr>
        <th>SERVICE</th><th>DESCRIPTION</th><th>PRICE</th><th>SUBTOTAL</th><th>ACTIONS</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Totales -->
  <section class="card">
    <div class="row">
      <div class="col">
        <label class="label">Notes</label>
        <textarea id="notas" class="input" rows="4" placeholder="Internal / customer notes"></textarea>
      </div>
      <div class="col">
        <div class="totals-box">
          <div class="row-line"><span class="label">Total Parts</span><input id="id_total_repuestos" class="input readonly-total" value="0" readonly></div>
          <div class="row-line"><span class="label">Total Services</span><input id="id_total_servicios" class="input readonly-total" value="0" readonly></div>
          <div class="row-line"><span class="label">Other Services</span><input id="id_total_otros" class="input readonly-total" value="0" readonly></div>
          <hr class="sep">
          <div class="row-line"><span class="label">Sales Tax (parts only)</span><input id="id_impuesto" class="input readonly-total" value="0" readonly></div>
          <div class="row-line"><span class="label">Grand Total</span><input id="id_gran_total" class="input readonly-total" value="0" readonly></div>
          <hr class="sep">
          <div class="row-line"><span class="label">Paid</span><input id="id_pagado" type="checkbox"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- cache-bust v3 -->
  <script src="{% static 'documentos/documentos_form_v3.js' %}?v=3"></script>

  <!-- Hotfix inline para diagnóstico -->
  <script>
  (function(){
    // Diagnóstico: ver si este inline se ejecuta
    console.log('[docform-inline] running');

    // Selector robusto: id_tipo, name="tipo" o select con opciones típicas
    function getTipoSelect(){
      return document.querySelector('#id_tipo')
          || document.querySelector('select[name="tipo"]')
          || Array.from(document.querySelectorAll('select'))
               .find(s => Array.from(s.options).some(o => /invoice|work|quote|recibo|orden|presupuesto/i.test(o.value+o.text)));
    }

    function applyType(val){
      const map = {
        'INVOICE':'recibo_factura','RECIBO_FACTURA':'recibo_factura',
        'WORK_ORDER':'orden_trabajo','ORDEN_TRABAJO':'orden_trabajo',
        'QUOTE':'presupuesto','PRESUPUESTO':'presupuesto'
      };
      document.body.classList.remove('recibo_factura','orden_trabajo','presupuesto');
      const klass = map[String(val||'').toUpperCase()];
      if (klass){ document.body.classList.add(klass); }
      console.log('[docform-inline] type->class', val, klass);
    }

    function hook(){
      const sel = getTipoSelect();
      if(!sel){ console.warn('[docform-inline] no select tipo'); return; }
      sel.removeEventListener('change', sel._eg_applyType||(()=>{}));
      sel._eg_applyType = ()=> applyType(sel.value);
      sel.addEventListener('change', sel._eg_applyType);
      applyType(sel.value);
    }

    // correr ahora y cuando el DOM cambie (por si un framework re-renderiza)
    document.addEventListener('DOMContentLoaded', hook);
    const mo = new MutationObserver(()=> hook());
    mo.observe(document.body, {childList:true, subtree:true});

    // Test rápido de endpoints (cliente, repuestos, servicios)
    ['clientes/?q=test','repuestos/?pn=test','servicios/?q=test'].forEach(p=>{
      fetch('/api/'+p, {credentials:'same-origin'}).then(r=>{
        console.log('[docform-inline] GET /api/'+p, r.status);
        return r.text();
      }).then(t=>{
        // No romper nada; solo mostrar 60 chars para confirmar JSON o error
        console.log('[docform-inline] sample', (t||'').slice(0,60));
      }).catch(e=> console.warn('[docform-inline] fetch error', p, e));
    });
  })();
  </script>
</body>
</html>
