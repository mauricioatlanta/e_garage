<!doctype html>
<meta charset="utf-8">
<title>{{ kind|title }} creado</title>
<script>
  (function() {
    console.log("🚀 Iniciando close_and_notify.html");
    console.log("🔍 window.opener:", window.opener);
    console.log("🔍 window.opener.closed:", window.opener ? window.opener.closed : "N/A");

    // Datos server-side del nuevo elemento
    const payload = {
      source: "eg-create",
      kind: "{{ kind }}",
      id: "{{ id }}",
      text: "{{ text }}"
    };

    console.log("📊 Datos a enviar:", payload);

    // Función para intentar cerrar la ventana
    function intentarCerrar() {
      console.log("⏰ Intentando cerrar ventana...");
      try {
        window.close();
        console.log("✅ window.close() ejecutado");
      } catch (e) {
        console.error("❌ Error al cerrar ventana:", e);
      }
    }

    // Función para enviar postMessage
    function enviarPostMessage() {
      try {
        if (window.opener && !window.opener.closed) {
          console.log("✅ window.opener existe y no está cerrado");

          // Enviar postMessage al padre
          window.opener.postMessage(payload, "*");
          console.log("📤 postMessage enviado exitosamente:", payload);

          // Intentar cerrar después de un pequeño delay
          setTimeout(intentarCerrar, 200);

        } else {
          console.log("❌ window.opener no existe o está cerrado");
          console.log("🔍 window.opener:", window.opener);
          console.log("🔍 window.opener.closed:", window.opener ? window.opener.closed : "N/A");

          // Mostrar mensaje de error
          document.body.innerHTML = "<div style='padding:20px;text-align:center;background:#0b1020;color:#e6f0ff;font-family:system-ui'><h3>❌ Error de comunicación</h3><p>No se pudo comunicar con la ventana principal.</p><p>Puedes cerrar esta ventana manualmente.</p></div>";
        }
      } catch (e) {
        console.error("💥 Error enviando postMessage:", e);
        document.body.innerHTML = "<div style='padding:20px;text-align:center;background:#0b1020;color:#e6f0ff;font-family:system-ui'><h3>💥 Error</h3><p>Error al comunicar con la ventana principal.</p><p>Puedes cerrar esta ventana manualmente.</p></div>";
      }
    }

    // Ejecutar inmediatamente
    enviarPostMessage();

    // También intentar cerrar después de 3 segundos como fallback
    setTimeout(function() {
      console.log("⏰ Fallback: intentando cerrar después de 3 segundos");
      intentarCerrar();
    }, 3000);

  })();
</script>
<body style="background:#0b1020;color:#e6f0ff;font:14px/1.4 system-ui;padding:16px;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center;padding:40px;border:1px solid #22d3ee;border-radius:10px;background:rgba(34,211,238,0.1)">
    <div style="color:#22c55e;font-size:18px;margin-bottom:20px">✅ {{ text }} creado exitosamente</div>
    <p>Esta ventana se cerrará automáticamente...</p>
    <button onclick="window.close()" style="margin-top:20px;padding:10px 20px;background:#1e293b;border:1px solid #334155;color:#e6f0ff;border-radius:8px;cursor:pointer;font-size:14px">
      Cerrar ventana
    </button>
  </div>
</body>
