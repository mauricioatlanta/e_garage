<!DOCTYPE html>
<html>
<head>
    <title>Test API Modelos</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Test API de Modelos</h1>
    <div>
        <label>Marca ID:</label>
        <input type="number" id="marca_id" value="1" />
        <button onclick="testApi()">Probar API</button>
    </div>
    <div id="resultado"></div>

    <script>
        function testApi() {
            const marcaId = document.getElementById('marca_id').value;
            const url = `/vehiculos-core/api/modelos/?marca_id=${marcaId}`;
            
            console.log('Testing URL:', url);
            
            fetch(url)
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('Data received:', data);
                    document.getElementById('resultado').innerHTML = 
                        '<h3>Resultado:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('resultado').innerHTML = 
                        '<h3>Error:</h3><pre>' + error.message + '</pre>';
                });
        }
        
        // Test automático al cargar
        window.onload = function() {
            testApi();
        };
    </script>
</body>
</html>
