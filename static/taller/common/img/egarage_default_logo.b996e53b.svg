<!-- Logo por defecto SVG para eGarage -->
<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="200" height="80" fill="#0d6efd" rx="8"/>

  <!-- Texto eGarage -->
  <text x="20" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    eGarage
  </text>

  <!-- Icono de herramienta -->
  <g transform="translate(150, 20)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="white" stroke-width="2"/>
    <path d="m12 16 4 4 8-8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtítulo -->
  <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#e8f4fd">
    Workshop Management System
  </text>
</svg>
