{% extends "base.html" %}
{% load i18n static %}

{% block content %}
{% csrf_token %}
<div class="min-h-screen bg-black relative overflow-hidden">
  <!-- Fondo dinámico espacial -->
  <div id="spaceBackground" class="absolute inset-0">
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>
  </div>
  
  <!-- Partículas flotantes -->
  <div id="particles" class="absolute inset-0 pointer-events-none"></div>
  
  <div class="relative z-10 p-4">
    <!-- Header Section with Glowing Effect -->
    <div class="relative mb-6">
      <div class="absolute -inset-1 rounded-xl bg-gradient-to-r from-cyan-500 via-fuchsia-500 to-lime-400 opacity-20 blur-xl animate-pulse"></div>
      <div class="relative rounded-xl border border-cyan-400/30 bg-black/40 backdrop-blur-sm p-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-lg shadow-lg ring-2 ring-cyan-400/40">🔧</div>
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-lime-300 to-emerald-400">
                {% trans "Crear Nuevo Servicio" %}
              </h1>
              <p class="text-gray-400 text-xs">{% trans "Agregar servicio al sistema" %}</p>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 text-xs text-cyan-300">
              <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
              <span>{% trans "Sistema activo" %}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="max-w-2xl mx-auto">
      <div class="relative">
        <div class="absolute -inset-1 rounded-xl bg-gradient-to-r from-emerald-500/20 via-lime-500/20 to-green-500/20 blur-xl"></div>
        <div class="relative rounded-xl border border-emerald-400/30 bg-black/40 backdrop-blur-sm p-6">
          <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <!-- Nombre del Servicio -->
            <div class="space-y-2">
              <label class="block text-sm font-semibold text-emerald-300 uppercase tracking-wider">
                {% trans "Nombre del Servicio" %}
              </label>
              <div class="relative">
                <input type="text" name="nombre" id="id_nombre" required
                       class="w-full px-4 py-3 bg-black/40 border border-emerald-400/30 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-400/50 focus:border-emerald-400/50 transition-all duration-200"
                       placeholder="{% trans 'Ej: Cambio de Aceite' %}">
                <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-emerald-400">🔧</div>
              </div>
            </div>
            
            <!-- Categoría -->
            <div class="space-y-2">
              <label class="block text-sm font-semibold text-cyan-300 uppercase tracking-wider">
                {% trans "Categoría" %}
              </label>
              <div class="relative">
                <select name="categoria" id="id_categoria" required
                        class="w-full px-4 py-3 bg-black/40 border border-cyan-400/30 rounded-lg text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-400/50 focus:border-cyan-400/50 transition-all duration-200">
                  <option value="">{% trans "Seleccionar categoría..." %}</option>
                  {% for categoria in categorias %}
                  <option value="{{ categoria.id }}">{{ categoria.get_label }}</option>
                  {% endfor %}
                </select>
                <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-cyan-400">📂</div>
              </div>
            </div>
            
            <!-- Subcategoría -->
            <div class="space-y-2">
              <label class="block text-sm font-semibold text-lime-300 uppercase tracking-wider">
                {% trans "Subcategoría" %}
              </label>
              <div class="relative">
                <select name="subcategoria" id="id_subcategoria" required
                        class="w-full px-4 py-3 bg-black/40 border border-lime-400/30 rounded-lg text-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400/50 focus:border-lime-400/50 transition-all duration-200">
                  <option value="">{% trans "Seleccionar subcategoría..." %}</option>
                  {% for subcategoria in subcategorias %}
                  <option value="{{ subcategoria.id }}">{{ subcategoria.get_label }}</option>
                  {% endfor %}
                </select>
                <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-lime-400">📁</div>
              </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex justify-end space-x-4 pt-6">
              <a href="{% url 'taller:servicios:servicios_menu' %}" 
                 class="relative inline-flex items-center space-x-2 px-6 py-3 rounded-lg bg-gradient-to-r from-gray-600 via-gray-500 to-gray-600 hover:from-gray-500 hover:via-gray-400 hover:to-gray-500 text-white font-bold text-sm shadow-lg shadow-gray-800/40 transition-all duration-300 border border-gray-400/40">
                <span>❌</span>
                <span>{% trans "Cancelar" %}</span>
              </a>
              
              <button type="submit" 
                      class="relative inline-flex items-center space-x-2 px-6 py-3 rounded-lg bg-gradient-to-r from-emerald-600 via-lime-600 to-green-600 hover:from-emerald-500 hover:via-lime-500 hover:to-green-500 text-white font-bold text-sm shadow-lg shadow-emerald-800/40 transition-all duration-300 border border-emerald-400/40">
                <span>💾</span>
                <span>{% trans "Guardar Servicio" %}</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Estilos CSS -->
<style>
@keyframes move-stars {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-1000px); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

@keyframes move-clouds {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100vw); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                    radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
  background-repeat: repeat;
  background-size: 200px 100px;
  animation: move-stars 50s linear infinite;
}

.twinkling {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(1px 1px at 25px 5px, white, transparent),
                    radial-gradient(1px 1px at 50px 25px, white, transparent),
                    radial-gradient(1px 1px at 125px 20px, white, transparent),
                    radial-gradient(1px 1px at 150px 75px, white, transparent);
  background-repeat: repeat;
  background-size: 200px 100px;
  animation: twinkle 3s ease-in-out infinite;
}

.clouds {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(20px 20px at 50px 50px, rgba(255,255,255,0.1), transparent),
                    radial-gradient(15px 15px at 150px 30px, rgba(255,255,255,0.1), transparent),
                    radial-gradient(25px 25px at 250px 70px, rgba(255,255,255,0.1), transparent);
  background-repeat: repeat;
  background-size: 300px 100px;
  animation: move-clouds 30s linear infinite;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #00ffff;
  border-radius: 50%;
  animation: float 3s ease-in-out infinite;
}
</style>

<!-- JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // =================== FUNCIONES DE PARTÍCULAS Y EFECTOS ===================
  function createParticles() {
    const particles = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 3 + 's';
      particles.appendChild(particle);
    }
  }

  // =================== INICIALIZACIÓN ===================
  createParticles();
});
</script>

{% endblock %}
