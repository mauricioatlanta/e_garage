{% if url %}<a href="{{ url }}" style="display:block;text-decoration:none;color:inherit;">{% endif %}
<div class="bg-[#111827] border border-[#1e293b] rounded-xl p-6{% if url %} hover:border-blue-500 cursor-pointer{% endif %}">
  <p class="text-sm text-gray-400">{{ title }}</p>
  <h3 class="text-2xl font-bold mt-2">
    {% if format == "percent" %}
      {% if has_value %}{{ value|floatformat:1 }}%{% else %}—{% endif %}
    {% else %}
      {{ value }}
    {% endif %}
  </h3>
</div>
{% if url %}</a>{% endif %}
