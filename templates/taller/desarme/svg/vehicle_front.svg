<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <style>
      .zone { fill: #9ca3af; stroke: #374151; stroke-width: 1; cursor: pointer; transition: fill 0.2s, filter 0.2s; }
      .zone:hover { fill: #6b7280; filter: drop-shadow(0 0 4px rgba(0,212,255,0.5)); }
      .zone.estado-disponible { fill: #22c55e; }
      .zone.estado-dañado { fill: #ef4444; }
      .zone.estado-scrap { fill: #1f2937; }
      .zone.estado-vendido { fill: #3b82f6; }
      .zone.estado-reservada { fill: #eab308; }
    </style>
  </defs>
  <rect x="50" y="60" width="300" height="120" rx="12" fill="#1f2937" stroke="#374151"/>
  <rect x="110" y="70" width="180" height="50" class="zone" id="hood" data-zone="hood" data-piece-name="Capot" data-view="frontal" data-side="" data-category="carroceria"/>
  <rect x="70" y="130" width="80" height="40" class="zone" id="front_bumper_left" data-zone="front_bumper_left" data-piece-name="Parachoques delantero izq" data-view="frontal" data-side="izq" data-category="carroceria"/>
  <rect x="250" y="130" width="80" height="40" class="zone" id="front_bumper_right" data-zone="front_bumper_right" data-piece-name="Parachoques delantero der" data-view="frontal" data-side="der" data-category="carroceria"/>
  <rect x="95" y="85" width="45" height="25" class="zone" id="front_left_headlight" data-zone="front_left_headlight" data-piece-name="Foco izquierdo" data-view="frontal" data-side="izq" data-category="electricidad"/>
  <rect x="260" y="85" width="45" height="25" class="zone" id="front_right_headlight" data-zone="front_right_headlight" data-piece-name="Foco derecho" data-view="frontal" data-side="der" data-category="electricidad"/>
  <rect x="155" y="88" width="90" height="20" class="zone" id="grille" data-zone="grille" data-piece-name="Parrilla" data-view="frontal" data-side="" data-category="carroceria"/>
  <rect x="175" y="128" width="50" height="35" class="zone" id="radiator" data-zone="radiator" data-piece-name="Radiador" data-view="frontal" data-side="" data-category="motor"/>
  <rect x="150" y="130" width="100" height="35" class="zone" id="front_bumper" data-zone="front_bumper" data-piece-name="Parachoques delantero" data-view="frontal" data-side="" data-category="carroceria"/>
  <circle cx="120" cy="150" r="18" fill="#4b5563"/>
  <circle cx="280" cy="150" r="18" fill="#4b5563"/>
</svg>
