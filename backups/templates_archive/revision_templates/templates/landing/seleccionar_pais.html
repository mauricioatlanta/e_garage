<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu país | eGarage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a23 0%, #1a1a2e 100%);
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .selector-container {
            background: rgba(10,40,80,0.92);
            border-radius: 24px;
            box-shadow: 0 0 40px #00ffe744;
            padding: 3.5rem 2.5rem 2.5rem 2.5rem;
            text-align: center;
            max-width: 400px;
        }
        .selector-title {
            font-size: 2.2rem;
            color: #00ffe7;
            margin-bottom: 2.2rem;
            font-weight: bold;
        }
        .country-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #00ffe7 0%, #ff00cc 100%);
            color: #181848;
            border: none;
            border-radius: 30px;
            padding: 1.2rem 0;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffe744;
            transition: background 0.2s, transform 0.2s;
        }
        .country-btn:last-child { margin-bottom: 0; }
        .country-btn:hover {
            background: linear-gradient(90deg, #ff00cc 0%, #00ffe7 100%);
            transform: scale(1.05);
            color: #fff;
        }
        .logo {
            height: 90px;
            margin-bottom: 2.2rem;
            filter: drop-shadow(0 0 18px #00ffe7cc);
        }
    </style>
</head>
<body>
    <div class="selector-container">
        <img src="/static/img/logo.png" alt="eGarage Logo" class="logo">
        <div class="selector-title">Selecciona tu país</div>
    {% load country_url %}
    <a href="{% country_url 'account_login' country_code='cl' %}" class="country-btn">Chile</a>
    <a href="{% country_url 'account_login' country_code='usa' %}" class="country-btn">USA</a>
    </div>
<script>
    // CSRF helper
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Mejorar cambio de idioma
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('a[href*="?lang="]').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var lang = this.href.split('lang=')[1];
                var csrftoken = getCookie('csrftoken');
                fetch('/cambiar-idioma/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ idioma: lang })
                })
                .then(function(resp) {
                    if (resp.ok) {
                        window.location.search = '?lang=' + lang;
                    } else {
                        alert('Error cambiando idioma');
                    }
                })
                .catch(function() {
                    alert('Error de red al cambiar idioma');
                });
            });
        });
    });
</script>
</body>
</html>
