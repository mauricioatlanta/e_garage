{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Garage - Automate your shop</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.output.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
</head>
<body class="bg-black text-white overflow-hidden m-0 p-0">

  <!-- 🎬 INTRO VIDEO -->
  <video id="intro-video" autoplay muted playsinline class="fixed top-0 left-0 w-full h-full object-cover z-50">
    <source src="{% static 'egarage_intro/egarage_intro_6s.mp4' %}" type="video/mp4" />
  </video>

  <!-- 🌌 PARTICLE BACKGROUND -->
  <video id="bg-particles" loop muted autoplay playsinline class="hidden fixed top-0 left-0 w-full h-full object-cover z-0">
    <source src="{% static 'egarage_intro/particles_background.webm' %}" type="video/webm" />
  </video>


  <!-- 🚗 LOGO + TEXT -->
  <div class="fixed inset-0 z-60 flex flex-col justify-center items-center text-center" style="z-index:60;">
    <img src="{% static 'img/TallerPro_logo.png' %}" alt="E-Garage Logo" class="animate-pulse drop-shadow-2xl mb-4 w-20 h-20 md:w-24 md:h-24 object-contain brightness-125 saturate-150" style="border: 4px solid #f500ff; border-radius: 50%; box-shadow: 0 0 32px 8px #f500ff;" />

    <p class="text-2xl md:text-3xl font-bold tracking-wide mb-6 font-[Orbitron] text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-300">
      {% trans "Welcome to eGarage" %}
    </p>
    <div class="flex flex-col gap-4">
      <a href="{% url 'account_login' %}" class="bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-300 text-gray-900 font-bold py-3 px-10 rounded-xl shadow-xl text-xl tracking-wide border-2 border-fuchsia-400 hover:scale-105 transition-all duration-300 animate-bounce">
        {% trans "Sign in" %}
      </a>
    </div>
  </div>


</body>
</html>
