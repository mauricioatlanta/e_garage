{% extends 'admin/base_site.html' %}{% block content %}<h1>Ventana de Medicion</h1><p>SCL {{ now_scl }} Total {{ total }}</p><form method='get'><select name='period'><option value='day' {% if period == 'day' %}selected{% endif %}>DIA</option><option value='week' {% if period == 'week' %}selected{% endif %}>SEMANA</option><option value='month' {% if period == 'month' %}selected{% endif %}>MES</option><option value='year' {% if period == 'year' %}selected{% endif %}>AÑO</option></select><select name='days'><option value='7' {% if days == 7 %}selected{% endif %}>7</option><option value='30' {% if days == 30 %}selected{% endif %}>30</option><option value='90' {% if days == 90 %}selected{% endif %}>90</option><option value='800' {% if days == 800 %}selected{% endif %}>800</option></select><button>Filtrar</button></form><p><a href='?period=day&days=7'>DAY</a> | <a href='?period=week&days=30'>WEEK</a> | <a href='?period=month&days=90'>MONTH</a> | <a href='?period=year&days=800'>YEAR</a></p><ul>{% for s in stats %}<li>{{ s.bucket }} = {{ s.total }}</li>{% endfor %}</ul>{% endblock %}
