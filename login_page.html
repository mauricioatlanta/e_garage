// Animación de entrada
document.addEventListener('DOMContentLoaded', function() {
    const card = document.querySelector('.glass-card');
    card.style.opacity = '0';
    card.style.transform = 'translateY(30px)';

    setTimeout(() => {
        card.style.transition = 'all 0.8s ease-out';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
    }, 100);
    
    // Asegurar que el fix de iOS se aplica a los campos de contraseña
    const passwordInputs = document.querySelectorAll('input[type="password"]');
    passwordInputs.forEach(function(input) {
        // Agregar atributos adicionales si no están presentes
        if (!input.hasAttribute('autocapitalize')) {
            input.setAttribute('autocapitalize', 'none');
        }
        if (!input.hasAttribute('autocorrect')) {
            input.setAttribute('autocorrect', 'off');
        }
        if (!input.hasAttribute('spellcheck')) {
            input.setAttribute('spellcheck', 'false');
        }
    });
});
</script>
