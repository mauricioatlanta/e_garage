# Override para gunicorn.service (modo debug: traceback en journald)
# Copiar al servidor:
#   sudo mkdir -p /etc/systemd/system/gunicorn.service.d
#   sudo cp scripts/gunicorn.service.d/override-execstart.conf /etc/systemd/system/gunicorn.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart gunicorn.service
#
# Ver traceback y logs:
#   sudo journalctl -u gunicorn.service -n 200 --no-pager
#
# Mitigación worker timeout: timeout 60s evita workers colgados eternamente; 3 workers
# para no bloquear todo. Para producción estable subir de nuevo a --timeout 300 --workers 4.
#
# Para volver a logs a archivo, usar --error-logfile /var/log/gunicorn/error.log
# y --access-logfile /var/log/gunicorn/access.log en lugar de -

[Service]
ExecStart=
ExecStart=/srv/egarage/venv/bin/gunicorn \
  --umask 007 \
  --capture-output \
  --log-level debug \
  --access-logfile - \
  --error-logfile - \
  --workers 3 \
  --timeout 60 \
  --max-requests 800 \
  --max-requests-jitter 200 \
  --bind unix:/run/gunicorn/gunicorn.sock \
  gestion_taller.wsgi:application
