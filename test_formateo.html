<!DOCTYPE html>
<html>
<head>
    <title>Test Formateo Pesos Chilenos</title>
</head>
<body>
    <h1>Test de Formateo de Pesos Chilenos</h1>
    
    <div id="test-results">
        <p>15000: <span id="test1"></span></p>
        <p>12000: <span id="test2"></span></p>
        <p>156789: <span id="test3"></span></p>
        <p>2500: <span id="test4"></span></p>
    </div>

    <script>
    function formatearPesosChilenos(valor) {
      if (!valor || isNaN(valor)) return '$0';
      const numero = Math.round(parseFloat(valor));
      // Formatear con punto como separador de miles (formato chileno)
      return '$' + numero.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Test de la función
    document.getElementById('test1').textContent = formatearPesosChilenos(15000);
    document.getElementById('test2').textContent = formatearPesosChilenos(12000);
    document.getElementById('test3').textContent = formatearPesosChilenos(156789);
    document.getElementById('test4').textContent = formatearPesosChilenos(2500);
    </script>
</body>
</html>
