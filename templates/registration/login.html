{% extends "base.html" %}
{% load i18n static %}

{% block title %}Iniciar Sesión · eGarage{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
  <div style="width: 100%; max-width: 420px; background: #0f172a; border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="color: #ffffff; font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem 0;">eGarage</h2>
      <p style="color: #94a3b8; font-size: 0.875rem; margin: 0;">Plataforma de Control</p>
    </div>

    {% if form.errors %}
      <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.85rem; text-align: center;">
        Credenciales incorrectas. Verifica tu contraseña.
      </div>
    {% endif %}

    <form method="POST" action="https://www.egarage.cl/cl/es/accounts/login/" style="display: flex; flex-direction: column; gap: 1.2rem;">
      {% csrf_token %}
      <input type="hidden" name="next" value="/cl/es/workspace/" />

      <div>
        <label for="id_login" style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Usuario o Correo Corporativo</label>
        <input type="text" name="login" id="id_login" required value="contacto@atlantareciclajes.cl" style="width: 100%; padding: 0.8rem; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 1rem; box-sizing: border-box;">
      </div>

      <div>
        <label for="id_password" style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Contraseña</label>
        <input type="password" name="password" id="id_password" required placeholder="••••••••" style="width: 100%; padding: 0.8rem; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 1rem; box-sizing: border-box;">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
        <label style="color: #94a3b8; display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" name="remember" id="id_remember" checked style="accent-color: #00f0ff;">
          <span>Mantener sesión iniciada</span>
        </label>
      </div>

      <input type="submit" value="Ingresar al Sistema →" style="width: 100%; margin-top: 0.5rem; padding: 0.9rem; background: #00f0ff; color: #0b132b; font-weight: 800; font-size: 1.05rem; border: none; border-radius: 8px; cursor: pointer; text-align: center; display: block;">
    </form>
  </div>
</div>
{% endblock %}
