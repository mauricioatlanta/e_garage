# Configuración de ejemplo para Nginx - egarage.cl
# Ubicación típica: /etc/nginx/sites-enabled/egarage.cl
# 
# IMPORTANTE: Este es un archivo de referencia. 
# Ajusta las rutas y puertos según tu instalación real.

server {
    listen 80;
    listen [::]:80;
    server_name egarage.cl www.egarage.cl;

    # Redirigir HTTP a HTTPS ($host preserva el dominio de la petición)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name egarage.cl www.egarage.cl;

    # Certificados SSL (ajustar rutas según tu instalación)
    ssl_certificate /etc/letsencrypt/live/egarage.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/egarage.cl/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ============================================================================
    # TAMAÑO MÁXIMO DE SUBIDA DE ARCHIVOS
    # ============================================================================
    # ⚠️ IMPORTANTE: Este límite controla el tamaño máximo de archivos que se pueden subir
    # Si recibes el error "413 Request Entity Too Large", aumenta este valor
    # 
    # Valores recomendados:
    # - 20M: Para logos e imágenes pequeñas (recomendado)
    # - 50M: Para archivos más grandes (fotos de vehículos, documentos)
    # - 100M: Para archivos muy grandes (solo si es necesario)
    #
    # NOTA: También debes configurar límites en Django (settings/prod.py):
    # - FILE_UPLOAD_MAX_MEMORY_SIZE
    # - DATA_UPLOAD_MAX_MEMORY_SIZE
    # Y en PHP si usas PHP-FPM:
    # - upload_max_filesize
    # - post_max_size
    # ============================================================================
    client_max_body_size 50M;

    # ============================================================================
    # PROXY A GUNICORN (Django) - headers para que Django construya URLs correctas
    # ============================================================================
    # Requeridos para CSRF y HTTPS detrás de proxy: Host, X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-For
    # Opción A: TCP (puerto 8001)
    #   proxy_pass http://127.0.0.1:8001;
    # Opción B: Unix socket (si gunicorn usa unix:/run/gunicorn/gunicorn.sock)
    #   proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
    # Si usas socket y ves "gunicorn.sock failed (2: No such file)" durante reinicios,
    # es temporal (nginx pide mientras gunicorn arranca). Endurecer con timeouts abajo.

    # Fix HEAD /us/login/ 403: responder 200 a HEAD sin pasar por Django (evita middleware/CSRF)
    location = /us/login/ {
        if ($request_method = HEAD) { return 200; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8001;

        # evita cosas raras de reescritura
        proxy_redirect off;

        # Timeouts (reducir connect a 5s evita esperas largas si el socket no existe al reiniciar)
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # ============================================================================
    # SEGURIDAD: Bloquear acceso a archivos ocultos
    # ============================================================================
    # Bloquear acceso a .env, .git, etc. (excepto .well-known para Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ============================================================================
    # SERVICE WORKER Y MANIFEST - Sin cache para actualizaciones inmediatas
    # ============================================================================
    location = /static/service-worker.js {
        alias /srv/egarage/staticfiles/service-worker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /static/manifest.json {
        alias /srv/egarage/staticfiles/manifest.json;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # ============================================================================
    # ARCHIVOS ESTÁTICOS (servir directamente desde Nginx)
    # ============================================================================
    # Orden: hashed (regex) primero, /static/ sin ^~ como fallback (^~ bloquearía el regex).
    # 1) Archivos con hash en el nombre (ej. app.abc12def.css) => cache 1 año immutable
    location ~* ^/static/(.+\.[0-9a-f]{8,}\.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot))$ {
        alias /srv/egarage/staticfiles/$1;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 2) Resto de /static/ (SIN hash) => cache corto
    # IMPORTANTE: NO usar try_files con alias; $uri queda como /static/... y rompe la resolución.
    # Solo alias es suficiente: /static/css/foo.css → staticfiles/css/foo.css
    location /static/ {
        alias /srv/egarage/staticfiles/;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
    }

    # ============================================================================
    # ARCHIVOS MEDIA (ajustar ruta según tu instalación)
    # ============================================================================
    location /media/ {
        alias /srv/egarage/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # robots.txt - servir directo (200), después de /media/ y antes de location /
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n\nSitemap: https://egarage.cl/sitemap.xml\n";
    }

    # ============================================================================
    # LOGS
    # ============================================================================
    access_log /var/log/nginx/egarage_access.log;
    error_log /var/log/nginx/egarage_error.log;
}
