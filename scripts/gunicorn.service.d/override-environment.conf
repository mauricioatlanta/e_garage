# Variables de entorno para que Gunicorn use la misma config que migrate_prod.sh.
# Sin esto, wsgi.py usa gestion_taller.settings y otra base de datos.
#
# Copiar al servidor (junto con override-execstart.conf):
#   sudo cp scripts/gunicorn.service.d/override-environment.conf /etc/systemd/system/gunicorn.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart gunicorn

[Service]
EnvironmentFile=/srv/egarage/.env.prod
Environment=DJANGO_SETTINGS_MODULE=gestion_taller.settings_prod
