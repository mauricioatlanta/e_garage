{% extends 'base.html' %}
{% load country_url %}
{% load static %}

{% block title %}Crear Nuevo Servicio{% endblock %}

{% block content %}
<div id="particles-js" class="fixed inset-0 z-0"></div>
<div class="min-h-screen w-full relative flex items-center justify-center bg-black py-12 px-2 overflow-hidden">
    <div class="w-full max-w-4xl mx-auto p-8 bg-gray-900/70 backdrop-blur-lg rounded-2xl shadow-2xl border-2 border-lime-400/30 relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 metallic-black-title">
                🚀 Crear Nuevo Servicio
            </h1>
            <p class="text-cyan-400 text-lg">Configure un servicio externo con tecnología avanzada</p>
        </div>

        <!-- Formulario -->
        <form method="post" class="space-y-8">
            {% csrf_token %}
            
            <!-- Grid de campos principales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Nombre del Servicio -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-tools mr-2"></i>Nombre del Servicio
                    </label>
                    <input type="text" name="nombre" required
                           class="w-full px-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all"
                           placeholder="Ej: Alineación y Balanceado">
                </div>

                <!-- Empresa Externa -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-building mr-2"></i>Compañía
                    </label>
                    <input type="text" name="empresa_externa" required
                           class="w-full px-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all"
                           placeholder="Ej: Alineadora Central">
                </div>

                <!-- Categoría -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-tags mr-2"></i>Categoría
                    </label>
                    <div class="relative">
                        <select name="categoria" required
                                class="w-full px-4 py-3 pr-10 bg-black border-2 border-cyan-400/20 rounded-xl text-white focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all appearance-none cursor-pointer">
                            <option value="" class="bg-black text-white">Seleccione una categoría</option>
                            {% for categoria in categorias %}
                                <option value="{{ categoria.id }}" class="bg-black text-white">
                                    {{ categoria.get_label }}
                                </option>
                            {% endfor %}
                        </select>
                        <!-- Indicador de dropdown -->
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                            <i class="fas fa-chevron-down text-cyan-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Tiempo Estimado -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-clock mr-2"></i>Tiempo Estimado
                    </label>
                    <input type="text" name="tiempo_estimado"
                           class="w-full px-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all"
                           placeholder="Ej: 2 horas">
                </div>
            </div>

            <!-- Precios -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Precio Taller -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-dollar-sign mr-2"></i>Precio Taller
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400 font-bold">$</span>
                        <input type="number" name="costo_taller" step="0.01" required
                               class="w-full pl-8 pr-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all"
                               placeholder="0.00">
                    </div>
                </div>

                <!-- Precio Cliente -->
                <div class="space-y-2">
                    <label class="block text-cyan-400 font-semibold text-lg">
                        <i class="fas fa-money-bill-wave mr-2"></i>Precio Cliente
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400 font-bold">$</span>
                        <input type="number" name="precio_cliente" step="0.01" required
                               class="w-full pl-8 pr-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all"
                               placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- Descripción -->
            <div class="space-y-2">
                <label class="block text-cyan-400 font-semibold text-lg">
                    <i class="fas fa-file-alt mr-2"></i>Descripción
                </label>
                <textarea name="descripcion" rows="4"
                          class="w-full px-4 py-3 bg-black border-2 border-cyan-400/20 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 outline-none transition-all resize-none"
                          placeholder="Descripción detallada del servicio..."></textarea>
            </div>

            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center pt-8">
                <button type="submit"
                        class="px-8 py-4 bg-gradient-to-r from-lime-400 via-cyan-400 to-fuchsia-500 text-gray-900 font-bold text-lg rounded-xl shadow-2xl hover:from-fuchsia-500 hover:to-lime-400 transition-all transform hover:scale-105 flex items-center justify-center gap-2">
                    <i class="fas fa-rocket"></i>
                    <span>Crear Servicio</span>
                </button>
                
                <a href="{% country_url 'servicios:otros_servicios_menu' %}"
                   class="px-8 py-4 bg-black border-2 border-cyan-400/20 text-cyan-400 font-bold text-lg rounded-xl hover:border-cyan-400 hover:bg-gray-900 transition-all transform hover:scale-105 flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i>
                    <span>Cancelar</span>
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Efectos visuales -->
<style>
.metallic-black-title {
    background: linear-gradient(45deg, #00ffff, #00ff00, #ff00ff, #00ffff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 3s ease-in-out infinite;
}

@keyframes gradient-shift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Efectos de hover para inputs */
input:focus, select:focus, textarea:focus {
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    transform: translateY(-2px);
}

/* Estilos específicos para select */
select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: none;
}

select:focus {
    background-color: #000000 !important;
}

select option {
    background-color: #000000 !important;
    color: #ffffff !important;
    padding: 8px 12px;
}

select option:hover {
    background-color: #111111 !important;
}

/* Animación de partículas */
#particles-js {
    background: radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
}

/* Efectos de botones */
button:hover, a:hover {
    box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
}

/* Animación de entrada */
@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.space-y-8 > * {
    animation: slideInUp 0.6s ease-out forwards;
}

.space-y-8 > *:nth-child(1) { animation-delay: 0.1s; }
.space-y-8 > *:nth-child(2) { animation-delay: 0.2s; }
.space-y-8 > *:nth-child(3) { animation-delay: 0.3s; }
.space-y-8 > *:nth-child(4) { animation-delay: 0.4s; }
</style>

<!-- Script para efectos interactivos -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Efecto de typing en inputs
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    // Validación en tiempo real
    const precioTaller = document.querySelector('input[name="costo_taller"]');
    const precioCliente = document.querySelector('input[name="precio_cliente"]');
    
    function updateMargin() {
        if (precioTaller.value && precioCliente.value) {
            const costo = parseFloat(precioTaller.value);
            const precio = parseFloat(precioCliente.value);
            const margen = precio - costo;
            
            // Crear o actualizar indicador de margen
            let marginIndicator = document.getElementById('margin-indicator');
            if (!marginIndicator) {
                marginIndicator = document.createElement('div');
                marginIndicator.id = 'margin-indicator';
                marginIndicator.className = 'text-center mt-2 p-2 rounded-lg bg-gray-800/50 border border-cyan-400/30';
                precioCliente.parentElement.appendChild(marginIndicator);
            }
            
            marginIndicator.innerHTML = `
                <span class="text-cyan-400 font-semibold">
                    Margen: $${margen.toFixed(2)} (${((margen/precio)*100).toFixed(1)}%)
                </span>
            `;
        }
    }
    
    if (precioTaller && precioCliente) {
        precioTaller.addEventListener('input', updateMargin);
        precioCliente.addEventListener('input', updateMargin);
    }
});
</script>
{% endblock %}
