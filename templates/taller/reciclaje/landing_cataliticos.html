<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalíticos | Atlanta Reciclajes</title>
    <meta name="description" content="Compra y reciclaje de convertidores catalíticos al mejor precio del mercado. Consulta el precio de tu catalítico por código. Atlanta Reciclajes.">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
      body {
        min-height: 100vh;
        background: #0f2027;
        background: linear-gradient(120deg, #0f2027 0%, #2c5364 100%);
      }
      .glass {
        background: rgba(20, 30, 60, 0.15) !important;
        border-radius: 1.25rem;
        box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.15);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .neon { color: #00fff7; text-shadow: 0 0 12px #00fff7a0; }
      .futur-btn {
        background: linear-gradient(90deg, #00fff7 0%, #0ff 100%);
        color: #0f2027 !important;
        font-weight: bold;
      }
      .btn-secondary {
        background: rgba(255,255,255,0.08);
        color: #e5e7eb !important;
        font-weight: bold;
        border: 1px solid rgba(255,255,255,0.2);
      }
    </style>
</head>
<body class="min-h-screen text-white font-sans">
  <div class="max-w-3xl mx-auto py-16 px-4 text-center">
    <a href="/" class="text-cyan-300 text-sm">&larr; Volver al inicio</a>

    <h1 class="text-4xl md:text-5xl font-bold neon mt-6 mb-6">🚗 Catalíticos</h1>

    <div class="glass p-8 mb-8">
      <p class="text-xl text-cyan-200 mb-8">
        Compra y reciclaje de convertidores catalíticos al mejor precio del mercado.
      </p>

      <div class="flex flex-col md:flex-row gap-4 justify-center">
        <a href="{% url 'reciclaje:consulta_catalitico' %}" class="futur-btn rounded-lg px-8 py-4 text-lg">
          🔍 Consultar precio de mi catalítico
        </a>
        {% if user.is_authenticated %}
        <a href="{{ dashboard_url }}" class="btn-secondary rounded-lg px-8 py-4 text-lg">
          📊 Panel de Reciclaje
        </a>
        {% else %}
        <a href="/accounts/login/" class="btn-secondary rounded-lg px-8 py-4 text-lg">
          🔐 Iniciar sesión
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
