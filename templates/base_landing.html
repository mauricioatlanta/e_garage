{% load static %}
<!DOCTYPE html>
<html lang="{% if LANGUAGE_CODE == 'es' %}es{% else %}en{% endif %}" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Garage - Gestión de Talleres{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'orbitron': ['Orbitron', 'monospace'],
                        'rajdhani': ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 20s linear infinite',
                        'fade-in': 'fadeIn 0.8s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    {% block extra_head %}{% endblock %}
</head>

<body class="h-full {% block body_class %}{% endblock %}">
    <!-- Header simple para páginas de bienvenida -->
    <header class="w-full bg-black/60 backdrop-blur border-b border-blue-700/40 shadow-lg py-4 px-6 flex items-center justify-between z-50 relative">
        <div class="flex items-center gap-4">
            <img src="{% static 'img/TallerPro_logo.png' %}" alt="E-Garage Logo" class="h-12 w-auto rounded-lg shadow-lg border-2 border-blue-400/60">
            <h1 class="text-2xl font-bold text-blue-300 tracking-widest">E-Garage</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="/accounts/login/" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2 rounded-xl transition shadow">
                Iniciar Sesión
            </a>
            <a href="/registro/" class="bg-green-600 hover:bg-green-500 text-white font-bold px-6 py-2 rounded-xl transition shadow">
                Registrarse
            </a>
        </div>
    </header>
    
    {% block fondo_extra %}{% endblock %}
    
    {% block content %}{% endblock %}
    
    <!-- Footer simple para páginas de bienvenida -->
    <footer class="bg-black/80 border-t border-blue-700/40 py-4 mt-auto">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <div class="text-blue-300 text-sm">
                <span class="font-bold">eGarage</span>
                <span class="mx-2">•</span>
                <span>© 2024</span>
                <span class="mx-2">•</span>
                <a href="#" class="hover:text-blue-400 transition">Legal</a>
            </div>
        </div>
    </footer>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
