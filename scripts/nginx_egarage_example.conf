# Configuración de ejemplo para Nginx - egarage.cl
# Ubicación típica: /etc/nginx/sites-enabled/egarage o sites-available/egarage
#
# En /etc/nginx/nginx.conf (dentro de http {}):
#   - Micro-cache: include o contenido de scripts/nginx/egarage_cache_http.snippet.conf
#   - Rate limit:   include o contenido de scripts/nginx/egarage_ratelimit_http.snippet.conf
# Ver docs/NGINX_MICRO_CACHE_EGARAGE.md
#
# Ajusta rutas, socket (unix) o puerto (127.0.0.1:8001) según tu instalación.

server {
    listen 80;
    listen [::]:80;
    server_name egarage.cl www.egarage.cl;

    # Redirigir HTTP a HTTPS ($host preserva el dominio de la petición)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name egarage.cl www.egarage.cl;

    # Certificados SSL (ajustar rutas según tu instalación)
    ssl_certificate /etc/letsencrypt/live/egarage.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/egarage.cl/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ============================================================================
    # TAMAÑO MÁXIMO DE SUBIDA DE ARCHIVOS
    # ============================================================================
    # ⚠️ IMPORTANTE: Este límite controla el tamaño máximo de archivos que se pueden subir
    # Si recibes el error "413 Request Entity Too Large", aumenta este valor
    # 
    # Valores recomendados:
    # - 20M: Para logos e imágenes pequeñas (recomendado)
    # - 50M: Para archivos más grandes (fotos de vehículos, documentos)
    # - 100M: Para archivos muy grandes (solo si es necesario)
    #
    # NOTA: También debes configurar límites en Django (settings/prod.py):
    # - FILE_UPLOAD_MAX_MEMORY_SIZE
    # - DATA_UPLOAD_MAX_MEMORY_SIZE
    # Y en PHP si usas PHP-FPM:
    # - upload_max_filesize
    # - post_max_size
    # ============================================================================
    client_max_body_size 50M;

    # ============================================================================
    # BLOQUEAR SCANNERS COMUNES (444 = cierra conexión sin respuesta)
    # ============================================================================
    # Requiere en nginx.conf (dentro de http {}): limit_req_zone login_zone y general_zone
    # Ver scripts/nginx/egarage_ratelimit_http.snippet.conf
    location = /.env { return 444; }
    location = /.env.prod { return 444; }
    location = /.git/config { return 444; }
    location = /.aws/credentials { return 444; }
    location = /wp-login.php { return 444; }
    location = /wp-config.php { return 444; }
    location = /xmlrpc.php { return 444; }
    location = /phpinfo.php { return 444; }
    location = /test.php { return 444; }
    location = /php.php { return 444; }
    location ~* ^/(wp-admin|vendor/phpunit|cgi-bin|webui)(/|$) { return 444; }
    location ~* \.(php|asp|aspx|jsp)$ { return 444; }

    # Bloquear archivos ocultos excepto .well-known (Let's Encrypt)
    location ~ /\.(?!well-known).* { return 444; }

    # ============================================================================
    # RATE LIMIT LOGIN (5 req/min por IP)
    # ============================================================================
    location /accounts/login/ {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Fix HEAD /us/login/ 403 (evita middleware/CSRF en HEAD)
    location = /us/login/ {
        limit_req zone=login_zone burst=10 nodelay;
        if ($request_method = HEAD) { return 200; }
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ============================================================================
    # MICRO CACHE LANDING POR PAÍS (cl, us, ar, mx, br; añade más códigos si aplica)
    # ============================================================================
    # Requiere en nginx.conf: proxy_cache_path keys_zone=egarage_cache (egarage_cache_http.snippet.conf)
    location ~ ^/(cl|us|ar|mx|br)/?$ {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache egarage_cache;
        proxy_cache_valid 200 5s;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_redirect off;
    }

    # ============================================================================
    # HOMEPAGE GLOBAL
    # ============================================================================
    location = / {
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache egarage_cache;
        proxy_cache_valid 200 5s;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_redirect off;
    }

    # ============================================================================
    # STATIC FILES
    # ============================================================================
    location /static/ {
        alias /srv/egarage/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================================================
    # MEDIA (uploads)
    # ============================================================================
    location /media/ {
        alias /srv/egarage/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n\nSitemap: https://egarage.cl/sitemap.xml\n";
    }

    # ============================================================================
    # TODO LO DEMÁS → DJANGO (centro de operaciones, dashboard, API, etc.)
    # ============================================================================
    location / {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # ============================================================================
    # LOGS
    # ============================================================================
    access_log /var/log/nginx/egarage_access.log;
    error_log /var/log/nginx/egarage_error.log;
}
