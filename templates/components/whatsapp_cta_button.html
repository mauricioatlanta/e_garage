{% if whatsapp_cta and whatsapp_cta.url %}
<a
  href="{{ whatsapp_cta.url }}"
  class="eg-whatsapp-cta{% if cta_variant == 'floating' %} eg-whatsapp-cta-floating{% endif %}"
  target="_blank"
  rel="noopener noreferrer"
  data-event="cta_whatsapp_click"
  data-public-whatsapp-cta="{{ cta_position|default:'hero' }}"
  data-country="{{ whatsapp_cta.country_key }}"
  data-vertical="{{ whatsapp_cta.vertical_key }}"
  aria-label="{{ whatsapp_cta.button_label }}"
>
  <svg class="eg-whatsapp-cta-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <path fill="currentColor" d="M16.04 4C9.42 4 4.04 9.33 4.04 15.88c0 2.1.56 4.15 1.61 5.95L4 28l6.35-1.64a12.12 12.12 0 0 0 5.69 1.43C22.66 27.79 28 22.45 28 15.9 28 9.34 22.66 4 16.04 4Zm0 21.78c-1.84 0-3.64-.49-5.22-1.43l-.37-.22-3.77.98 1-3.64-.24-.38a9.86 9.86 0 0 1-1.5-5.21c0-5.45 4.53-9.88 10.1-9.88 5.56 0 10.08 4.43 10.08 9.9 0 5.45-4.52 9.88-10.08 9.88Zm5.53-7.4c-.3-.15-1.8-.88-2.08-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.96 1.18-.18.2-.35.22-.65.07-.3-.15-1.27-.46-2.42-1.48-.9-.79-1.5-1.77-1.68-2.07-.17-.3-.02-.46.13-.6.14-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.68-1.62-.93-2.22-.25-.58-.5-.5-.68-.51h-.58c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.49 0 1.47 1.08 2.9 1.23 3.1.15.2 2.13 3.22 5.16 4.52.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.8-.73 2.05-1.43.25-.7.25-1.3.18-1.43-.08-.13-.28-.2-.58-.35Z"/>
  </svg>
  <span>
    <strong>{{ whatsapp_cta.button_label }}</strong>
    {% if whatsapp_cta.secondary_label and cta_variant != 'compact' %}
      <small>{{ whatsapp_cta.secondary_label }}</small>
    {% endif %}
  </span>
</a>
{% endif %}
