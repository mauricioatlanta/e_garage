<div class="qa-control-bar" role="status">
  <div class="qa-control-label">
    <strong>SUPERADMIN QA</strong>
    {% if qa_control_empresa %}
      <span>{{ qa_control_empresa.pais }} | {{ qa_control_empresa.config.get_rubro_principal_display }}</span>
      <span>{{ qa_control_empresa.nombre_taller }}</span>
    {% else %}
      <span>Seleccionar país y rubro</span>
    {% endif %}
  </div>
  <div class="qa-control-actions">
    <a href="{% url 'qa_control:control' %}">Cambiar</a>
    {% if qa_control_empresa %}
      <form method="post" action="{% url 'qa_control:exit' %}" style="display:inline;">
        {% csrf_token %}<button type="submit" style="color:#fde68a;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;">Salir</button>
      </form>
    {% endif %}
  </div>
</div>
<style>
  .qa-control-bar { position: relative; z-index: 1000; display: flex; gap: .75rem; align-items: center; justify-content: space-between; padding: .45rem .9rem; background: #111827; color: #f8fafc; border-bottom: 2px solid #f59e0b; font: 600 12px/1.3 system-ui, sans-serif; }
  .qa-control-label, .qa-control-actions { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
  .qa-control-label strong { color: #fbbf24; letter-spacing: .08em; }
  .qa-control-label span { color: #cbd5e1; }
  .qa-control-actions a { color: #fde68a; text-decoration: underline; }
  @media (max-width: 640px) { .qa-control-bar { align-items: flex-start; flex-direction: column; } }
</style>
