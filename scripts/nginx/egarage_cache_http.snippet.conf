# Añadir dentro del bloque http { } en /etc/nginx/nginx.conf
# Crea la zona de cache para eGarage (micro-cache profesional).
# Crear antes la carpeta: sudo mkdir -p /var/cache/nginx/egarage
#   sudo chown -R www-data:www-data /var/cache/nginx

proxy_cache_path /var/cache/nginx/egarage
    levels=1:2
    keys_zone=egarage_cache:100m
    max_size=1g
    inactive=60m
    use_temp_path=off;
